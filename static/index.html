<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimePilot</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
/* =====================================================================
   TimePilot Glass - frosted-glass skin. Pure presentation: every id, class
   and data attribute the script relies on is unchanged.
   ===================================================================== */
:root{ --r:18px; --gap:16px; --rail:78px; --pad:18px; }

/* ---- themes: glass tint, card tint, hairline, ambient light orbs ---- */
[data-theme="dark"]{
  /* "Ink": true-black, monochrome, no ambient colour - deliberately unlike the tinted themes */
  color-scheme:dark;
  --bg:#000; --surface:rgba(12,12,13,.80); --surface-strong:rgba(8,8,9,.96);
  --surface2:rgba(255,255,255,.045); --line:rgba(255,255,255,.08); --hi:rgba(255,255,255,.06);
  --text:#ececee; --muted:#85858c; --accent:#e4e4e8; --accent-text:#0a0a0b;
  --cat-general:#7aa2d6; --cat-secops:#e0644f; --cat-change:#a58fd6;
  --cal:#2b3038; --danger:#e0644f; --ok:#4ade80; --lcd-bg:rgba(255,255,255,.04);
  --orb1:rgba(255,255,255,.035); --orb2:rgba(255,255,255,.02); --orb3:rgba(255,255,255,.025);
  --shadow:0 24px 60px -24px rgba(0,0,0,.95);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#ece7e0; --surface:rgba(255,255,255,.56); --surface-strong:rgba(255,255,255,.90);
  --surface2:rgba(255,255,255,.72); --line:rgba(40,25,10,.10); --hi:rgba(255,255,255,.85);
  --text:#2a2420; --muted:#7b7269; --accent:#e8621a; --accent-text:#fff;
  --cat-general:#2f6ea5; --cat-secops:#c0392b; --cat-change:#7d4fc2;
  --cal:#6f88a3; --danger:#c0392b; --ok:#1f9d55; --lcd-bg:rgba(20,28,38,.88);
  --orb1:rgba(255,150,80,.45); --orb2:rgba(140,120,255,.28); --orb3:rgba(255,200,140,.40);
  --shadow:0 24px 50px -26px rgba(60,35,10,.35);
}
[data-theme="htb"]{
  color-scheme:dark;
  --bg:#0a121d; --surface:rgba(24,34,50,.58); --surface-strong:rgba(18,27,41,.88);
  --surface2:rgba(159,239,0,.05); --line:rgba(160,190,240,.12); --hi:rgba(200,225,255,.10);
  --text:#c5d1e6; --muted:#7d8bab; --accent:#9fef00; --accent-text:#0c1420;
  --cat-general:#04d9ff; --cat-secops:#ff3e3e; --cat-change:#cf8dfb;
  --cal:#2f4664; --danger:#ff3e3e; --ok:#9fef00; --lcd-bg:rgba(0,0,0,.42);
  --orb1:rgba(159,239,0,.16); --orb2:rgba(4,217,255,.18); --orb3:rgba(207,141,251,.12);
  --shadow:0 24px 60px -24px rgba(0,0,0,.8);
}
[data-theme="dracula"]{
  color-scheme:dark;
  --bg:#181a24; --surface:rgba(40,42,58,.58); --surface-strong:rgba(33,34,48,.88);
  --surface2:rgba(189,147,249,.07); --line:rgba(255,255,255,.10); --hi:rgba(255,255,255,.10);
  --text:#f8f8f2; --muted:#8a94c2; --accent:#bd93f9; --accent-text:#1d1830;
  --cat-general:#8be9fd; --cat-secops:#ff5555; --cat-change:#bd93f9;
  --cal:#3a3f5c; --danger:#ff5555; --ok:#50fa7b; --lcd-bg:rgba(0,0,0,.42);
  --orb1:rgba(189,147,249,.30); --orb2:rgba(255,121,198,.18); --orb3:rgba(139,233,253,.13);
  --shadow:0 24px 60px -24px rgba(0,0,0,.8);
}
[data-theme="aurora"]{
  color-scheme:dark;
  --bg:#050c11; --surface:rgba(15,32,40,.58); --surface-strong:rgba(10,24,31,.90);
  --surface2:rgba(190,240,255,.06); --line:rgba(160,230,255,.12); --hi:rgba(190,240,255,.13);
  --text:#e8f4f6; --muted:#7fa2ad; --accent:#2dd4bf; --accent-text:#04211d;
  --cat-general:#58a6ff; --cat-secops:#ff6b81; --cat-change:#b794f6;
  --cal:#2e5f78; --danger:#ff6b81; --ok:#34d399; --lcd-bg:rgba(0,0,0,.42);
  --orb1:rgba(45,212,191,.36); --orb2:rgba(139,92,246,.36); --orb3:rgba(56,189,248,.22);
  --shadow:0 24px 60px -24px rgba(0,0,0,.8);
}
[data-theme="bloom"]{
  /* the colourful one: a plain deep-plum background, with the colour in the accent, rings and charts */
  color-scheme:dark;
  --bg:#130a24; --surface:rgba(48,28,82,.62); --surface-strong:rgba(32,17,58,.94);
  --surface2:rgba(255,215,255,.075); --line:rgba(255,190,255,.17); --hi:rgba(255,220,255,.20);
  --text:#fcf2ff; --muted:#bca5d9; --accent:#ff5fa8; --accent-text:#2c0a1f;
  --cat-general:#7aa7ff; --cat-secops:#ff7a8a; --cat-change:#b794ff;
  --cal:#5a4aa6; --danger:#ff6b7f; --ok:#3ee6a8; --lcd-bg:rgba(0,0,0,.40);
  --orb1:rgba(255,95,168,.07); --orb2:rgba(125,80,255,.07); --orb3:rgba(255,255,255,.02);
  --shadow:0 24px 60px -24px rgba(6,0,18,.85);
}
[data-theme="cobalt"]{
  /* dark, on a deep cobalt-blue background with a bright azure accent */
  color-scheme:dark;
  --bg:#0b1c4a; --surface:rgba(22,50,112,.56); --surface-strong:rgba(11,29,76,.95);
  --surface2:rgba(150,190,255,.08); --line:rgba(150,190,255,.18); --hi:rgba(190,215,255,.17);
  --text:#ecf2ff; --muted:#8ea9d9; --accent:#4f9dff; --accent-text:#03112e;
  --cat-general:#6fb1ff; --cat-secops:#ff7a8a; --cat-change:#a98bff;
  --cal:#33559e; --danger:#ff6f86; --ok:#35e0a1; --lcd-bg:rgba(0,8,32,.45);
  --orb1:rgba(70,130,255,.30); --orb2:rgba(40,90,220,.28); --orb3:rgba(90,170,255,.16);
  --shadow:0 24px 60px -24px rgba(2,8,34,.85);
}
[data-font="sans"]{ --ff:"Inter","SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; }
[data-font="mono"]{ --ff:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace; }
[data-font="serif"]{ --ff:Georgia,"Times New Roman",serif; }

/* shared glass recipe */
nav,#strip,#modalBox{
  -webkit-backdrop-filter:blur(26px) saturate(150%); backdrop-filter:blur(26px) saturate(150%);
}
nav,#strip,.col,.panel,#timeline,#modalBox{
  border:1px solid var(--line);
  box-shadow:var(--shadow), inset 0 1px 0 var(--hi);
}

*{box-sizing:border-box;margin:0}
html{background:#0e0c0b}
body{color:var(--text);font-family:var(--ff);font-size:15px;line-height:1.45;letter-spacing:-.005em;
  min-height:100vh;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:var(--pad);padding:var(--pad);
  -webkit-font-smoothing:antialiased}
/* ambient light + grain, fixed behind everything */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    url("/static/grain.svg"),
    radial-gradient(60vmax 46vmax at 6% -6%, var(--orb1), transparent 62%),
    radial-gradient(52vmax 44vmax at 104% 16%, var(--orb2), transparent 62%),
    radial-gradient(70vmax 46vmax at 42% 112%, var(--orb3), transparent 62%),
    var(--bg)}
::selection{background:color-mix(in srgb,var(--accent) 45%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ---- controls ---- */
button{font-family:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface2);
  color:var(--text);border-radius:11px;padding:6px 12px;cursor:pointer;
  transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
button:hover{border-color:color-mix(in srgb,var(--accent) 65%,transparent);background:color-mix(in srgb,var(--accent) 10%,var(--surface2))}
button:active{transform:translateY(1px) scale(.98)}
button.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));
  color:var(--accent-text);border-color:transparent;font-weight:650;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
button.primary:hover{filter:brightness(1.07)}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.danger:hover{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.errText{color:var(--danger)!important;font-weight:600}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--surface2);color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:8px 11px;transition:border-color .15s,box-shadow .15s,background .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--muted) 55%,transparent)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 26%,transparent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox],input[type=range],input[type=radio]{accent-color:var(--accent)}
input[type=color]{padding:2px;cursor:pointer}
option{background:#1d1a18;color:#f5f0ea}
[data-theme="light"] option{background:#fff;color:#2a2420}
h1{font-size:17px;letter-spacing:.02em}
.muted{color:var(--muted)} .small{font-size:12px}

/* ---- left icon rail ---- */
nav{grid-column:1;position:sticky;top:var(--pad);align-self:start;height:calc(100vh - 2*var(--pad));z-index:50;
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0;border-radius:32px;background:var(--surface)}
nav h1.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:14px;font-size:0}
nav h1.brand img{width:40px;height:40px;}
nav .brandName{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
nav .tab{position:relative;width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid transparent;border-radius:16px;color:var(--muted);
  transition:background .18s,color .18s,transform .18s,box-shadow .18s}
nav .tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .tab:hover{background:var(--surface2);color:var(--text);border-color:var(--line);transform:translateY(-1px)}
nav .tab.on{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));
  color:var(--accent-text);border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
nav .tab.pinned::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 9px var(--accent)}
nav .tab .lbl{position:absolute;left:calc(100% + 16px);top:50%;transform:translate(-6px,-50%);opacity:0;pointer-events:none;
  white-space:nowrap;font-size:12px;font-weight:600;letter-spacing:.01em;color:var(--text);
  background:var(--surface-strong);border:1px solid var(--line);border-radius:10px;padding:5px 10px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.6);transition:opacity .15s,transform .15s}
nav .tab:hover .lbl,nav .tab:focus-visible .lbl{opacity:1;transform:translate(0,-50%)}
nav .spacer{margin-top:auto}
#saveDot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:block;margin:0 0 4px;
  box-shadow:0 0 10px var(--ok);transition:background .3s,box-shadow .3s}
#saveDot.dirty{background:var(--accent);box-shadow:0 0 10px var(--accent)}

/* ---- stage: header bar + content ---- */
.stage{grid-column:2;min-width:0}
#topbar{position:sticky;top:var(--pad);z-index:40;margin-bottom:var(--pad)}
#strip{background:var(--surface);border-radius:26px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  transition:box-shadow .4s,border-color .4s}
#strip.running{border-color:color-mix(in srgb,var(--ok) 38%,var(--line));
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
#strip .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
#strip.running .dot{background:var(--ok);animation:pulse 1.6s infinite}
/* On wide screens keep the bar on one row: the gap (auto margin on the chips) closes first, then the task label
   shrinks with an ellipsis. Below this width the bar wraps as before. */
@media(min-width:1100px){#strip{flex-wrap:nowrap}#strip>:not(.chips):not(#timerInfo){flex-shrink:0}#timerInfo{min-width:120px}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#strip.running .dot{animation:none}*{transition:none!important}section[id^="view-"],#modal.open #modalBox{animation:none!important}}
@font-face{font-family:'TP Digital';src:url('/static/digital.woff') format('woff');font-display:swap}
#elapsed.lcd{font-family:'TP Digital','Courier New',ui-monospace,monospace;font-variant-numeric:tabular-nums;
  font-size:30px;font-weight:400;letter-spacing:3px;min-width:136px;text-align:center;
  color:var(--ok);background:var(--lcd-bg);border:1px solid var(--line);border-radius:14px;padding:5px 16px 3px;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.03);
  text-shadow:0 0 8px color-mix(in srgb,var(--ok) 75%,transparent),0 0 22px color-mix(in srgb,var(--ok) 35%,transparent)}
#timerInfo{display:flex;flex-direction:column;line-height:1.2;cursor:pointer;border-radius:12px;padding:4px 10px;transition:background .15s;min-width:0}
#timerInfo:hover{background:var(--surface2)}
#timerInfo.idle{cursor:default}
#timerInfo.idle:hover{background:none}
#timerLabel{font-weight:650;font-size:15px;max-width:34ch;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timerTimes{white-space:nowrap;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
#stopBtn{background:color-mix(in srgb,var(--danger) 16%,transparent);border-color:color-mix(in srgb,var(--danger) 55%,transparent);color:var(--text)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.chip{border-radius:999px;padding:6px 14px;font-size:12px;font-weight:550}
.chip.active{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));
  color:var(--accent-text);border-color:transparent}
.stripActs{display:flex;gap:8px;align-items:center;padding-left:14px;border-left:1px solid var(--line)}
.stripActs .iconBtn{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:14px}
.stripActs .iconBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#splitBtn{height:40px;border-radius:14px;padding:0 14px}
#splitBtn.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

main{padding:0;max-width:none;margin:0}
main.split{display:flex;gap:var(--gap);align-items:flex-start}
main.split > section{flex:1 1 0;min-width:0}
@media(max-width:900px){
  main.split{display:block}
  main.split > section.paneL{display:none!important}
}
section[id^="view-"]{animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- board ---- */
#board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--gap);align-items:start}
.col{background:var(--surface);border-radius:var(--r);padding:14px;min-height:130px;transition:border-color .15s,box-shadow .2s}
.col.dragover{border-color:var(--accent);box-shadow:var(--shadow),0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.col h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center}
.col h2 > span{display:flex;align-items:center}
.card{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:14px;padding:11px 13px;margin-bottom:10px;cursor:grab;
  transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));
  box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}
.card .title{font-weight:620;font-size:14px;letter-spacing:-.01em}
.card .meta{display:flex;gap:6px;align-items:center;margin-top:7px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.card .meta button{padding:2px 7px;font-size:11px;flex:none;border-radius:9px}
.card .meta .metaSpacer{flex:1 1 auto;min-width:0}
.card .meta .hasDet{cursor:pointer;font-size:12px;line-height:1}
.badge{padding:2px 9px;border-radius:999px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.addRow select{font-size:12px;padding:5px;max-width:82px}
.addRow{display:flex;gap:6px;margin-top:6px}
.addRow input{flex:1;min-width:0}

/* ---- today timeline ---- */
#todayWrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:var(--gap)}
@media(max-width:820px){#todayWrap{grid-template-columns:1fr}}
#timeline{position:relative;background:var(--surface);border-radius:var(--r)}
.hourRow{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:3px 12px}
.block{position:absolute;left:66px;right:12px;border-radius:12px;padding:5px 10px;font-size:12px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 20px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14)}
.block .t{font-weight:650}
.block.cal{background:linear-gradient(160deg,color-mix(in srgb,var(--cal) 92%,#fff),var(--cal));color:#fff;border-left:3px solid rgba(255,255,255,.55)}
.block.lunch{background:repeating-linear-gradient(135deg,transparent,transparent 8px,var(--line) 8px,var(--line) 16px);
  color:var(--muted);border:1px dashed var(--line);box-shadow:none;pointer-events:none;font-style:italic}
.block.task{background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 70%)!important;font-weight:650;cursor:grab;user-select:none;touch-action:none;transition:transform .15s,box-shadow .15s}
.block.task:hover{box-shadow:0 12px 26px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.2)}
.block.task:active{cursor:grabbing}
.block.now{left:0;right:0;height:0;border:none;border-top:2px solid var(--accent);border-radius:0;z-index:5;padding:0;overflow:visible}
.block.now::before{content:"";position:absolute;left:-1px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}

/* markdown rendering (Clipboard) */
.mdBody{font-family:var(--ff);font-size:13px;cursor:pointer}
.mdBody h2{font-size:15px;margin:6px 0 3px} .mdBody h3{font-size:14px;margin:5px 0 2px} .mdBody h4{font-size:13px;margin:4px 0 2px}
.mdBody ul,.mdBody ol{margin:4px 0 4px 20px}
.mdBody code{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-family:ui-monospace,monospace;font-size:12px}
.mdBody pre.mdCode{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:5px 0;font-size:12px;overflow-x:auto;font-family:ui-monospace,monospace}
.mdBody a{color:var(--accent)}

.panel{background:var(--surface);border-radius:var(--r);padding:16px}
.panel h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:12px}
.slotItem{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.slotItem:last-child{border-bottom:none}
.slotItem .nm{flex:1;min-width:120px;font-size:13px}
.slotItem input[type=time]{width:100px}

/* ---- notes ---- */
#notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(280px,(100% - 3*var(--gap))/4),1fr));gap:var(--gap)}
#notes .panel{display:flex;flex-direction:column;min-width:0}
#notes .items{flex:1 1 auto}
#notes .addRow{margin-top:10px}
.noteItem{display:flex;gap:6px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.noteItem:last-child{border-bottom:none}
.noteItem .tx{flex:1;min-width:0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer;border-radius:8px;padding:3px 5px;transition:background .15s}
.noteItem .tx:hover{background:var(--surface2)}
.noteItem .tx.flash{outline:2px solid var(--ok)}
.noteItem button{flex:none}
#notes h3 .secBtns{display:flex;gap:4px;margin-left:auto}
#notes h3 .secBtns button{padding:3px 8px;font-size:11px}

/* ---- notifications ---- */
#view-notif{--accent:#ff9a3d}
[data-theme="light"] #view-notif{--accent:#d9701a}
#notifWrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:var(--gap);align-items:start}
@media(max-width:820px){#notifWrap{grid-template-columns:1fr}}
.remItem{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.remItem:last-child{border-bottom:none}
.remItem .rMain{flex:1;min-width:0}
.remItem .rMsg{font-size:13px;overflow-wrap:anywhere;margin-bottom:3px}
.remItem .rMeta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.remItem.editing{outline:1px solid var(--accent);border-radius:12px;padding:11px 8px;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.remItem .rActs{display:flex;gap:4px;flex:none}
.remItem .rActs button{padding:3px 8px;font-size:11px}
.rDue{color:var(--danger);font-weight:600}
.warnBox{background:color-mix(in srgb,var(--danger) 12%,transparent);border:1px solid var(--danger);border-radius:12px;padding:9px 12px;color:var(--text)}

.tagInputRow{display:flex;gap:8px;align-items:center}
.tagPreview{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:19px;
  background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.tagInputRow input{flex:1}
.quickTagRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quickTagRow button{flex:none;width:36px;height:36px;padding:0;font-size:17px;line-height:1;border:1px solid var(--line);
  background:var(--surface2);border-radius:11px;cursor:pointer}
.quickTagRow button:hover{transform:translateY(-2px)}
.quickTagRow button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.quickTagRow .qtEmpty{font-size:12px;color:var(--muted);align-self:center}

.toggleRow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface2);border:1px solid var(--line);
  border-radius:14px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
.toggleRow:hover,.toggleRow.on{border-color:var(--accent)}
.toggleRow.on{background:color-mix(in srgb,var(--accent) 10%,var(--surface2))}
.toggleSwitch{position:relative;width:40px;height:22px;flex:none}
.toggleSwitch input{opacity:0;width:0;height:0;position:absolute}
.toggleSlider{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:.2s;pointer-events:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.toggleSlider::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;
  transition:.2s cubic-bezier(.3,.7,.3,1);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.toggleSwitch input:checked + .toggleSlider{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));
  box-shadow:0 0 14px -2px color-mix(in srgb,var(--accent) 70%,transparent)}
.toggleSwitch input:checked + .toggleSlider::before{transform:translateX(18px)}
.recurOpts{display:none;margin-top:8px;padding:12px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:14px}
.recurOpts.on{display:block}
.recurInputs{display:grid;grid-template-columns:76px 1fr;gap:10px;margin-top:8px}
.dayRow{display:flex;gap:6px;margin-top:8px}
.dayRow button{flex:1;min-width:0;padding:8px 0;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted)}
.dayRow button.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}

/* ---- export ---- */
#exportWrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap)}
@media(max-width:1100px){#exportWrap{grid-template-columns:1fr}}
#exportWrap .panel{min-width:0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
#exportTable{table-layout:fixed;width:100%;min-width:520px}
#exportTable th:nth-child(1),#exportTable td:nth-child(1){width:auto}
#exportTable th:nth-child(2),#exportTable td:nth-child(2){width:88px}
#exportTable th:nth-child(3),#exportTable td:nth-child(3),
#exportTable th:nth-child(4),#exportTable td:nth-child(4){width:82px}
#exportTable th:nth-child(5),#exportTable td:nth-child(5){width:70px}
#exportTable th:nth-child(6),#exportTable td:nth-child(6){width:70px}
td,th{padding:6px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
td input{width:100%;padding:4px 7px;font-size:13px;border-radius:9px}
#entryRows td:nth-child(2){max-width:0}
#entryRows select{width:100%;min-width:70px;font-size:12px}
td input[type=time]{width:78px;padding:4px 3px;font-size:12px}
td input[type=number]{width:58px}
.labCell{display:flex;align-items:center;gap:5px;white-space:nowrap}
.labCell input{flex:1;min-width:50px;width:auto}
.rowActs{white-space:nowrap}
.rowActs .actWrap{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.rowActs button{padding:3px 8px;line-height:1.4}
#entryRows tr.overlap td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
#entryRows tr.overlap td:nth-child(3) input,#entryRows tr.overlap td:nth-child(4) input{border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
#entryRows tr.gapAfter td{border-bottom:2px solid color-mix(in srgb,var(--ok) 70%,transparent)}
tr.rowDirty td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
pre#exportText{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;
  white-space:pre-wrap;font-size:13px;font-family:ui-monospace,monospace;min-height:140px}

/* ---- snippets / clipboard libraries ---- */
#view-snips{--accent:#c3a0ff}
[data-theme="light"] #view-snips{--accent:#8b5fd0}
.libGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(280px,(100% - 3*var(--gap))/4),1fr));gap:var(--gap);align-items:start}
.libCard .hd{margin-bottom:2px}
.libCard .hd strong{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libCard .hd2{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;margin-bottom:4px;min-height:26px}
.libCard .hd2 button{padding:3px 9px;font-size:11px;flex:none}
.libCard .desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.3em}
.tagB{border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:999px;padding:1px 9px;font-size:10px;font-weight:600;letter-spacing:.05em;flex:none}
.libBody{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;
  font-size:12px;line-height:1.5;height:calc(4 * 1.5em + 20px);overflow:auto;white-space:pre-wrap;word-break:break-word;
  cursor:pointer;font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;transition:border-color .15s}
[data-theme="light"] .libBody{background:rgba(255,255,255,.55)}
.libBody:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.libBody.flash{outline:2px solid var(--ok)}
.libBody.mdBody{white-space:normal;font-family:var(--ff);font-size:13px}
.libBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.libChips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.libBar > [data-search]{flex:0 1 220px;min-width:120px;margin-left:auto;border-radius:999px;padding-left:14px}
.libBar .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- scratchpad ---- */
.scrPanel{display:flex;flex-direction:column;gap:10px}
.scrTools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.scrTools button{padding:4px 10px;font-size:12px}
.scrTools button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.scrTools input{flex:0 1 180px;min-width:110px;font-size:13px;padding:5px 9px}
.scrTools label{display:flex;align-items:center;gap:4px;cursor:pointer}
.scrTools label input{flex:none;min-width:0}
#scrTabs{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.scrTab{display:flex;align-items:center;gap:7px;padding:5px 11px;font-size:12px;color:var(--muted);border-radius:999px}
.scrTab.on{color:var(--text);border-color:var(--accent);font-weight:650;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.scrTab .x{font-size:10px;padding:0 2px;border-radius:4px;opacity:.6}
.scrTab .x:hover{opacity:1;color:var(--danger)}
input.scrRename{font-size:12px;padding:1px 5px;width:120px;min-width:0}
#scrEditor{display:flex;background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  height:calc(100vh - 400px);min-height:240px;box-shadow:inset 0 2px 10px rgba(0,0,0,.25)}
[data-theme="light"] #scrEditor{background:rgba(255,255,255,.6);box-shadow:inset 0 1px 4px rgba(0,0,0,.08)}
#scratchGutter,#scratchTA{font-family:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
#scratchGutter{flex:none;overflow:hidden;text-align:right;padding:10px 8px;background:rgba(255,255,255,.03);
  color:var(--muted);border-right:1px solid var(--line);user-select:none;white-space:pre}
#scratchTA{flex:1;min-width:0;resize:none;border:none;border-radius:0;background:transparent;padding:10px 12px;
  white-space:pre-wrap;overflow-wrap:break-word;tab-size:4;box-shadow:none}
#scratchTA:focus{outline:none;box-shadow:none}
#scratchMirror{position:absolute;visibility:hidden;top:-9999px;left:0;padding:0;border:0;white-space:pre-wrap;overflow-wrap:break-word}

/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(6,4,3,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
#modal.open{display:flex}
#modal.open #modalBox{animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
#modalBox{background:var(--surface-strong);border-radius:26px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.8),inset 0 1px 0 var(--hi)}
#modalBox h3{margin-bottom:14px;font-size:18px;letter-spacing:-.01em}
.fRow{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fRow label{font-size:12px;font-weight:550;color:var(--muted)}
.mActions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.notice{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:12px}

[data-theme="aurora"] option{background:#0f2028;color:#e8f4f6}
[data-theme="bloom"] option{background:#1d0f36;color:#fcf2ff}
[data-theme="cobalt"] option{background:#0f2358;color:#ecf2ff}

/* ---- page headers, stat tiles, segmented controls (Dashboard / Tasks / Insights / Settings) ---- */
.pageHead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:2px 2px 16px}
.pageHead .grow{flex:1 1 240px;min-width:0}
.pageHead h2{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.pageHead .sub{color:var(--muted);font-size:13px;margin-top:3px}
.pageHead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pageHead .acts button{display:inline-flex;align-items:center;gap:6px}
.pageHead .acts svg,.seg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.big{border-radius:14px;padding:9px 16px;font-size:13.5px}
.statRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:var(--gap)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-width:0;
  box-shadow:var(--shadow), inset 0 1px 0 var(--hi)}
.stat .k{font-size:12px;color:var(--muted);font-weight:550}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:3px}
.stat .d,.delta{font-size:11px;font-weight:650;color:var(--muted)}
.stat .d{margin-top:2px}
.delta{font-size:12px}
.up{color:var(--ok)!important} .down{color:var(--danger)!important}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface2);border:1px solid var(--line);border-radius:13px}
.seg button{border:none;background:transparent;border-radius:10px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px}
.seg button:hover{border-color:transparent;background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--text)}
.seg button.on{background:var(--surface-strong);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.28), inset 0 1px 0 var(--hi)}
.ph{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.ph .t{font-size:16px;font-weight:650;letter-spacing:-.01em}
.ph .s{font-size:12px;color:var(--muted);margin-top:1px}
.ph .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.linkBtn{background:none;border:none;color:var(--accent);padding:2px 4px;font-size:12px;font-weight:650;border-radius:6px}
.linkBtn:hover{background:none;border:none;text-decoration:underline}
.emptyNote{color:var(--muted);font-size:13px;padding:10px 2px}
.catDot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:12px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.leg .dash{display:inline-block;width:16px;height:0;border-top:2px dashed var(--muted);margin-right:6px;vertical-align:middle}
.leg .solid{display:inline-block;width:16px;height:0;border-top:2px solid var(--accent);margin-right:6px;vertical-align:middle}
.leg b{color:var(--text);font-weight:600}

/* ---- tooltip shared by every chart ---- */
#tip{position:fixed;z-index:80;pointer-events:none;display:none;max-width:280px;background:var(--surface-strong);
  border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:12px;
  box-shadow:0 16px 36px -12px rgba(0,0,0,.7), inset 0 1px 0 var(--hi)}
#tip .th{font-weight:650;color:var(--muted);margin-bottom:4px}
#tip .tr{display:flex;gap:8px;align-items:center;white-space:nowrap;line-height:1.55}
#tip .tr i{width:10px;height:3px;border-radius:2px;flex:none}
#tip .tr b{margin-left:auto;padding-left:14px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---- dashboard ---- */
#dashGrid,#insGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:stretch}
#insGrid .wide{grid-column:1 / -1}
@media(max-width:900px){#dashGrid,#insGrid{grid-template-columns:minmax(0,1fr)}}
main.split #dashGrid,main.split #insGrid{grid-template-columns:minmax(0,1fr)}
.ringWrap{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;padding:4px 0}
.rings{width:168px;height:168px;flex:none}
.rings circle{fill:none;stroke-width:9;stroke-linecap:round}
.rings .trk{stroke:var(--line)}
.ringLeg{display:flex;flex-direction:column;gap:14px}
.ringLeg .li{display:flex;gap:10px;align-items:center}
.ringLeg .bar{width:4px;height:34px;border-radius:3px;flex:none}
.ringLeg .n{font-size:20px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.ringLeg .n small{font-size:13px;color:var(--muted);font-weight:600}
.ringLeg .l{font-size:12px;color:var(--muted)}
.nextHero{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:16px;padding:14px 16px;margin-bottom:10px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,var(--surface2)),var(--surface2))}
.nextHero .when{font-size:12px;font-weight:650;color:var(--accent)}
.nextHero .name{font-size:19px;font-weight:700;letter-spacing:-.015em;margin:2px 0 3px;overflow-wrap:anywhere}
.nextHero .meta{font-size:12px;color:var(--muted)}
.agendaItem{display:flex;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.agendaItem:last-child{border-bottom:none}
.agendaItem .bar{width:3px;align-self:stretch;min-height:20px;border-radius:3px;flex:none}
.agendaItem .nm{flex:1;min-width:0;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agendaItem .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.agendaItem.past{opacity:.5}
.taskRow{display:flex;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.taskRow:last-child{border-bottom:none}
.taskRow .main{flex:1;min-width:0}
.taskRow .ti{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taskRow.done .ti,#taskTable tr.done .tt{text-decoration:line-through;color:var(--muted)}
.taskRow .mt{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.taskRow .go{flex:none;padding:3px 9px;font-size:11px}
.chk{flex:none;width:20px;height:20px;padding:0;border-radius:50%;border:2px solid var(--muted);background:transparent;
  display:inline-flex;align-items:center;justify-content:center;color:transparent}
.chk:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.chk svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.weekHero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.weekHero .big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.weekHero .what{font-size:13px;color:var(--muted)}
.barRow{display:flex;gap:6px;height:132px;margin-top:10px}
.barSlot{flex:1;min-width:0;position:relative;border-radius:10px;outline:none}
.barSlot:hover,.barSlot:focus-visible,.chSlot:hover,.chSlot:focus-visible{background:color-mix(in srgb,var(--text) 6%,transparent)}
.barSlot .bar1{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:24px;height:var(--h);min-height:3px;
  border-radius:6px 6px 0 0;background:color-mix(in srgb,var(--accent) 45%,transparent)}
.barSlot.now .bar1{background:var(--accent)}
.barSlot.future .bar1{background:var(--line)}
.barSlot .bv{position:absolute;left:0;right:0;bottom:calc(var(--h) + 4px);text-align:center;font-size:11px;font-weight:650;color:var(--muted)}
.barSlot.now .bv{color:var(--text)}
.barLbls{display:flex;gap:6px;margin-top:6px}
.barLbls span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted)}
.barLbls span.now{color:var(--text);font-weight:650}
.stackBar{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;margin:14px 0 0}
.stackBar span{display:block;min-width:3px}

/* ---- tasks page ---- */
.filterBar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:var(--gap);padding:8px 10px;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow), inset 0 1px 0 var(--hi)}
.filterBar select,.filterBar input{border-radius:999px;font-size:13px}
.filterBar input{flex:1 1 220px;min-width:140px;padding-left:14px}
#taskList{padding:6px 16px;overflow-x:auto}
#taskTable{min-width:680px}
#taskTable th{cursor:pointer;user-select:none;white-space:nowrap}
#taskTable th.sorted{color:var(--text)}
#taskTable th.noSort{cursor:default}
#taskTable td{padding:9px 6px}
#taskTable td.num{white-space:nowrap;color:var(--muted)}
#taskTable select{width:100%;min-width:110px;font-size:12px;padding:4px 7px}
#taskTable .tt{font-weight:600;overflow-wrap:anywhere}
#taskTable .acts{white-space:nowrap;text-align:right}
#taskTable .acts button{padding:3px 8px;font-size:11px}

/* ---- insights charts (plain HTML + a little SVG: no library, scales with its container) ---- */
.ch{display:grid;grid-template-columns:42px minmax(0,1fr);grid-template-rows:var(--chh,200px) auto;column-gap:8px}
.chY{position:relative;font-size:11px;color:var(--muted)}
.chY span{position:absolute;right:0;transform:translateY(50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.chPlot{position:relative;border-bottom:1px solid var(--line)}
.chGrid{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.chBars{position:absolute;inset:0;display:flex;gap:2px}
.chSlot{flex:1;min-width:0;position:relative;display:flex;align-items:flex-end;justify-content:center;border-radius:6px;outline:none}
.chStack{width:100%;max-width:24px;display:flex;flex-direction:column-reverse}
.chSeg{box-sizing:border-box;border-top:2px solid transparent;background-clip:padding-box;min-height:3px}
.chSeg:last-child{border-top-left-radius:6px;border-top-right-radius:6px}
.chSolo{width:100%;max-width:24px;border-radius:6px 6px 0 0;background:color-mix(in srgb,var(--accent) 45%,transparent);min-height:2px}
.chSolo.hi{background:var(--accent)}
.chVal{position:absolute;left:0;right:0;text-align:center;font-size:11px;font-weight:650;color:var(--muted);pointer-events:none}
.chX{grid-column:2;position:relative;height:18px;margin-top:6px}
.chX span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.chLine{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.chLine path{vector-effect:non-scaling-stroke;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chLine .area{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:none}
.chLine .cur{stroke:var(--accent);stroke-width:2}
.chLine .prev{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.chHit{position:absolute;inset:0;outline:none;cursor:crosshair}
.chHit:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.chCross{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);opacity:.7;pointer-events:none;display:none}
.chDot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent);transform:translate(-50%,50%);
  box-shadow:0 0 0 2px var(--surface-strong);pointer-events:none}
.insTable{width:100%;font-size:12px;border-collapse:collapse}
.insTable th,.insTable td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line)}
.insTable th:first-child,.insTable td:first-child{text-align:left}
.insTableWrap{max-height:260px;overflow:auto}
#donutBox{flex:1;display:flex;align-items:center}
#insGrid .panel{display:flex;flex-direction:column}
.donutWrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;width:100%}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:5.5;pointer-events:stroke}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut .mid b{font-size:22px;letter-spacing:-.02em;line-height:1.1}
.donut .mid span{font-size:11px;color:var(--muted)}
.catList{flex:1 1 220px;min-width:0}
.catList .row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.catList .row:last-child{border-bottom:none}
.catList .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.catList .tm,.catList .pc{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.catList .pc{min-width:38px;text-align:right}
.meter{height:10px;border-radius:6px;background:color-mix(in srgb,var(--accent) 18%,transparent);overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bigNum{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.bigNum small{font-size:22px;font-weight:600;color:var(--muted);margin-left:2px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.hbar:last-child{border-bottom:none}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hbar .tm{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar .tr{grid-column:1 / -1;height:6px;border-radius:4px;background:color-mix(in srgb,var(--text) 7%,transparent);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:4px}

/* ---- settings tab ---- */
#setWrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--gap);align-items:start}
#setMenu{position:sticky;top:104px;padding:12px}
.setWho{display:flex;gap:11px;align-items:center;padding:4px 6px 14px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.setWho b{display:block;font-size:14px}
.setWho span{font-size:12px;color:var(--muted)}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
  color:var(--accent-text);background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent))}
.setMenuItem{display:flex;width:100%;align-items:center;gap:10px;padding:7px 10px;border:1px solid transparent;background:transparent;
  border-radius:13px;text-align:left;font-size:13px;font-weight:600;margin-bottom:2px}
.setMenuItem:hover{background:var(--surface2);border-color:var(--line)}
.setMenuItem.on{background:var(--surface-strong);border-color:var(--line)}
.setMenuItem .go{margin-left:auto;color:var(--muted);font-size:15px;line-height:1}
.ico{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.c1{background:linear-gradient(150deg,#6d9bff,#3a68dc)} .ico.c2{background:linear-gradient(150deg,#ff7aa8,#e0407a)}
.ico.c3{background:linear-gradient(150deg,#b690ff,#7d52e0)} .ico.c4{background:linear-gradient(150deg,#ffb066,#e8782a)}
.ico.c5{background:linear-gradient(150deg,#4fd9b3,#1fa585)} .ico.c6{background:linear-gradient(150deg,#ff8a7a,#e04f4f)}
.ico.c7{background:linear-gradient(150deg,#7fc4ff,#3b8fd9)} .ico.c8{background:linear-gradient(150deg,#a6b0c0,#6b7686)}
.setCard{scroll-margin-top:104px;margin-bottom:var(--gap)}
.setCard .ph{margin-bottom:4px}
.setRow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.setRow .tx{flex:1;min-width:0}
.setRow .tx b{display:block;font-size:14px;font-weight:600}
.setRow .tx span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.setRow .ctl{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.setRow.stk{flex-direction:column;align-items:stretch;gap:8px}
.setRow.stk .ctl{display:block;width:100%}
.setRow .ctl input[type=time]{width:106px}
.setRow .ctl input[type=number]{width:84px}
.setRow input[type=text],.setRow input[type=url],.setRow textarea{width:100%}
.setRow .ctl button{display:inline-flex;align-items:center;gap:6px}
.setRow .ctl button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.setMsg{font-size:12px}
.toggleSwitch input:focus-visible + .toggleSlider{outline:2px solid var(--accent);outline-offset:2px}
.mgrRow{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.mgrRow input[type=text]{flex:1 1 150px;min-width:0}
.mgrRow input[type=color]{width:40px;height:32px;flex:none}
.mgrRow .hint{flex:none;min-width:70px;text-align:right;font-size:12px;color:var(--muted)}
.mgrRow label{flex:none;display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.themeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;padding:8px 0 4px}
.themeTile{position:relative;padding:0;border:2px solid var(--line);border-radius:15px;overflow:hidden;display:block;cursor:pointer;text-align:center}
.themeTile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.themeTile:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.themeTile.on{border-color:var(--accent)}
.themeTile.on::after{content:"✓";position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--accent);
  color:var(--accent-text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.themeTile .pvbox{display:block;color:var(--text)}
.themeTile .pv{display:block;position:relative;height:64px;
  background:radial-gradient(120% 90% at 0% 0%,var(--orb1),transparent 60%),radial-gradient(100% 90% at 100% 20%,var(--orb2),transparent 60%),
    radial-gradient(120% 100% at 40% 120%,var(--orb3),transparent 60%),var(--bg)}
.themeTile .pv i{position:absolute;background:var(--surface);border:1px solid var(--line)}
.themeTile .pv .r{left:7px;top:7px;bottom:7px;width:12px;border-radius:7px}
.themeTile .pv .c1{left:26px;top:7px;right:7px;height:16px;border-radius:6px}
.themeTile .pv .c2{left:26px;top:28px;width:38%;bottom:7px;border-radius:6px}
.themeTile .pv .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);right:12px;bottom:11px;border:none}
.themeTile .nm{display:block;padding:6px 4px;font-size:12px;font-weight:600;background:var(--surface-strong)}
@media(max-width:900px){
  #setWrap{grid-template-columns:minmax(0,1fr)}
  #setMenu{position:static;display:flex;gap:6px;overflow-x:auto;padding:8px}
  .setWho,.setMenuItem .go{display:none}
  .setMenuItem{width:auto;flex:none;white-space:nowrap;margin:0}
  .setRow{flex-wrap:wrap}
}
main.split #setWrap{grid-template-columns:minmax(0,1fr)}
main.split #setMenu{position:static;display:flex;gap:6px;overflow-x:auto;padding:8px}
main.split .setWho,main.split .setMenuItem .go{display:none}
main.split .setMenuItem{width:auto;flex:none;white-space:nowrap;margin:0}

/* ---- small screens: rail becomes a bottom dock ---- */
@media(max-width:900px){
  :root{--pad:12px}
  body{grid-template-columns:minmax(0,1fr);padding-bottom:96px}
  .stage{grid-column:1}
  nav{position:fixed;left:12px;right:12px;bottom:12px;top:auto;height:auto;flex-direction:row;justify-content:flex-start;
    overflow-x:auto;padding:8px 10px;border-radius:26px;gap:6px}
  nav h1.brand,nav .spacer,#saveDot,nav .tab .lbl{display:none}
  nav .tab{flex:none;width:46px;height:46px}
  #topbar{position:static}
  /* one tidy row (timer, label, stop, sign out) and the quick timers in a swipeable row beneath it */
  #strip{padding:8px 10px;gap:8px;border-radius:22px}
  #strip .dot{display:none}
  #elapsed.lcd{font-size:22px;min-width:92px;padding:3px 10px 1px;letter-spacing:2px;border-radius:11px}
  #timerInfo{flex:1 1 0;min-width:0;padding:2px 4px}
  #timerLabel{font-size:13px;max-width:none}
  #timerTimes{font-size:11px}
  #stopBtn{padding:5px 10px}
  .stripActs{order:2;border-left:none;padding-left:0;margin-left:0}
  .stripActs .iconBtn{width:34px;height:34px;border-radius:12px}
  #splitBtn{display:none}
  .chips{order:3;margin-left:0;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:5px 12px}
  #scrEditor{height:calc(100vh - 460px)}
}
@media(max-height:800px) and (min-width:901px){
  nav{gap:4px;padding:12px 0}
  nav .tab{width:42px;height:42px}
  nav h1.brand{margin-bottom:6px}
}
@media(max-height:620px) and (min-width:901px){
  nav{gap:2px;padding:8px 0}
  nav .tab{width:38px;height:38px}
  nav .tab svg{width:19px;height:19px}
  nav h1.brand img{width:32px;height:32px}
}
@media print{body::before{display:none}nav,#topbar{display:none}}
</style>
</head>
<body data-theme="aurora" data-font="sans">

<nav>
  <h1 class="brand"><img src="/static/logo.svg" alt=""><span class="brandName">TimePilot</span></h1>
  <button class="tab" data-view="dash" aria-label="Dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Dashboard</span></button>
  <button class="tab" data-view="board" aria-label="Tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12.5 3 3 5-6"/></svg><span class="lbl">Tasks</span></button>
  <button class="tab" data-view="today" aria-label="Planner"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span class="lbl">Planner</span></button>
  <button class="tab" data-view="insights" aria-label="Insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span class="lbl">Insights</span></button>
  <button class="tab" data-view="notes" aria-label="Notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><span class="lbl">Notes</span></button>
  <button class="tab" data-view="snips" aria-label="Snippets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg><span class="lbl">Snippets</span></button>
  <button class="tab" data-view="paste" aria-label="Clipboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1.5"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg><span class="lbl">Clipboard</span></button>
  <button class="tab" data-view="scratch" aria-label="Scratch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="lbl">Scratch</span></button>
  <button class="tab" data-view="notif" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="lbl">Notifications</span></button>
  <button class="tab" data-view="export" aria-label="Export"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span class="lbl">Export</span></button>
  <span class="spacer"></span>
  <button class="tab" data-view="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="lbl">Settings</span></button>
  <span id="saveDot" title="save state"></span>
</nav>
<div class="stage">
<div id="topbar">
<div id="strip">
  <span class="dot"></span>
  <span id="elapsed" class="lcd">00:00</span>
  <div id="timerInfo" title="Click to edit current task">
    <span id="timerLabel" class="muted">No timer running</span>
    <span id="timerTimes"></span>
  </div>
  <button id="stopBtn" style="display:none">■ Stop</button>
  <div class="chips" id="interruptChips"></div>
  <div class="stripActs">
    <button id="splitBtn" class="ghost" title="Pin this tab to the left half of the screen">&#9707; Split</button>
    <button id="logoutBtn" class="ghost iconBtn" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </div>
</div>
</div>

<main>
  <section id="view-dash" style="display:none"></section>

  <section id="view-board" style="display:none">
    <div id="taskHead"></div>
    <div id="taskBar" class="filterBar"></div>
    <div id="board"></div>
    <div id="taskList" class="panel" style="display:none"></div>
  </section>

  <section id="view-today" style="display:none">
    <div class="notice" id="calNotice" style="display:none"></div>
    <div id="todayWrap">
      <div id="timeline"></div>
      <div>
        <div class="panel" style="margin-bottom:12px">
          <h3 style="display:flex;align-items:center"><span>Unslotted today</span><button id="calRefresh" class="ghost small" style="margin-left:auto">↻ refresh cal</button></h3>
          <div id="unslotted"></div>
        </div>
        <div class="panel">
          <h3>Slotted</h3>
          <div id="slotted"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="view-insights" style="display:none"></section>

  <section id="view-notes" style="display:none">
    <div style="margin-bottom:10px;display:flex;gap:6px">
      <input id="newSection" placeholder="New section name..." style="max-width:240px">
      <button id="addSection">Add section</button>
    </div>
    <div id="notes"></div>
  </section>

  <section id="view-snips" style="display:none"></section>
  <section id="view-paste" style="display:none"></section>

  <section id="view-scratch" style="display:none">
    <div class="panel scrPanel">
      <div id="scrTabs"></div>
      <div class="scrTools">
        <button id="scrMinus" title="Smaller text">A-</button>
        <span class="small muted" id="scrSize"></span>
        <button id="scrPlus" title="Larger text">A+</button>
        <button id="scrWrap" title="Toggle word wrap">Wrap</button>
        <button id="scrNums" title="Toggle line numbers">Line numbers</button>
        <span style="margin-left:auto"></span>
        <button id="scrCopy">Copy all</button>
        <button id="scrDl">Download</button>
        <button id="scrClear" class="danger">Clear</button>
      </div>
      <div class="scrTools">
        <input id="scrFind" placeholder="Find...">
        <input id="scrRepl" placeholder="Replace with...">
        <label class="small muted" title="Match case"><input type="checkbox" id="scrCase"> Case</label>
        <label class="small muted" title="Treat the find box as a regular expression ($1 works in the replacement)"><input type="checkbox" id="scrRegex"> Regex</label>
        <button id="scrNext">Find next</button>
        <button id="scrRep">Replace</button>
        <button id="scrRepAll">Replace all</button>
        <span class="small muted" id="scrCount"></span>
      </div>
      <div class="scrTools">
        <span class="small muted">Transform (selection, or all):</span>
        <button data-tf="blanks">Remove blank lines</button>
        <button data-tf="trail">Trim trailing space</button>
        <button data-tf="dedupe">Remove duplicates</button>
        <button data-tf="sortA">Sort A-Z</button>
        <button data-tf="sortZ">Sort Z-A</button>
        <button data-tf="rev">Reverse</button>
        <button data-tf="upper">UPPER</button>
        <button data-tf="lower">lower</button>
      </div>
      <div id="scrEditor">
        <div id="scratchGutter"></div>
        <textarea id="scratchTA" spellcheck="false" placeholder="Scratch space - autosaves as you type."></textarea>
      </div>
      <div class="small muted" id="scrStatus"></div>
      <div id="scratchMirror" aria-hidden="true"></div>
    </div>
  </section>

  <section id="view-notif" style="display:none">
    <div id="notifWrap">
      <div class="panel">
        <h3 id="remFormTitle">New reminder</h3>
        <div id="remWarn" class="small" style="display:none;margin-bottom:10px"></div>
        <div class="fRow"><label>Message</label>
          <textarea id="remMsg" rows="3" maxlength="500" placeholder="What should the notification say?"></textarea></div>
        <div class="fRow"><label>When</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input id="remDate" type="date"><input id="remTime" type="time">
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
            <button class="ghost small" data-quick="30">+30m</button>
            <button class="ghost small" data-quick="60">+1h</button>
            <button class="ghost small" data-quick="180">+3h</button>
            <button class="ghost small" data-quick="1440">Tomorrow</button>
          </div></div>
        <div class="fRow"><label>Priority: <span id="remPrioVal">3</span></label>
          <input id="remPrio" type="range" min="1" max="5" step="1" value="3" style="width:100%">
          <div style="display:flex;justify-content:space-between" class="small muted">
            <span>Min</span><span>Low</span><span>Default</span><span>High</span><span>Urgent</span></div></div>
        <div class="fRow"><label>Tag</label>
          <div class="tagInputRow">
            <span id="remTagPreview" class="tagPreview">🔔</span>
            <input id="remTag" maxlength="60" placeholder="Paste an emoji, or type a shortcode" list="tagList">
          </div>
          <div id="remTagWarn" class="small errText" style="display:none"></div>
          <div class="quickTagRow" id="quickTagRow"></div>
          <datalist id="tagList">
            <option value="alarm_clock"><option value="mailbox_with_mail"><option value="warning">
            <option value="rotating_light"><option value="calendar"><option value="computer">
            <option value="bulb"><option value="white_check_mark">
          </datalist></div>
        <div class="fRow"><label>Repeat</label>
          <label class="toggleRow" id="remRecurRow">
            <span class="toggleSwitch"><input type="checkbox" id="remRecur"><span class="toggleSlider"></span></span>
            <span>Repeat this reminder</span>
          </label>
          <div id="remRecurOpts" class="recurOpts">

<script>
"use strict";
/* ================= state ================= */
let S = null;               // server state
let dirty = false, saveT = null;
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const THEMES = [["dark","Dark"],["light","Light"],["htb","HackTheBox"],["dracula","Dracula"],["aurora","Aurora"],["bloom","Bloom"],["cobalt","Cobalt"]];
const FONTS = [["sans","Sans"],["mono","Mono"],["serif","Serif"]];
const pad = n => String(n).padStart(2,"0");
// The local calendar day as YYYY-MM-DD. (toISOString() is UTC, which puts the date a day out for hours each day.)
const isoOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO = () => isoOf(new Date());
const COL_DEFAULTS = [
  {k:"today", label:"Today"},
  {k:"high",  label:"High Priority"},
  {k:"med",   label:"Medium Priority"},
  {k:"low",   label:"Low Priority"},
  {k:"done",  label:"Done", done:true},
];
const COL_MAX = 6;
// The original hardcoded columns, in order. Used once, to map tasks onto the
// defaults above for accounts that predate configurable columns.
const COL_LEGACY = ["today","week","nextweek","nextmonth","done"];

function getCols(){
  const raw = S.settings.columns;
  if(!Array.isArray(raw) || !raw.length) return COL_DEFAULTS.map(c=>({...c}));
  const out = raw.filter(c => c && typeof c === "object" && c.k).slice(0, COL_MAX).map(c => ({
    k: String(c.k),
    label: (typeof c.label === "string" && c.label.trim()) ? c.label.trim() : String(c.k),
    done: !!c.done,
  }));
  if(!out.length) return COL_DEFAULTS.map(c=>({...c}));
  let seen = false;                      // at most one done column
  out.forEach(c => { if(!c.done) return; if(seen) c.done = false; else seen = true; });
  return out;
}
// Whatever sits first is the column the Today tab works from.
const firstColK = () => getCols()[0].k;
const doneColK = () => (getCols().find(c=>c.done) || {}).k || null;
const colLabel = k => (getCols().find(c=>c.k===k) || {}).label || k;

// Accounts created before columns were configurable have no settings.columns
// and tasks sitting in the old keys, so map them onto the new defaults by
// position - This Week becomes High Priority, Next Week becomes Medium, and
// so on. Nothing is orphaned and nothing is piled into Today.
function migrateColumns(){
  if(Array.isArray(S.settings.columns) && S.settings.columns.length) return;
  S.settings.columns = COL_DEFAULTS.map(c=>({...c}));
  const map = {};
  COL_LEGACY.forEach((old, i) => { if(COL_DEFAULTS[i]) map[old] = COL_DEFAULTS[i].k; });
  S.tasks.forEach(t => { if(map[t.column] && map[t.column] !== t.column) t.column = map[t.column]; });
  markDirty();
}
// Safety net for tasks pointing at a column that no longer exists.
function reconcileColumns(){
  const valid = new Set(getCols().map(c=>c.k)), first = firstColK(), done = doneColK();
  let changed = false;
  S.tasks.forEach(t => {
    if(!valid.has(t.column)){ t.column = first; changed = true; }
    if(t.column !== first && t.slot){ t.slot = null; changed = true; }
    if(t.column !== done && t.doneAt){ t.doneAt = null; changed = true; }
  });
  if(changed) markDirty();
}
const DEF_CATS = [{k:"general",label:"General",color:"#5b9bd5"},{k:"meetings",label:"Meetings",color:"#57b76a"},{k:"admin",label:"Admin",color:"#a17ae0"}];
const getCats = () => (S.settings.categories && S.settings.categories.length) ? S.settings.categories : DEF_CATS;
const allCats = () => [...getCats(), {k:"meeting",label:"Meeting",color:null}];
const catOf = k => allCats().find(c=>c.k===k);
const catName = k => (catOf(k)||{label:"?"}).label;
const defCat = () => getCats()[0].k;
const catColorRaw = k => k==="meeting"
  ? (getComputedStyle(document.body).getPropertyValue("--cal").trim() || "#3d566e")
  : ((catOf(k)||{}).color || "#888888");
const catColor = k => safeColor(catColorRaw(k));
const txtOn = hex => { const n = parseInt(hex.replace("#",""),16);
  return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255)) > 150 ? "#141414" : "#ffffff"; };
const badgeHtml = k => { const c = catColor(k);
  return `<span class="badge" style="background:${c};color:${txtOn(c)}">${esc(catName(k))}</span>`; };
const entCat = e => e.category || (e.source==="cal" ? "meeting"
  : ((S.tasks.find(x=>x.id===e.taskId)||{}).category || defCat()));
let view = "dash", calCache = {};

async function loadState(){
  const r = await fetch("/api/state");
  if(r.status === 401 || r.redirected){ location.href = "/login"; return; }
  S = await r.json(); migrateColumns(); reconcileColumns(); dailyCleanup(); seedCompleted(); applySettings(); renderAll(); loadWho();
  // Warm today's calendar in the background rather than waiting for
  // whichever tab happens to trigger the first fetch of the day (often
  // Export). The server caches raw ICS bytes for 5 minutes (CACHE_TTL in
  // app.py) but still re-parses/re-expands recurring events on every call,
  // so a cold cache means a real network round-trip to the ICS URL - that
  // wait just gets moved here, off the critical path, instead of landing
  // on whichever click triggers it. importCalToLog also materializes
  // today's meetings into S.timelog, so a later renderExport()'s own
  // (idempotent, dedup'd via S.calSeen) call finds nothing new to import.
  // Deliberately not awaited - initial render above shouldn't wait on it,
  // and a failure here (no calendar configured, fetch error) is silently
  // fine since every real call site already handles that itself.
  importCalToLog(todayISO()).catch(()=>{});
}
function markDirty(){
  dirty = true; $("#saveDot").classList.add("dirty");
  clearTimeout(saveT); saveT = setTimeout(persist, 600);
}
let _persistPromise = null;
async function persist(){
  while(_persistPromise) await _persistPromise;   // don't overlap writes - wait for one already in flight first
  const snapshot = JSON.stringify(S);
  _persistPromise = (async () => {
    try {
      const r = await fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:snapshot});
      if(!r.ok) throw new Error("save failed "+r.status);
      // only clear the flag if nothing changed while this write was in flight
      if(JSON.stringify(S) === snapshot){ dirty = false; $("#saveDot").classList.remove("dirty"); }
    } catch(e){
      // leave dirty set so a later markDirty/persist retries; surface nothing intrusive
    } finally {
      _persistPromise = null;
    }
  })();
  return _persistPromise;
}
function persistBeacon(){
  try { navigator.sendBeacon("/api/state", new Blob([JSON.stringify(S)], {type:"application/json"})); }
  catch(e){}
}

/* ================= helpers ================= */
const hmNow = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const hmToMin = hm => { const [h,m]=hm.split(":").map(Number); return h*60+m; };
const minToHM = m => pad(Math.floor(m/60))+":"+pad(m%60);
const fmtDur = m => { m=Math.max(0,Math.round(m)); const h=Math.floor(m/60); return (h? h+"h ":"")+(m%60)+"m"; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ascii = s => String(s).replace(/[\u2010-\u2015\u2212]/g,"-").replace(/\u2026/g,"...");
// only allow #hex / rgb() / named colours into style attributes (defence-in-depth vs hand-edited category JSON)
const safeColor = c => (typeof c === "string" && /^(#[0-9a-fA-F]{3,8}|rgb\([\d,\s.]+\)|rgba\([\d,\s.%]+\)|[a-zA-Z]+)$/.test(c.trim())) ? c.trim() : "#888888";

/* ---- calendar-day maths: dates are YYYY-MM-DD strings and the arithmetic runs in UTC, so it never shifts with the
   browser's timezone or a DST change ---- */
const isoAdd = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const isoDow = iso => (new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7;     // 0 = Mon .. 6 = Sun
const weekStartOf = iso => isoAdd(iso, -isoDow(iso));
const fmtDay = (iso, opts) => new Date(iso + "T12:00:00").toLocaleDateString(undefined, opts || {day:"numeric", month:"short"});
const plural = (n, word, many) => n + " " + (n === 1 ? word : many || word + "s");
const themeColor = name => getComputedStyle(document.body).getPropertyValue(name).trim();
const ignoredTitles = () => (S.settings.ignoreEvents || ["Private Appointment"]).map(x=>x.toLowerCase().trim()).filter(Boolean);
const shown = v => v === view || v === pinnedView();
// Re-render whichever of these views is on screen (one or both panes). Settings is left out on purpose: it edits in place.
function redraw(...ids){ ids.forEach(v => { if(shown(v)) renderView(v); }); }

// Feather-style 24px outlines, used by the page headers and the settings tab.
const ICON = {
  plus:'<path d="M12 5v14M5 12h14"/>',

  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  alarm:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M19 3l3 3"/>',
