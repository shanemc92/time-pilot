  db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  type:'<path d="M4 7V5h16v2M9 19h6M12 5v14"/>',
  coffee:'<path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h2a2 2 0 0 1 0 4h-2M7 2v2M11 2v2M15 2v2"/>',
  tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/>',
  send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  upload:'<path d="M12 15V3M7 8l5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
};
const svgIcon = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---- one tooltip for every chart. Text goes in through textContent, never innerHTML: series names are the user's own
   category and task titles. ---- */
const tip = (() => {
  const el = document.createElement("div");
  el.id = "tip"; el.setAttribute("role", "tooltip"); document.body.appendChild(el);
  const row = ([color, label, value]) => {
    const r = document.createElement("div"); r.className = "tr";
    if(color){ const i = document.createElement("i"); i.style.background = safeColor(color); r.appendChild(i); }
    const l = document.createElement("span"), v = document.createElement("b");
    l.textContent = label; v.textContent = value; r.append(l, v); return r;
  };
  return {
    show(x, y, head, rows){
      el.textContent = "";
      if(head){ const h = document.createElement("div"); h.className = "th"; h.textContent = head; el.appendChild(h); }
      (rows || []).forEach(r => el.appendChild(row(r)));
      el.style.display = "block";
      const w = el.offsetWidth, h = el.offsetHeight;
      let left = x + 14, top = y + 14;
      if(left + w > window.innerWidth - 8) left = x - w - 14;
      if(top + h > window.innerHeight - 8) top = y - h - 14;
      el.style.left = Math.max(8, left) + "px"; el.style.top = Math.max(8, top) + "px";
    },
    hide(){ el.style.display = "none"; },
  };
})();
// get(event) -> [heading, [[colour|null, label, value], ...]]. Shows on hover and on keyboard focus.
function tipOn(node, get){
  const at = e => { const [h, r] = get(e); tip.show(e.clientX, e.clientY, h, r); };
  node.addEventListener("pointerenter", at);
  node.addEventListener("pointermove", at);
  node.addEventListener("pointerleave", tip.hide);
  node.addEventListener("focus", () => {
    const b = node.getBoundingClientRect(), x = b.left + b.width / 2, y = b.top;
    const [h, r] = get({clientX:x, clientY:y}); tip.show(x, y, h, r);
  });
  node.addEventListener("blur", tip.hide);
}

/* ---- finished tasks ----
   A task leaves the board the day after it is done, so every completion is also written to S.completed. The
   Dashboard and Insights count from that, not from the board. */
function recordDone(t){
  const list = S.completed = S.completed || [];
  const r = list.find(x => x.taskId === t.id);
  if(r){ r.title = t.title; r.category = t.category; r.est = t.est || 30; return; }
  list.push({id:uid(), taskId:t.id, title:t.title, category:t.category, est:t.est || 30, date:t.doneAt || todayISO()});
}
function unrecordDone(t){ if(S.completed) S.completed = S.completed.filter(x => x.taskId !== t.id); }
// Every column change goes through here, so slot, doneAt and the completion record can't drift apart.
function moveTask(t, key){
  const first = firstColK(), doneK = doneColK(), wasDone = !!doneK && t.column === doneK;
  t.column = key;
  if(key !== first) t.slot = null;
  if(doneK && key === doneK){ t.doneAt = t.doneAt || todayISO(); recordDone(t); }
  else { t.doneAt = null; if(wasDone) unrecordDone(t); }
}
// Tasks already sitting in the done column when this version first loads have no record yet.
function seedCompleted(){
  if(!Array.isArray(S.completed)) S.completed = [];
  const doneK = doneColK(); if(!doneK) return;
  S.tasks.forEach(t => {
    if(t.column === doneK && t.doneAt && !S.completed.some(x => x.taskId === t.id)){ recordDone(t); markDirty(); }
  });
}

/* ---- time totals ----
   A calendar meeting is in the log with its scheduled times (importCalToLog), so one later today would count in full
   before it has happened. Today's totals take only the part that has elapsed. */
function loggedMin(e, today, nowM){
  if(e.date !== today || e.source !== "cal") return e.minutes;
  const s = hmToMin(e.start), en = hmToMin(e.end);
  return nowM >= en ? e.minutes : Math.max(0, nowM - s);
}

/* ================= settings/theme ================= */
function applySettings(){
  const validThemes = THEMES.map(t=>t[0]), validFonts = FONTS.map(f=>f[0]);
  if(!validThemes.includes(S.settings.theme)) S.settings.theme = "aurora";
  if(!validFonts.includes(S.settings.font)) S.settings.font = "sans";
  document.body.dataset.theme = S.settings.theme;
  document.body.dataset.font = S.settings.font;
}

/* ================= timer ================= */
function startTimer(label, taskId, category){
  stopTimer();
  S.activeTimer = { label, taskId: taskId || null, category: category || null, start: new Date().toISOString() };
  markDirty(); renderStrip(); redraw("dash");
}
function stopTimer(){
  if(!S.activeTimer) return;
  const t = S.activeTimer, start = new Date(t.start), end = new Date();
  const mins = Math.max(1, Math.round((end - start)/60000));
  const cat = t.category || ((S.tasks.find(x=>x.id===t.taskId)||{}).category) || defCat();
  S.timelog.push({ id:uid(), date: isoOf(start), label:t.label, taskId:t.taskId, category:cat,
    start: pad(start.getHours())+":"+pad(start.getMinutes()), end: hmNow(), minutes: mins });
  S.activeTimer = null;
  markDirty(); renderStrip(); if(view==="export") renderExport(); redraw("dash", "insights");
}
function renderStrip(){
  const strip = $("#strip"), t = S.activeTimer;
  strip.classList.toggle("running", !!t);
  $("#stopBtn").style.display = t ? "" : "none";
  $("#timerLabel").textContent = t ? t.label : "No timer running";
  $("#timerLabel").classList.toggle("muted", !t);
  $("#timerInfo").classList.toggle("idle", !t);
  const chips = $("#interruptChips"); chips.innerHTML = "";
  (S.settings.interrupts||[]).forEach(name=>{
    const b = document.createElement("button");
    b.className = "chip" + (t && t.label.startsWith(name) ? " active":"");
    b.textContent = name;
    b.onclick = () => interruptModal(name);
    chips.appendChild(b);
  });
  tick();
}
// Today's timelog entry with the latest end time - i.e. whatever was logged
// immediately before "now". That's the entry a backdated timer start should
// extend to meet, since it's the thing that left the gap in the first place.
function lastTimelogEntryToday(){
  const day = todayISO();
  // Calendar meetings get auto-imported into the timelog with their real
  // scheduled end time (see importCalToLog), which can be later today - a
  // meeting at 15:00 has a numerically bigger end than a task that just
  // finished at 11:00, but it hasn't happened yet. Only entries that have
  // actually ended by now are eligible to be "the last thing," or a future
  // meeting would win purely on clock arithmetic.
  const nowMin = hmToMin(hmNow());
  let best = null, bestMin = -1;
  S.timelog.forEach(e => {
    if(e.date !== day) return;
    const m = hmToMin(e.end);
    if(m > nowMin) return;
    if(m > bestMin){ best = e; bestMin = m; }
  });
  return best;
}
async function editTimerModal(){
  const t = S.activeTimer; if(!t) return;
  const st = new Date(t.start);
  const curCat = t.category || ((S.tasks.find(x=>x.id===t.taskId)||{}).category) || defCat();
  openModal(`<h3>Edit current task</h3>
    <div class="fRow"><label>Task name</label><input id="etName" value="${esc(t.label)}"></div>
    <div class="fRow"><label>Category</label><select id="etCat">${allCats().map(c=>`<option value="${esc(String(c.k))}"${curCat===c.k?" selected":""}>${esc(c.label)}</option>`).join("")}</select></div>
    <div class="fRow"><label>Start time (now: running ${fmtDur((Date.now()-st)/60000)})</label><input id="etStart" type="time" value="${pad(st.getHours())}:${pad(st.getMinutes())}">
      <div id="etSyncNote" class="small muted" style="margin-top:4px">Checking today's log…</div>
      <label id="etSyncRow" class="small" style="display:none;margin-top:6px">
        <input type="checkbox" id="etSyncConfirm" checked> <span id="etSyncLabel">Also adjust that entry as shown above</span></label></div>
    <div class="mActions"><button class="danger" id="etDiscard">Discard timer</button><button id="mCancel">Cancel</button><button class="primary" id="etSave">Save</button></div>`);
  const oldStartHM = pad(st.getHours())+":"+pad(st.getMinutes());
  setTimeout(()=>$("#etName").focus(), 50);
  $("#etDiscard").onclick = () => {
    if(!confirm("Discard the running timer without logging it?")) return;
    S.activeTimer = null; markDirty(); closeModal(); renderStrip();
  };
  $("#mCancel").onclick = closeModal;

  // Meetings only land in S.timelog when the Export tab has imported them
  // (importCalToLog) - if today's calendar hasn't been opened yet, a
  // meeting sitting between the stopped task and now simply isn't in
  // S.timelog, so the sync used to reach straight past it to whatever
  // OLDER task happened to be there. Importing here first (same path, same
  // ignore-list, same dedup against deleted entries via S.calSeen the
  // Export tab uses) means the check always sees the real last thing that
  // happened, not just whatever the app happened to already know about.
  // Deliberately not skipped if the modal gets closed before this
  // resolves - it's a harmless, idempotent sync either way.
  try { await importCalToLog(todayISO()); } catch(e){ /* no calendar configured, or fetch failed - fine, just means nothing to add */ }
  if(!$("#etSyncNote")) return;   // modal was closed/replaced while we were awaiting

  // Live preview of the previous-entry sync, recomputed on every keystroke -
  // and, now, backed by a checkbox defaulted ON rather than applying
  // silently. You see exactly what's about to change and can uncheck it for
  // this one correction if it picked the wrong thing (e.g. you were in an
  // unlogged meeting the app doesn't know the boundaries of).
  const updateSyncNote = () => {
    const note = $("#etSyncNote"), row = $("#etSyncRow"), val = $("#etStart").value;
    row.style.display = "none";
    if(!val || val === oldStartHM){ note.textContent = ""; return; }
    if(S.settings.syncLastTaskEnd === false){
      note.textContent = "Previous-entry syncing is off (Settings → Board & categories).";
      note.className = "small muted"; return;
    }
    const last = lastTimelogEntryToday();
    if(!last){ note.textContent = "No earlier entry logged today to adjust."; note.className = "small muted"; return; }
    if(last.end === val){ note.textContent = `Already matches "${last.label}" - nothing to adjust.`; note.className = "small muted"; return; }
    const mins = hmToMin(val) - hmToMin(last.start);
    if(mins < 1){
      note.textContent = `Won't adjust "${last.label}" - that start is before it began (${last.start}).`;
      note.className = "small errText";
    } else {
      note.textContent = `Last logged: "${last.label}" (${last.source==="cal"?"meeting":"task"}, ${last.start}–${last.end}).`;
      note.className = "small muted";
      row.style.display = "";
      $("#etSyncLabel").textContent = `Also move its end to ${val} to match`;
    }
  };
  $("#etStart").addEventListener("input", updateSyncNote);
  updateSyncNote();

  $("#etSave").onclick = () => {
    const name = $("#etName").value.trim(); if(!name){ alert("Task name required."); return; }
    t.label = name; t.category = $("#etCat").value;
    const [h,m] = $("#etStart").value.split(":").map(Number);
    const ns = new Date(st); ns.setHours(h, m, 0, 0);
    if(ns > new Date()){ alert("Start time can't be in the future."); return; }
    const newStartHM = pad(h)+":"+pad(m);
    if(S.settings.syncLastTaskEnd !== false && newStartHM !== oldStartHM
       && $("#etSyncRow").style.display !== "none" && $("#etSyncConfirm").checked){
      const last = lastTimelogEntryToday();
      if(last && last.end !== newStartHM){
        const mins = hmToMin(newStartHM) - hmToMin(last.start);
        // Only pull the boundary - never push it past the previous entry's
        // OWN start (that would invert or zero out its duration). If the new
        // start lands earlier than that, leave the previous entry alone
        // rather than silently corrupting its logged time. (The note above
        // and the now-hidden checkbox already reflect this.)
        if(mins >= 1){ last.end = newStartHM; last.minutes = mins; }
      }
    }
    t.start = ns.toISOString();
    markDirty(); closeModal(); renderStrip(); if(view==="export") renderExport();
  };
}

// Slots are for one day only. slotDay records when a task was slotted, so a
// task left unfinished doesn't reappear at the same time tomorrow. Tasks
// slotted before slotDay existed are stamped today rather than wiped, so
// their slots clear from tomorrow like any other.
function setSlot(t, hm){ t.slot = hm; t.slotDay = todayISO(); }
function dailyCleanup(){
  const today = todayISO(), doneK = doneColK();
  S.tasks.forEach(t=>{
    if(!t.slot){ if(t.slotDay){ delete t.slotDay; markDirty(); } return; }
    if(!t.slotDay){ t.slotDay = today; markDirty(); }
    else if(t.slotDay < today){ t.slot = null; t.reminded = null; delete t.slotDay; markDirty(); }
  });
  if(!doneK) return;                 // no column marked done - nothing auto-clears
  S.tasks.forEach(t=>{ if(t.column===doneK && !t.doneAt) t.doneAt = today; });
  const n = S.tasks.length;
  S.tasks = S.tasks.filter(t => !(t.column===doneK && t.doneAt < today));
  if(S.tasks.length !== n) markDirty();
}

/* ================= today ================= */
const calInflight = {};
async function fetchCal(d, force){
  if(!force && calCache[d]) return calCache[d];
  if(!force && calInflight[d]) return calInflight[d];
  return calInflight[d] = (async () => {
    try {
      const r = await fetch(`/api/calendar?date=${d}${force?"&refresh=1":""}`);
      const j = await r.json();
      return calCache[d] = j.error ? {events:[], error:j.error} : j;
    } finally { delete calInflight[d]; }
  })();
}
async function renderToday(force){
  const cal = await fetchCal(todayISO(), force);
  const note = cal.error ? "Calendar: "+cal.error : (cal.warn ? "Calendar: "+cal.warn : "");
  $("#calNotice").style.display = note ? "" : "none";
  if(note) $("#calNotice").textContent = note;
  // Work hours bound auto-slotting; the display range is what the timeline actually
  // shows/allows dragging into - separate on purpose, so occasional out-of-hours work
  // can be seen and manually placed without "Auto" starting to treat odd hours as normal.
  const workStartM = hmToMin(S.settings.dayStart||"08:00"), workEndM = hmToMin(S.settings.dayEnd||"18:00");
  const viewStartM = hmToMin(S.settings.viewStart || S.settings.dayStart || "08:00");
  const viewEndM = hmToMin(S.settings.viewEnd || S.settings.dayEnd || "18:00");
  const tl = $("#timeline");
  // scale the day to fill the window below the timeline's top edge (min 0.7 px/min, then it scrolls)
  const avail = window.innerHeight - tl.getBoundingClientRect().top - 18;
  const pxPerMin = Math.max(0.7, avail / (viewEndM - viewStartM));
  tl.style.height = (viewEndM-viewStartM)*pxPerMin + "px"; tl.innerHTML = "";
  for(let h=Math.ceil(viewStartM/60); h*60<viewEndM; h++){
    const row = document.createElement("div"); row.className="hourRow";
    row.style.top = (h*60-viewStartM)*pxPerMin+"px"; row.textContent = pad(h)+":00";
    tl.appendChild(row);
  }
  const GUTTER = 56, MARGIN = 8;
  const put = (topM, durM, cls, html, onclick, bg, colInfo) => {
    const b = document.createElement("div"); b.className = "block "+cls;
    b.style.top = (topM-viewStartM)*pxPerMin+"px";
    b.style.height = Math.max(16, durM*pxPerMin-2)+"px";
    if(colInfo && colInfo.totalCols > 1){
      // side-by-side layout for overlapping items, like Outlook/Google Calendar -
      // split the available width evenly across however many columns this cluster needs
      const availW = tl.clientWidth - GUTTER - MARGIN;
      const colW = availW / colInfo.totalCols;
      b.style.left = (GUTTER + colInfo.col*colW) + "px";
      b.style.width = Math.max(24, colW - 3) + "px";
      b.style.right = "auto";
    }
    if(bg){ b.style.background = bg; b.style.color = txtOn(bg); }
    b.innerHTML = html; if(onclick) b.onclick = onclick;
    tl.appendChild(b); return b;
  };
  // Clusters transitively-overlapping items and greedily assigns each a column
  // (first column whose previous occupant has already ended), then records how
  // many columns its whole cluster needed - the same layout every day-view
  // calendar uses so overlapping items sit side by side instead of hiding
  // each other. Only meetings + slotted tasks participate; lunch and the
  // "now" line are background/foreground indicators, not competing content.
  function layoutOverlaps(items){
    items.sort((a,b)=>a.startM-b.startM);
    let cluster = [], clusterEnd = -Infinity;
    const clusters = [];
    for(const it of items){
      if(cluster.length && it.startM >= clusterEnd){ clusters.push(cluster); cluster = []; clusterEnd = -Infinity; }
      cluster.push(it); clusterEnd = Math.max(clusterEnd, it.endM);
    }
    if(cluster.length) clusters.push(cluster);
    for(const cl of clusters){
      const colEnds = [];   // colEnds[i] = end time of the last item placed in column i
      for(const it of cl){
        let placed = false;
        for(let i=0;i<colEnds.length;i++){
          if(colEnds[i] <= it.startM){ it.col = i; colEnds[i] = it.endM; placed = true; break; }
        }
        if(!placed){ it.col = colEnds.length; colEnds.push(it.endM); }
      }
      for(const it of cl) it.totalCols = colEnds.length;
    }
    return items;
  }
  // lunch block - shown if it overlaps the visible range at all, excluded from auto-slot below
  const lunchStartM = S.settings.lunchStart ? hmToMin(S.settings.lunchStart) : null;
  const lunchEndM = S.settings.lunchEnd ? hmToMin(S.settings.lunchEnd) : null;
  const hasLunch = lunchStartM!=null && lunchEndM!=null && lunchEndM > lunchStartM;
  if(hasLunch && lunchEndM > viewStartM && lunchStartM < viewEndM){
    put(Math.max(lunchStartM,viewStartM), Math.min(lunchEndM,viewEndM)-Math.max(lunchStartM,viewStartM),
      "lunch", `<span class="t">Lunch</span>`);
  }
  const ignoreEv = ignoredTitles();
  const timedEvents = cal.events.filter(e=>!e.allDay && !ignoreEv.includes((e.title||"").toLowerCase().trim()));
  const todayTasks = S.tasks.filter(t=>t.column===firstColK());
  const slottedTasks = todayTasks.filter(t=>t.slot);

  // one shared layout pass across meetings + tasks, so an overlap between the
  // two (not just within one type) still splits side by side correctly
  const layoutItems = [
    ...timedEvents.map(e=>{ const s=new Date(e.start), en=new Date(e.end);
      return { kind:"cal", startM:s.getHours()*60+s.getMinutes(), endM:en.getHours()*60+en.getMinutes(), data:e }; }),
    ...slottedTasks.map(t=>({ kind:"task", startM:hmToMin(t.slot), endM:hmToMin(t.slot)+(t.est||30), data:t })),
  ];
  layoutOverlaps(layoutItems);
  const colOf = it => ({ col: it.col, totalCols: it.totalCols });

  layoutItems.filter(it=>it.kind==="cal").forEach(it=>{
    const e = it.data;
    put(it.startM, it.endM-it.startM, "cal",
      `<span class="t">${esc(e.title)}</span>${e.location?` <span class="small">· ${esc(e.location)}</span>`:""}`,
      null, null, colOf(it));
  });
  layoutItems.filter(it=>it.kind==="task").forEach(it=>{
    const t = it.data;
    const c = catColor(t.category);
    const b = put(it.startM, t.est||30, "task", `<span class="t">${esc(t.title)}</span>`, null, c, colOf(it));
    b.title = "Drag to move, click to edit";
    b.addEventListener("pointerdown", e => {
      if(e.button !== 0) return;
      e.preventDefault(); b.setPointerCapture(e.pointerId);
      const sy = e.clientY, origTop = parseFloat(b.style.top), blkH = b.offsetHeight;
      let moved = false;
      const mv = ev => {
        const dy = ev.clientY - sy;
        if(Math.abs(dy) > 3) moved = true;
        if(moved){
          b.style.top = Math.min((viewEndM-viewStartM)*pxPerMin - blkH, Math.max(0, origTop + dy)) + "px";
          b.style.zIndex = 10;
        }
      };
      const up = () => {
        b.removeEventListener("pointermove", mv);
        b.removeEventListener("pointerup", up); b.removeEventListener("pointercancel", up);
        if(!moved){ taskModal(t); return; }
        let m = viewStartM + parseFloat(b.style.top) / pxPerMin;
        m = Math.round(m / 5) * 5;                                       // snap to 5 min
        m = Math.min(viewEndM - (t.est||30), Math.max(viewStartM, m));   // stay inside the visible range
        setSlot(t, minToHM(m)); markDirty(); renderToday();
      };
      b.addEventListener("pointermove", mv);
      b.addEventListener("pointerup", up);
      b.addEventListener("pointercancel", up);
    });
  });
  const nowM = hmToMin(hmNow());
  if(nowM>=viewStartM && nowM<=viewEndM) put(nowM, 0, "now", "");

  // free-gap finder for auto-slot - respects WORK HOURS (not the wider display range) and skips lunch
  const busy = timedEvents.map(e=>{const s=new Date(e.start),en=new Date(e.end);
    return [s.getHours()*60+s.getMinutes(), en.getHours()*60+en.getMinutes()];})
    .concat(todayTasks.filter(t=>t.slot).map(t=>[hmToMin(t.slot), hmToMin(t.slot)+(t.est||30)]))
    .concat(hasLunch ? [[lunchStartM, lunchEndM]] : [])
    .sort((a,b)=>a[0]-b[0]);
  const firstGap = need => {
    let cur = Math.max(workStartM, nowM);
    for(const [s,e] of busy){ if(s - cur >= need) break; cur = Math.max(cur, e); }
    return cur + need <= workEndM ? cur : null;
  };

  const un = $("#unslotted"), sl = $("#slotted"); un.innerHTML=""; sl.innerHTML="";
  todayTasks.forEach(t=>{
    const row = document.createElement("div"); row.className="slotItem";
    if(!t.slot){
      row.innerHTML = `<span class="badge" style="background:${catColor(t.category)}">&nbsp;</span><span class="nm">${esc(t.title)} <span class="muted small">(${esc(String(t.est||30))}m)</span></span>
        <input type="time"><button>Slot</button><button class="ghost">Auto</button>`;
      const [inp] = row.querySelectorAll("input"), [btn, auto] = row.querySelectorAll("button");
      btn.onclick = () => { if(inp.value){ setSlot(t, inp.value); markDirty(); renderToday(); } };
      auto.onclick = () => { const g = firstGap(t.est||30);
        if(g==null){ alert("No free gap fits within work hours today."); return; }
        setSlot(t, minToHM(g)); markDirty(); renderToday(); };
      un.appendChild(row);
    } else {
      row.innerHTML = `<span class="badge" style="background:${catColor(t.category)}">&nbsp;</span><span class="nm">${esc(t.title)}</span>
        <span class="small muted">@${esc(String(t.slot))}</span><button title="Start timer">▶</button><button class="ghost">Unslot</button>`;
      const [play, unbtn] = row.querySelectorAll("button");
      play.onclick = () => startTimer(t.title, t.id);
      unbtn.onclick = () => { t.slot=null; markDirty(); renderToday(); };
      sl.appendChild(row);
    }
  });
  if(!todayTasks.length) un.innerHTML = `<span class="muted small">No tasks in the ${esc(colLabel(firstColK()))} column.</span>`;
}

/* ================= snippet / clipboard libraries ================= */
const LIBS = { snips:{key:"snippets", label:"snippet", ph:"# code..."},
               paste:{key:"pastes", label:"paste block", ph:"Markdown supported: **bold**, `code`, ``` blocks, - lists, [links](https://...)", md:true} };
const libFilter = {snips:"", paste:""}, libSearch = {snips:"", paste:""};

function moveLibItem(kind, id, dir){
  const arr = S[LIBS[kind].key];
  const i = arr.findIndex(x=>x.id===id), j = i + dir;
  if(i<0 || j<0 || j>=arr.length) return;

function mdRender(src){
  const fences = [];
  let s = src.replace(/```(?:\w*\n)?([\s\S]*?)```/g, (m,c)=>{
    fences.push(c.replace(/\n$/,"")); return "\u0000"+(fences.length-1)+"\u0000"; });
  s = esc(s);
  s = s.replace(/^### (.*)$/gm,"<h4>$1</h4>")
       .replace(/^## (.*)$/gm,"<h3>$1</h3>")
       .replace(/^# (.*)$/gm,"<h2>$1</h2>");
  s = s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
       .replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(?:^|\n)((?:[-*] .*(?:\n|$))+)/g, m =>
    "\n<ul>"+m.trim().split(/\n/).map(l=>"<li>"+l.replace(/^[-*] /,"")+"</li>").join("")+"</ul>");
  s = s.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g, m =>
    "\n<ol>"+m.trim().split(/\n/).map(l=>"<li>"+l.replace(/^\d+\. /,"")+"</li>").join("")+"</ol>");
  s = s.replace(/\n{2,}/g,"<br><br>").replace(/\n/g,"<br>");
  s = s.replace(/<br>(?=<(?:h\d|ul|ol))/g,"").replace(/(<\/(?:h\d|ul|ol)>)<br>/g,"$1");
  s = s.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<pre class="mdCode">${esc(fences[+i])}</pre>`);
  return s;
}

/* ================= scratchpad ================= */
const SCR_DEF = {size:13, wrap:true, nums:true};
const SCR_MAX = 8;
const SCR_TF = {
  blanks: t => t.split("\n").filter(l => l.trim() !== "").join("\n"),
  trail:  t => t.split("\n").map(l => l.replace(/[ \t]+$/,"")).join("\n"),
  dedupe: t => { const seen = new Set();
    return t.split("\n").filter(l => seen.has(l) ? false : (seen.add(l), true)).join("\n"); },
  sortA:  t => t.split("\n").sort((a,b) => a.localeCompare(b)).join("\n"),
  sortZ:  t => t.split("\n").sort((a,b) => b.localeCompare(a)).join("\n"),
  rev:    t => t.split("\n").reverse().join("\n"),
  upper:  t => t.toUpperCase(),
  lower:  t => t.toLowerCase(),
};
let scrWired = false, scrGutT = null;

function scrCfg(){
  const c = (S.scratch && typeof S.scratch === "object") ? S.scratch : (S.scratch = {});
  for(const k in SCR_DEF) if(c[k] === undefined) c[k] = SCR_DEF[k];
  if(!Array.isArray(c.pads) || !c.pads.length){
    // seeds the first pad, and carries over the single-pad shape this used
    // to have ({text:...}) for anyone upgrading
    c.pads = [{id:uid(), name:"Note 1", text: typeof c.text === "string" ? c.text : ""}];
  }
  delete c.text;
  c.pads = c.pads.filter(p => p && typeof p === "object").slice(0, SCR_MAX);
  c.pads.forEach(p => {
    if(!p.id) p.id = uid();
    if(typeof p.name !== "string" || !p.name.trim()) p.name = "Note";
    if(typeof p.text !== "string") p.text = "";
  });
  if(!c.pads.some(p => p.id === c.active)) c.active = c.pads[0].id;
  return c;
}
const scrPad = () => { const c = scrCfg(); return c.pads.find(p => p.id === c.active); };

function renderScratch(){
  const ta = $("#scratchTA");
  if(!scrWired){ wireScratch(); scrWired = true; }
  renderScrTabs();
  // The editor markup is static (not rebuilt per render) so the textarea
  // keeps its cursor position across app tab switches. Switching scratch
  // pads does reset the browser's undo stack for it - one textarea, one
  // history - so undo doesn't reach back past a pad switch.
  const pad = scrPad();
  if(ta.value !== pad.text) ta.value = pad.text;
  applyScratchStyle();
}
function renderScrTabs(){
  const c = scrCfg(), strip = $("#scrTabs");
  strip.innerHTML = "";
  c.pads.forEach(p => {
    const b = document.createElement("button");
    b.className = "scrTab" + (p.id === c.active ? " on" : "");
    b.title = "Double-click to rename";
    b.innerHTML = `<span class="nm">${esc(p.name)}</span>` +
      (c.pads.length > 1 ? `<span class="x" title="Close">&#10005;</span>` : "");
    b.onclick = e => {
      if(e.target.classList.contains("x")){ scrClosePad(p.id); return; }
      if(p.id !== c.active){ c.active = p.id; markDirty(); renderScratch(); $("#scratchTA").focus(); }
    };
    b.ondblclick = e => { if(!e.target.classList.contains("x")) scrRenamePad(b, p); };
    strip.appendChild(b);
  });
  if(c.pads.length < SCR_MAX){
    const add = document.createElement("button");
    add.className = "scrTab"; add.textContent = "+"; add.title = "New note";
    add.onclick = () => {
      const p = {id:uid(), name:"Note " + (c.pads.length + 1), text:""};
      c.pads.push(p); c.active = p.id; markDirty(); renderScratch(); $("#scratchTA").focus();
    };
    strip.appendChild(add);
  }
}
function scrRenamePad(btn, p){
  const inp = document.createElement("input");
  inp.className = "scrRename"; inp.value = p.name; inp.maxLength = 30;
  btn.innerHTML = ""; btn.appendChild(inp); inp.focus(); inp.select();
  const done = commit => {
    inp.onblur = null;
    const v = inp.value.trim();
    if(commit && v){ p.name = v; markDirty(); }
    renderScrTabs();
  };
  inp.onblur = () => done(true);
  inp.onkeydown = e => {
    e.stopPropagation();
    if(e.key === "Enter"){ e.preventDefault(); done(true); }
    if(e.key === "Escape"){ e.preventDefault(); done(false); }
  };
}
function scrClosePad(id){
  const c = scrCfg(), p = c.pads.find(x => x.id === id);
  if(!p || c.pads.length < 2) return;               // always keep one pad
  if(p.text.trim() && !confirm(`Close "${p.name}"? Everything in it is deleted.`)) return;
  c.pads = c.pads.filter(x => x.id !== id);
  if(c.active === id) c.active = c.pads[0].id;
  markDirty(); renderScratch();
}
function applyScratchStyle(){
  const c = scrCfg(), ta = $("#scratchTA"), g = $("#scratchGutter");
  ta.style.fontSize = g.style.fontSize = c.size + "px";
  ta.style.whiteSpace = c.wrap ? "pre-wrap" : "pre";
  ta.style.overflowX = c.wrap ? "hidden" : "auto";
  g.style.display = c.nums ? "" : "none";
  $("#scrSize").textContent = c.size + "px";
  $("#scrWrap").classList.toggle("on", c.wrap);
  $("#scrNums").classList.toggle("on", c.nums);
  buildGutter(); scrStatus(); scrCount();
}
function buildGutter(){
  const c = scrCfg(); if(!c.nums) return;
  const ta = $("#scratchTA"), g = $("#scratchGutter"), m = $("#scratchMirror");
  const cs = getComputedStyle(ta), lines = ta.value.split("\n");
  g.style.paddingTop = cs.paddingTop;
  g.style.lineHeight = cs.lineHeight;
  if(!c.wrap || lines.length > 2000){
    // no wrapping (or too many lines to be worth measuring): every logical
    // line is exactly one row, so uniform line-height already lines up
    g.innerHTML = lines.map((_, i) => `<div>${i+1}</div>`).join("");
  } else {
    m.style.font = cs.font;
    m.style.lineHeight = cs.lineHeight;
    m.style.width = (ta.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) + "px";
    m.innerHTML = lines.map(l => `<div>${esc(l) || "&nbsp;"}</div>`).join("");
    g.innerHTML = [...m.children]
      .map((d, i) => `<div style="height:${d.offsetHeight}px">${i+1}</div>`).join("");
  }
  g.scrollTop = ta.scrollTop;
}
function scrStatus(){
  const ta = $("#scratchTA"), v = ta.value, pos = ta.selectionStart;
  const before = v.slice(0, pos), sel = ta.selectionEnd - ta.selectionStart;
  const parts = [
    `Ln ${before.split("\n").length}, Col ${pos - before.lastIndexOf("\n")}`,
    `Lines ${v ? v.split("\n").length : 0}`,
    `Words ${(v.match(/\S+/g) || []).length}`,
    `Chars ${v.length}`,
  ];
  if(sel) parts.push(`Sel ${sel}`);
  $("#scrStatus").textContent = parts.join("  -  ");
}
function scrChanged(){
  scrPad().text = $("#scratchTA").value; markDirty();
  clearTimeout(scrGutT); scrGutT = setTimeout(buildGutter, 60);
  scrStatus(); scrCount();
}
// Writes through execCommand where possible so each edit lands on the
// textarea's own undo stack - Ctrl+Z still walks back through transforms
// and replacements, not just typing.
function scrInsert(text){
  const ta = $("#scratchTA"); ta.focus();
  let ok = false;
  if(text !== ""){ try { ok = document.execCommand("insertText", false, text); } catch(e){} }
  if(!ok) ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
  scrChanged();
}
function scrSetAll(text){
  const ta = $("#scratchTA");
  ta.focus(); ta.setSelectionRange(0, ta.value.length);
  scrInsert(text);
}
function scrRe(){
  const q = $("#scrFind").value; if(!q) return null;
  const src = $("#scrRegex").checked ? q : q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try { return new RegExp(src, "gm" + ($("#scrCase").checked ? "" : "i")); }
  catch(e){ return "err"; }
}
function scrCount(){
  const el = $("#scrCount"), re = scrRe();
  el.classList.toggle("errText", re === "err");
  if(re === "err"){ el.textContent = "bad regex"; return; }
  if(!re){ el.textContent = ""; return; }
  const n = ($("#scratchTA").value.match(re) || []).length;
  el.textContent = n === 1 ? "1 match" : n + " matches";
}
function scrFindNext(){
  const re = scrRe(); if(!re || re === "err") return null;
  const ta = $("#scratchTA");
  re.lastIndex = ta.selectionEnd;
  let m = re.exec(ta.value);
  if(!m){ re.lastIndex = 0; m = re.exec(ta.value); }   // wrap around
  if(!m || m[0] === "") return null;                   // ignore zero-length matches
  ta.focus(); ta.setSelectionRange(m.index, m.index + m[0].length);
  scrStatus(); return m;
}
function scrReplace(){
  const ta = $("#scratchTA"), re = scrRe(); if(!re || re === "err") return;
  const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
  const one = new RegExp(re.source, re.flags.replace("g", ""));
  // only replace when the current selection IS the match - otherwise this
  // press just finds the first hit
  if(sel){
    const m = one.exec(sel);
    if(m && m[0] === sel) scrInsert(sel.replace(one, $("#scrRepl").value));
  }
  scrFindNext();
}
function scrReplaceAll(){
  const ta = $("#scratchTA"), re = scrRe(); if(!re || re === "err") return;
  const n = (ta.value.match(re) || []).length;
  if(!n) return;
  scrSetAll(ta.value.replace(re, $("#scrRepl").value));
  $("#scrCount").textContent = n === 1 ? "1 replaced" : n + " replaced";
}
function scrTransform(key){
  const fn = SCR_TF[key], ta = $("#scratchTA");
  const a = ta.selectionStart, b = ta.selectionEnd;
  if(b > a){ ta.focus(); ta.setSelectionRange(a, b); scrInsert(fn(ta.value.slice(a, b))); }
  else scrSetAll(fn(ta.value));
}
function wireScratch(){
  const ta = $("#scratchTA"), g = $("#scratchGutter");
  ta.oninput = scrChanged;
  ta.onscroll = () => { g.scrollTop = ta.scrollTop; };
  ta.onclick = ta.onkeyup = scrStatus;
  ta.onkeydown = e => {
    if(e.key === "Tab" && !e.shiftKey){ e.preventDefault(); scrInsert("\t"); }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f"){ e.preventDefault(); $("#scrFind").select(); }
  };
  const bump = d => () => {
    const c = scrCfg();
    c.size = Math.min(28, Math.max(10, c.size + d));
    markDirty(); applyScratchStyle();
  };
  $("#scrMinus").onclick = bump(-1);
  $("#scrPlus").onclick = bump(1);
  $("#scrWrap").onclick = () => { const c = scrCfg(); c.wrap = !c.wrap; markDirty(); applyScratchStyle(); };
  $("#scrNums").onclick = () => { const c = scrCfg(); c.nums = !c.nums; markDirty(); applyScratchStyle(); };
  $("#scrCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(ta.value); $("#scrCopy").textContent = "Copied";
      setTimeout(() => { $("#scrCopy").textContent = "Copy all"; }, 1200); } catch(e){}
  };
  $("#scrDl").onclick = () => {
    const url = URL.createObjectURL(new Blob([ta.value], {type:"text/plain"}));
    const a = document.createElement("a");
    const name = (scrPad().name || "scratch").replace(/[^\w.-]+/g, "_");
    a.href = url; a.download = name + "-" + todayISO() + ".txt"; a.click();
    URL.revokeObjectURL(url);
  };
  $("#scrClear").onclick = () => {
    if(ta.value && !confirm(`Clear "${scrPad().name}"?`)) return;
    scrSetAll("");
  };
  $("#scrFind").oninput = scrCount;
  $("#scrFind").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); scrFindNext(); } };
  $("#scrRepl").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); scrReplace(); } };
  $("#scrCase").onchange = $("#scrRegex").onchange = scrCount;
  $("#scrNext").onclick = scrFindNext;
  $("#scrRep").onclick = scrReplace;
  $("#scrRepAll").onclick = scrReplaceAll;
  document.querySelectorAll("#view-scratch [data-tf]").forEach(b => {
    b.onclick = () => scrTransform(b.dataset.tf);
  });
}

async function importCalToLog(d){
  S.calSeen = S.calSeen || {};
  const seen = S.calSeen[d] = S.calSeen[d] || [];
  const cal = await fetchCal(d);
  if(cal.error){ $("#expNotice").style.display=""; $("#expNotice").textContent="Calendar: "+cal.error; return; }
  $("#expNotice").style.display = cal.warn ? "" : "none";
  if(cal.warn) $("#expNotice").textContent = "Calendar: "+cal.warn;
  let changed = false;
  const ignore = ignoredTitles();
  (cal.events||[]).filter(e=>!e.allDay).forEach(ev=>{
    if(ignore.includes((ev.title||"").toLowerCase().trim())) return;   // skip ignored event titles
    const key = ev.start + "|" + ev.title;
    if(seen.includes(key)) return;                 // already imported (or deleted) - don't resurrect
    seen.push(key);
    const s = new Date(ev.start), en = new Date(ev.end);
    S.timelog.push({ id:uid(), date:d, label:ev.title, taskId:null, source:"cal", category:"meeting",
      start: pad(s.getHours())+":"+pad(s.getMinutes()), end: pad(en.getHours())+":"+pad(en.getMinutes()),
      minutes: Math.max(1, Math.round((en - s)/60000)) });
    changed = true;
  });
  if(changed) markDirty();
}
// Unsaved row edits on the export tab, keyed by entry. Any re-render (saving another row, deleting one, adding an
// entry, changing day...) rebuilds the table from S.timelog, so pending edits are applied first instead of being lost.
const exportPending = new Map();
function flushExportEdits(){
  if(!exportPending.size) return;
  exportPending.forEach(apply => apply());
  exportPending.clear(); markDirty();
}
async function renderExport(){
  flushExportEdits();
  const d = $("#expDate").value || todayISO(); $("#expDate").value = d;
  try { await importCalToLog(d); } catch(e){ /* calendar issues shouldn't blank the table */ }
  const entries = S.timelog.filter(e=>e.date===d).sort((a,b)=>a.start.localeCompare(b.start));
  const tb = $("#entryRows"); tb.innerHTML = "";
  let reach = -1;   // latest end seen so far; a later start beyond it means a gap
  entries.forEach((e,i)=>{
    const c = entCat(e);
    const tr = document.createElement("tr");
    // flag rows whose time range overlaps another entry (touching end-to-start doesn't count)
    const [s0, e0] = [hmToMin(e.start), hmToMin(e.end)];
    const clash = entries.filter(o => o !== e && hmToMin(o.start) < e0 && s0 < hmToMin(o.end));
    if(clash.length){ tr.classList.add("overlap"); tr.title = "Overlaps: " + clash.map(o=>o.label).join(", "); }
    reach = Math.max(reach, e0);
    const nxt = entries[i+1];
    if(nxt && hmToMin(nxt.start) > reach){
      tr.classList.add("gapAfter");
      tr.title = (tr.title ? tr.title + " - " : "") + "Gap of " + fmtDur(hmToMin(nxt.start) - reach) + " before the next entry";
    }
    tr.innerHTML = `<td><div class="labCell"><span title="${e.source==="cal"?"from calendar":"task/timer entry"}">${e.source==="cal"?"📅":"📋"}</span><input value="${esc(e.label)}"></div></td>
      <td><select>${allCats().map(cc=>`<option value="${esc(String(cc.k))}"${c===cc.k?" selected":""}>${esc(cc.label)}</option>`).join("")}</select></td>
      <td><input type="time" value="${esc(String(e.start))}"></td><td><input type="time" value="${esc(String(e.end))}"></td>
      <td><input type="number" min="1" value="${esc(String(e.minutes))}"></td>
      <td class="rowActs"><span class="actWrap"><button class="ghost small" data-save title="Save changes" disabled>💾</button><button class="ghost small danger" data-del title="Delete">✕</button></span></td>`;
    const [lab, st, en, mi] = tr.querySelectorAll("input"), catSel = tr.querySelector("select");
    const saveBtn = tr.querySelector("[data-save]");
    const apply = () => {
      e.label = lab.value; e.category = catSel.value;
      e.start = st.value; e.end = en.value; e.minutes = +mi.value || 1;
    };
    const dirtyRow = () => { saveBtn.disabled = false; tr.classList.add("rowDirty"); exportPending.set(e, apply); };
    // auto-fill minutes from start/end while typing, but DON'T re-render (no jump)
    const syncMins = () => { const diff = hmToMin(en.value) - hmToMin(st.value); if(diff > 0) mi.value = diff; };
    lab.oninput = dirtyRow; catSel.onchange = dirtyRow; mi.oninput = dirtyRow;
    st.oninput = () => { syncMins(); dirtyRow(); };
    en.oninput = () => { syncMins(); dirtyRow(); };
    // saving applies this row AND every other pending edit (the re-render picks them all up), then re-sorts + refreshes totals
    const commit = () => { exportPending.set(e, apply); renderExport(); };
    saveBtn.onclick = commit;
    // Enter in any field of the row saves it
    tr.querySelectorAll("input").forEach(inp => inp.addEventListener("keydown", ev => { if(ev.key==="Enter") commit(); }));
    tr.querySelector("[data-del]").onclick = () => { exportPending.delete(e); S.timelog = S.timelog.filter(x=>x.id!==e.id); markDirty(); renderExport(); };
    tb.appendChild(tr);
  });
  const round = +S.settings.rounding || 1;
  const rnd = m => Math.max(round, Math.round(m/round)*round);
  let out;
  const dateHdr = new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
  if($("#expRaw").checked){
    const agg = {};
    entries.forEach(e=>{ agg[e.label] = (agg[e.label]||0) + e.minutes; });
    out = dateHdr+"\n"+Object.entries(agg).map(([label,m])=>`- ${ascii(label)} - ${fmtDur(rnd(m))}`).join("\n");
  } else {
    out = dateHdr+"\n"+entries.map(e=>`${e.start}-${e.end}  ${ascii(e.label)} - ${fmtDur(rnd(e.minutes))}`).join("\n");
  }
  if(entries.length){
    const first = Math.min(...entries.map(e=>hmToMin(e.start)));
    const last = Math.max(...entries.map(e=>hmToMin(e.end)));
    const elapsed = Math.max(0, last - first);
    const total = entries.reduce((a,e)=>a+e.minutes, 0);
    // gaps = elapsed time not covered by any entry (overlapping entries are merged first); overlap = summed entry time minus that merged time
    let covered = 0, edge = first, summed = 0;
    entries.map(e=>[hmToMin(e.start), hmToMin(e.end)]).sort((a,b)=>a[0]-b[0]).forEach(([s,e])=>{
      summed += Math.max(0, e - s);
      if(e > edge){ covered += e - Math.max(s, edge); edge = e; }
    });
    const gaps = Math.max(0, elapsed - covered);
    const overlap = Math.max(0, summed - covered);   // time counted by more than one entry
    const DIV = "\n-------------------";
    // divider after the last entry, then the time summary
    out += DIV;
    out += `\nElapsed Time: ${fmtDur(elapsed)} (${minToHM(first)}-${minToHM(last)})`;
    out += `\nTotal Time: ${fmtDur(total)}`;
    out += `\nGaps: ${fmtDur(gaps)} (${(gaps/60).toFixed(2)})`;
    out += `\nOverlap: ${fmtDur(overlap)} (${(overlap/60).toFixed(2)})`;
    // divider, then time per category (largest first; same raw minutes as Total Time)
    const byCat = {};
    entries.forEach(e=>{ const k = entCat(e); byCat[k] = (byCat[k]||0) + e.minutes; });
    out += DIV + "\nCategory breakdown:\n" + Object.entries(byCat).sort((a,b)=>b[1]-a[1])
      .map(([k,m])=>`${ascii(catName(k))}: ${fmtDur(m)}`).join("\n");
  } else out += "No entries.";
  $("#exportText").textContent = out;
}

let bulkRows = [];
async function bulkGenerate(){
  const f = $("#bulkFrom").value, t = $("#bulkTo").value;
  if(!f || !t || f > t){ alert("Pick a valid from/to range."); return; }
  // Deliberately does NOT re-fetch/re-import the calendar for each day here -
  // whatever's already in a day's Entries screen is treated as final (you may
  // have corrected a meeting that ran over/under, or removed one entirely,
  // and a bulk report is not the place to second-guess that). Visiting the
  // Export tab for a given day is what syncs its calendar entries in the
  // first place; a day never visited simply won't have any calendar-derived
  // rows here yet.
  const round = +S.settings.rounding || 1;
  const rnd = m => Math.max(round, Math.round(m/round)*round);
  // one row per entry with its own times, sorted by date then start
  bulkRows = S.timelog
    .filter(e => e.date >= f && e.date <= t)
    .sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start))
    .map(e => [e.date, e.start, e.end, ascii(e.label), catName(entCat(e)), fmtDur(rnd(e.minutes))]);
  const header = ["Date","Start","End","Task","Category","Time"];
  $("#bulkText").textContent = bulkRows.length
    ? header.join("\t") + "\n" + bulkRows.map(r=>r.join("\t")).join("\n")
    : "No entries in range.";
}
$("#bulkGen").onclick = bulkGenerate;
$("#bulkCopy").onclick = async () => {
  await navigator.clipboard.writeText($("#bulkText").textContent);
  $("#bulkCopy").textContent = "Copied ✓"; setTimeout(()=>$("#bulkCopy").textContent="Copy",1500);
};
$("#bulkCsv").onclick = () => {

  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const csv = "Date,Start,End,Task,Category,Time\n" + bulkRows.map(r=>r.map(q).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"}));

// Splits on grapheme clusters (not UTF-16 code units), so a ZWJ sequence or
// skin-tone-modified emoji is treated as the single glyph it visually is.
// Falls back to Array.from (code-point-aware, but not ZWJ-aware) on browsers
// without Intl.Segmenter - a minor degradation, not a crash.
function graphemesOf(str){
  if(window.Intl && Intl.Segmenter){
    return [...new Intl.Segmenter(undefined, {granularity:"grapheme"}).segment(str)].map(s=>s.segment);
  }
  return Array.from(str);
}
const EMOJI_RE = /\p{Extended_Pictographic}/u;
// U+FE0F (variation selector-16) is optional on many emoji - strip it before
// lookup so "🗑️" (with VS16) and "🗑" (without) both resolve.
const emojiToTag = g => EMOJI_TO_TAG[g] || EMOJI_TO_TAG[g.replace(/\uFE0F/g,"")] || null;
// Up to 10 shortcodes, deduped, in the order they were parsed.
function parseQuickTagsInput(str){
  const out = [];
  for(const g of graphemesOf(str||"")){
    if(!EMOJI_RE.test(g)) continue;
    const tag = emojiToTag(g);
    if(tag && !out.includes(tag)) out.push(tag);
    if(out.length >= 10) break;
  }
  return out;
}

  if(isoOf(d) === isoOf(now)) return "Today "+time;
  if(isoOf(d) === isoOf(new Date(now.getTime()+86400000))) return "Tomorrow "+time;
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+time;
}

// Paste/type a single emoji -> auto-converts to its ntfy shortcode. If more
// than one emoji is pasted, only the first is kept (graphemesOf().find below).
// An emoji outside EMOJI_TO_TAG is rejected with a hint rather than silently
// sent - a raw glyph in the Tags header would just vanish (ntfy tags are
// ASCII shortcodes, not literal emoji).
$("#remTag").addEventListener("input", e => {
  const raw = e.target.value;
  if(!raw){ $("#remTagWarn").style.display = "none"; setTagPreview(""); return; }
  if(EMOJI_RE.test(raw)){
    const g = graphemesOf(raw).find(x => EMOJI_RE.test(x));
    const tag = g && emojiToTag(g);
    if(tag){
      e.target.value = tag; $("#remTagWarn").style.display = "none"; setTagPreview(tag);
    } else {
      e.target.value = "";
      $("#remTagWarn").textContent = "Emoji not recognized - try typing a shortcode (e.g. alarm_clock), or pick one below.";
      $("#remTagWarn").style.display = "";
      setTagPreview("");
    }
    return;
  }
  $("#remTagWarn").style.display = "none";
  setTagPreview(raw.trim());
});

$("#remSave").onclick = async () => {
  const msg = $("#remMsg").value.trim();
  if(!msg){ remStatus("Message is required", true); return; }
  if(!$("#remDate").value || !$("#remTime").value){ remStatus("Pick a date and time", true); return; }
  const when = new Date(`${$("#remDate").value}T${$("#remTime").value}`);
  if(isNaN(when)){ remStatus("Invalid date/time", true); return; }
  const recurring = $("#remRecur").checked;
  // A past time on a recurring reminder is fine (the dispatcher rolls it
  // forward to the next occurrence); on a one-off it would just fire instantly.
  if(!recurring && when.getTime() < Date.now()-60000){ remStatus("That time is in the past", true); return; }
  const picked = remDaysGet();
  const filtered = recurring && remDaysApply();
  if(filtered && !picked.length){ remStatus("Pick at least one day", true); return; }
  // All seven picked = no filter. The browser's timezone rides along because
  // "which weekday is it" is the user's answer, not the server's.
  const useDays = filtered && picked.length < 7;
  const payload = { message: msg, priority: +$("#remPrio").value,
    tag: $("#remTag").value.trim() || "alarm_clock",
    next_fire: Math.floor(when.getTime()/1000), recurring,
    interval_type: recurring ? $("#remIntType").value : null,
    interval_value: recurring ? +$("#remIntVal").value : null,
    days: useDays ? picked : null,
    tz: useDays ? Intl.DateTimeFormat().resolvedOptions().timeZone : null };
  const url = remEditing ? "/api/reminders/"+remEditing : "/api/reminders";
  const r = await fetch(url, {method: remEditing?"PUT":"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ remStatus(j.error || "Save failed", true); return; }
  // The server moves a first fire that lands on an unticked day; say so.
  const moved = j.next_fire !== payload.next_fire ? ` - first fire ${fmtWhen(j.next_fire)}` : "";
  remStatus((remEditing ? "Saved ✓" : "Scheduled ✓") + moved);
  remFormReset(); await loadReminders(); renderNotif();
};

/* Mirrors a pop-up reminder to ntfy. Fire-and-forget: a failed push must
   never block or break the pop-up itself, which is the primary reminder. */
async function pushNtfy(message, title, tag, priority){
  if(!S.settings.ntfyTasks || !ntfyConfigured()) return;
  try {
    await fetch("/api/ntfy/send", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message, title, tag, priority: priority||3})});
  } catch(e){ /* offline or server down - the pop-up already showed */ }
}

// Length of the working day in minutes (work hours less lunch) - the target the "tracked" ring fills towards.
function workMinutes(){
  const s = S.settings;
  let m = Math.max(0, hmToMin(s.dayEnd || "18:00") - hmToMin(s.dayStart || "08:00"));
  if(s.lunchStart && s.lunchEnd) m -= Math.max(0, hmToMin(s.lunchEnd) - hmToMin(s.lunchStart));
  return Math.max(60, m);
}
// Everything logged today plus the running timer. A timer left running overnight only counts from midnight.
function trackedToday(){
  const today = todayISO(), nowM = hmToMin(hmNow());
  let m = 0;
  S.timelog.forEach(e => { if(e.date === today) m += loggedMin(e, today, nowM); });
  if(S.activeTimer){
    const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
    m += Math.max(0, (Date.now() - Math.max(new Date(S.activeTimer.start), midnight)) / 60000);
  }
  return m;
}
// Today's meetings (from the calendar cache) and slotted tasks as one time-ordered list.
function todayAgenda(){
  const cal = calCache[todayISO()] || {events:[]}, ignore = ignoredTitles(), items = [];
  (cal.events || []).forEach(ev => {
    if(ev.allDay || ignore.includes((ev.title || "").toLowerCase().trim())) return;
    const s = new Date(ev.start), en = new Date(ev.end), startM = s.getHours() * 60 + s.getMinutes();
    items.push({kind:"cal", title:ev.title || "(no title)", loc:ev.location || "", startM, endM:Math.max(startM, en.getHours() * 60 + en.getMinutes())});
  });
  S.tasks.forEach(t => {
    if(t.column === firstColK() && t.slot){ const s = hmToMin(t.slot); items.push({kind:"task", title:t.title, startM:s, endM:s + (t.est || 30)}); }
  });
  return items.sort((a, b) => a.startM - b.startM || a.endM - b.endM);
}

let insDays = 30;
const insTable = {time:false, done:false};
// Charts draw each category in its own colour; calendar meetings (a built-in pseudo-category) in neutral grey.
const chartColor = k => k === "meeting" ? safeColor(themeColor("--muted") || "#888888") : catColor(k);
const OTHER = "__other";
const fmtHrs = m => (m / 60).toFixed(1) + "h";

function niceScale(max, ticks){
  if(!(max > 0)) return {max:1, step:1};
  const raw = max / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  return {step, max: Math.ceil(max / step - 1e-9) * step};
}
// Time axis in minutes up to 3h, in hours above that. Returns {max, ticks:[{v, label}]} (v in minutes).
function timeAxis(maxMin){
  const hours = maxMin > 180, k = hours ? 60 : 1, sc = niceScale(maxMin / k, 4), ticks = [];
  for(let i = 0, n = Math.round(sc.max / sc.step); i <= n; i++){
    const v = i * sc.step;
    ticks.push({v: v * k, label: hours ? (Number.isInteger(+v.toFixed(6)) ? v : v.toFixed(1)) + "h" : Math.round(v) + "m"});
  }
  return {max: sc.max * k, ticks};
}
function countAxis(maxV){
  const step = Math.max(1, Math.ceil(niceScale(Math.max(maxV, 1), 4).step)), max = Math.max(step, Math.ceil(maxV / step) * step), ticks = [];
  for(let v = 0; v <= max; v += step) ticks.push({v, label:String(v)});
  return {max, ticks};
}

// Everything the page shows, for the `days` ending today and the same number of days before that.
function insightsData(days){
  const today = todayISO(), nowM = hmToMin(hmNow());
  const start = isoAdd(today, -(days - 1)), step = days <= 31 ? 1 : 7;
  // Buckets are days (up to a month) or 7-day blocks counted back from today; the oldest block may be shorter.
  const buckets = [];
  for(let end = today; end >= start; end = isoAdd(end, -step)) buckets.unshift({from: isoAdd(end, -(step - 1)) < start ? start : isoAdd(end, -(step - 1)), to: end});
  const idx = {}, pidx = {}, dowCount = Array(7).fill(0);
  buckets.forEach((b, i) => { for(let d = b.from; d <= b.to; d = isoAdd(d, 1)){ idx[d] = i; pidx[isoAdd(d, -days)] = i; dowCount[isoDow(d)]++; } });
  const n = buckets.length, perCat = {}, byTask = new Map(), byDow = Array(7).fill(0), active = new Set();
  let tracked = 0, meet = 0, pTracked = 0, pMeet = 0;
  S.timelog.forEach(e => {
    const i = idx[e.date];
    if(i !== undefined){
      const m = loggedMin(e, today, nowM); if(m <= 0) return;
      const k = entCat(e), c = perCat[k] = perCat[k] || {k, min:0, per:Array(n).fill(0)};
      c.min += m; c.per[i] += m; tracked += m; byDow[isoDow(e.date)] += m; active.add(e.date);
      if(e.source === "cal") meet += m;
      const key = e.taskId ? "t:" + e.taskId : "l:" + (e.label || "").toLowerCase(), t = byTask.get(key) || {label:e.label || "(untitled)", k, min:0};
      t.min += m; byTask.set(key, t);
    } else if(pidx[e.date] !== undefined){
      pTracked += e.minutes; if(e.source === "cal") pMeet += e.minutes;
    }
  });
  const actual = {};
  S.timelog.forEach(e => { if(e.taskId) actual[e.taskId] = (actual[e.taskId] || 0) + e.minutes; });
  const done = Array(n).fill(0), pdone = Array(n).fill(0), est = {n:0, within:0, sumEst:0, sumAct:0, rows:[]};
  let doneN = 0, pDoneN = 0;
  (S.completed || []).forEach(c => {
    if(idx[c.date] !== undefined){
      done[idx[c.date]]++; doneN++;
      const act = c.taskId && actual[c.taskId];
      if(act > 0){ est.n++; est.sumEst += c.est; est.sumAct += act; if(act <= c.est * 1.1) est.within++; est.rows.push({title:c.title, est:c.est, act}); }
    } else if(pidx[c.date] !== undefined){ pdone[pidx[c.date]]++; pDoneN++; }
  });
  // Biggest categories first; past eight, the tail folds into "Other" rather than inventing more colours.
  let cats = Object.values(perCat).sort((a, b) => b.min - a.min);
  if(cats.length > 8){
    const rest = cats.slice(7), other = {k:OTHER, min:0, per:Array(n).fill(0)};
    rest.forEach(c => { other.min += c.min; c.per.forEach((v, i) => other.per[i] += v); });
    cats = [...cats.slice(0, 7), other];
  }
  cats.forEach(c => { c.label = c.k === OTHER ? "Other" : catName(c.k); c.color = c.k === OTHER ? "#7c8594" : chartColor(c.k); });
  const totals = buckets.map((_, i) => cats.reduce((a, c) => a + c.per[i], 0));
  return {days, buckets, cats, totals, tracked, meet, pTracked, pMeet, done, pdone, doneN, pDoneN, est, activeDays:active.size,
    dowAvg: byDow.map((m, i) => dowCount[i] ? m / dowCount[i] : 0), top: [...byTask.values()].sort((a, b) => b.min - a.min).slice(0, 6)};
}

const bucketTitle = b => b.from === b.to ? fmtDay(b.from, {weekday:"short", day:"numeric", month:"short"}) : fmtDay(b.from) + " – " + fmtDay(b.to);
const deltaHtml = (cur, prev, goodUp) => {
  if(!(prev > 0)) return "";
  const p = Math.round((cur - prev) / prev * 100), cls = !goodUp || p === 0 ? "" : p > 0 ? "up" : "down";
  return `<div class="d ${cls}">${p > 0 ? "▲" : p < 0 ? "▼" : "■"} ${Math.abs(p)}% vs previous ${insDays === 365 ? "year" : insDays + " days"}</div>`;
};
const axisHtml = ax => ax.ticks.map(t => `<span style="bottom:${(t.v / ax.max * 100).toFixed(2)}%">${t.label}</span>`).join("");
const gridHtml = ax => ax.ticks.filter(t => t.v > 0).map(t => `<div class="chGrid" style="bottom:${(t.v / ax.max * 100).toFixed(2)}%"></div>`).join("");
const xLabelsHtml = buckets => buckets.map((b, i) => `<span style="left:${((i + .5) / buckets.length * 100).toFixed(2)}%">${esc(fmtDay(b.from))}</span>`).join("");

function timeChartHtml(d){
  const ax = timeAxis(Math.max(...d.totals, 1));
  const slots = d.buckets.map((b, i) => {
    const tot = d.totals[i];
    const segs = d.cats.map(c => c.per[i] > 0 ? `<div class="chSeg" style="height:${(c.per[i] / tot * 100).toFixed(2)}%;background-color:${c.color}"></div>` : "").join("");
    return `<div class="chSlot" data-i="${i}"${d.buckets.length <= 31 ? ' tabindex="0"' : ""} aria-label="${esc(bucketTitle(b))}: ${tot ? esc(fmtDur(tot)) : "nothing tracked"}">${tot ? `<div class="chStack" style="height:${(tot / ax.max * 100).toFixed(2)}%">${segs}</div>` : ""}</div>`;
  }).join("");
  return `<div class="ch" style="--chh:220px"><div class="chY">${axisHtml(ax)}</div><div class="chPlot">${gridHtml(ax)}<div class="chBars">${slots}</div></div><div class="chX">${xLabelsHtml(d.buckets)}</div></div>`;
}
function bindTimeTips(root, d){
  root.querySelectorAll("#chTime .chSlot").forEach(el => {
    const i = +el.dataset.i;
    tipOn(el, () => {
      const rows = d.cats.filter(c => c.per[i] > 0).map(c => [c.color, c.label, fmtDur(c.per[i])]);
      if(rows.length > 1) rows.push([null, "Total", fmtDur(d.totals[i])]);
      return [bucketTitle(d.buckets[i]), rows.length ? rows : [[null, "Nothing tracked", ""]]];
    });
  });
}
function doneChartHtml(d){
  const n = d.buckets.length, ax = countAxis(Math.max(...d.done, ...d.pdone, 1));
  const X = i => (i + .5) / n * 100, Y = v => 100 - v / ax.max * 100;
  const path = arr => "M" + arr.map((v, i) => X(i).toFixed(2) + "," + Y(v).toFixed(2)).join(" L");
  const last = d.done[n - 1];
  return `<div class="ch" style="--chh:200px"><div class="chY">${axisHtml(ax)}</div><div class="chPlot">${gridHtml(ax)}
    <svg class="chLine" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="area" d="${path(d.done)} L${X(n - 1).toFixed(2)},100 L${X(0).toFixed(2)},100 Z"/><path class="prev" d="${path(d.pdone)}"/><path class="cur" d="${path(d.done)}"/></svg>
    <span class="chDot" style="left:${X(n - 1).toFixed(2)}%;bottom:${(last / ax.max * 100).toFixed(2)}%"></span><div class="chCross"></div>
    <div class="chHit" tabindex="0" role="img" aria-label="Tasks finished per ${d.days <= 31 ? "day" : "week"}, this period against the one before. Use the arrow keys to step through, or switch to the table."></div></div>
    <div class="chX">${xLabelsHtml(d.buckets)}</div></div>`;
}
function bindDoneTips(root, d){
  const hit = root.querySelector("#chDone .chHit"), cross = root.querySelector("#chDone .chCross"); if(!hit) return;
  const n = d.buckets.length; let cur = n - 1;
  const show = (i, x, y) => {
    cur = Math.max(0, Math.min(n - 1, i));
    cross.style.display = "block"; cross.style.left = ((cur + .5) / n * 100) + "%";
    tip.show(x, y, bucketTitle(d.buckets[cur]), [[themeColor("--accent"), "This period", String(d.done[cur])], [themeColor("--muted"), "Previous", String(d.pdone[cur])]]);
  };
  const at = e => { const r = hit.getBoundingClientRect(); show(Math.floor((e.clientX - r.left) / r.width * n), e.clientX, e.clientY); };
  hit.addEventListener("pointermove", at); hit.addEventListener("pointerenter", at);
  const off = () => { cross.style.display = "none"; tip.hide(); };
  hit.addEventListener("pointerleave", off); hit.addEventListener("blur", off);
  const atCur = () => { const r = hit.getBoundingClientRect(); show(cur, r.left + (cur + .5) / n * r.width, r.top); };
  hit.addEventListener("focus", atCur);
  hit.addEventListener("keydown", e => {
    if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); cur = Math.max(0, Math.min(n - 1, cur + (e.key === "ArrowRight" ? 1 : -1))); atCur();
  });
}
function donutHtml(d){
  if(!d.tracked) return `<div class="emptyNote">Nothing tracked in this period.</div>`;
  let cum = 0;
  const arcs = d.cats.map((c, i) => {
    const pct = c.min / d.tracked * 100, len = Math.max(0, pct - .7), at = cum; cum += pct;
    return len > 0 ? `<circle cx="21" cy="21" r="15.9155" data-i="${i}" stroke="${c.color}" stroke-dasharray="${len.toFixed(2)} ${(100 - len).toFixed(2)}" stroke-dashoffset="${(-at).toFixed(2)}"/>` : "";
  }).join("");
  return `<div class="donutWrap"><div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="Time by category">${arcs}</svg>
      <div class="mid"><b>${esc(fmtDur(d.tracked))}</b><span>tracked</span></div></div>
    <div class="catList">${d.cats.map(c => `<div class="row"><span class="catDot" style="background:${c.color}"></span><span class="nm">${esc(c.label)}</span>
      <span class="tm">${esc(fmtDur(c.min))}</span><span class="pc">${Math.round(c.min / d.tracked * 100)}%</span></div>`).join("")}</div></div>`;
}
function estimateHtml(d){
  const e = d.est;
  if(!e.n) return `<div class="emptyNote">Needs finished tasks that you timed with the ▶ button - estimates are compared with the time logged against each one.</div>`;
  const pct = Math.round(e.within / e.n * 100), ratio = Math.round(e.sumAct / e.sumEst * 100);
  const over = e.rows.filter(r => r.act > r.est * 1.1).sort((a, b) => (b.act - b.est) - (a.act - a.est)).slice(0, 3);
  return `<div class="bigNum">${pct}<small>%</small></div>
    <div class="meter" role="img" aria-label="${pct}% of finished tasks came in within estimate"><i style="width:${pct}%"></i></div>
    <div class="muted small">${e.within} of ${plural(e.n, "finished task")} took no longer than estimated (10% grace). Overall you used <b>${ratio}%</b> of the time you set aside.</div>
    ${over.length ? `<div class="ph" style="margin:14px 0 2px"><div class="s">Biggest overruns</div></div>` + over.map(r => `<div class="hbar"><span class="nm">${esc(r.title)}</span><span class="tm">${esc(fmtDur(r.est))} → ${esc(fmtDur(r.act))}</span></div>`).join("") : ""}`;
}
function topHtml(d){
  if(!d.top.length) return `<div class="emptyNote">Nothing tracked in this period.</div>`;
  const max = d.top[0].min;
  return d.top.map(t => `<div class="hbar"><span class="nm">${esc(t.label)}</span><span class="tm">${esc(fmtDur(t.min))}</span>
    <span class="tr"><i style="width:${(t.min / max * 100).toFixed(1)}%;background:${chartColor(t.k)}"></i></span></div>`).join("");
}
function rhythmHtml(d){
  const max = Math.max(...d.dowAvg), ax = timeAxis(Math.max(max, 1)), names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  if(!d.tracked) return `<div class="emptyNote">Nothing tracked in this period.</div>`;
  const slots = d.dowAvg.map((m, i) => `<div class="chSlot" data-i="${i}" tabindex="0" aria-label="${names[i]}: ${esc(fmtDur(m))} on average">
    <span class="chVal" style="bottom:calc(${(m / ax.max * 100).toFixed(2)}% + 4px)">${m > 0 ? fmtHrs(m) : ""}</span>
    <div class="chSolo${m === max ? " hi" : ""}" style="height:${(m / ax.max * 100).toFixed(2)}%"></div></div>`).join("");
  return `<div class="ch" style="--chh:200px" id="chDow"><div class="chY">${axisHtml(ax)}</div><div class="chPlot">${gridHtml(ax)}<div class="chBars">${slots}</div></div>
    <div class="chX">${names.map((n, i) => `<span style="left:${((i + .5) / 7 * 100).toFixed(2)}%">${n}</span>`).join("")}</div></div>`;
}
function tableHtml(head, rows){
  return `<div class="insTableWrap"><table class="insTable"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(String(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
// Show every Nth x label, N chosen from the widest label and the room per bucket (known only once the plot is on
// screen), counted back from the newest so the latest label always shows.
function thinXLabels(root){
  root.querySelectorAll(".chX").forEach(box => {
    const spans = [...box.querySelectorAll("span")]; if(!spans.length) return;
    const w = Math.max(...spans.map(sp => sp.getBoundingClientRect().width)), slot = box.getBoundingClientRect().width / spans.length;
    const stride = slot > 0 ? Math.max(1, Math.ceil((w + 10) / slot)) : 1;
    spans.forEach((sp, i) => { sp.style.visibility = (spans.length - 1 - i) % stride ? "hidden" : ""; });
  });
}

function renderInsights(){
  tip.hide();
  const sec = $("#view-insights"), d = insightsData(insDays);
  const label = insDays === 365 ? "year" : insDays + " days", weekly = insDays > 31;
  const avgDay = d.activeDays ? d.tracked / d.activeDays : 0, estPct = d.est.n ? Math.round(d.est.within / d.est.n * 100) : null;
  const toggle = k => `<button class="ghost small" data-tbl="${k}" aria-pressed="${insTable[k]}">${insTable[k] ? "Chart" : "Table"}</button>`;
  const timeBody = !d.tracked ? `<div class="emptyNote">Nothing tracked in this period.</div>` : insTable.time
    ? tableHtml(["Period", ...d.cats.map(c => c.label), "Total"], d.buckets.map((b, i) => [bucketTitle(b), ...d.cats.map(c => fmtDur(c.per[i])), fmtDur(d.totals[i])]))
    : `<div id="chTime">${timeChartHtml(d)}</div><div class="leg">${d.cats.map(c => `<span><i style="background:${c.color}"></i>${esc(c.label)}</span>`).join("")}</div>`;
  const doneBody = insTable.done
    ? tableHtml(["Period", "This period", "Previous"], d.buckets.map((b, i) => [bucketTitle(b), d.done[i], d.pdone[i]]))
    : `<div id="chDone">${doneChartHtml(d)}</div><div class="leg"><span><i class="solid"></i>This period</span><span><i class="dash"></i>Previous ${label}</span></div>`;
  sec.innerHTML = `<div class="pageHead"><div class="grow"><h2>Insights</h2><div class="sub">How your time and tasks went over the last ${label}</div></div>
      <div class="acts"><div class="seg" role="group" aria-label="Period">${INS_PERIODS.map(([n, l]) => `<button data-days="${n}" class="${n === insDays ? "on" : ""}" aria-pressed="${n === insDays}">${l}</button>`).join("")}</div></div></div>
    <div class="statRow">
      <div class="stat"><div class="k">Time tracked</div><div class="v">${esc(fmtDur(d.tracked))}</div>${deltaHtml(d.tracked, d.pTracked, false)}</div>
      <div class="stat"><div class="k">Tasks finished</div><div class="v">${d.doneN}</div>${deltaHtml(d.doneN, d.pDoneN, true)}</div>
      <div class="stat"><div class="k">In meetings</div><div class="v">${esc(fmtDur(d.meet))}</div>${d.tracked ? `<div class="d">${Math.round(d.meet / d.tracked * 100)}% of tracked time</div>` : ""}</div>
      <div class="stat"><div class="k">Average active day</div><div class="v">${esc(fmtDur(avgDay))}</div><div class="d">${plural(d.activeDays, "active day")}</div></div>
      <div class="stat"><div class="k">Within estimate</div><div class="v">${estPct === null ? "–" : estPct + "<small>%</small>"}</div>${d.est.n ? `<div class="d">${plural(d.est.n, "task")} compared</div>` : ""}</div></div>
    <div id="insGrid">
      <div class="panel wide"><div class="ph"><div><div class="t">Time tracked</div><div class="s">${weekly ? "Per week" : "Per day"}, by category</div></div><div class="r">${toggle("time")}</div></div>${timeBody}</div>
      <div class="panel"><div class="ph"><div><div class="t">By category</div><div class="s">Where the time went</div></div></div><div id="donutBox">${donutHtml(d)}</div></div>
      <div class="panel"><div class="ph"><div><div class="t">Estimate accuracy</div><div class="s">Estimate against time logged</div></div></div>${estimateHtml(d)}</div>
      <div class="panel wide"><div class="ph"><div><div class="t">Tasks finished</div><div class="s">${weekly ? "Per week" : "Per day"}, against the previous ${label}</div></div><div class="r">${toggle("done")}</div></div>${doneBody}</div>
      <div class="panel"><div class="ph"><div><div class="t">Top tasks</div><div class="s">By time logged</div></div></div>${topHtml(d)}</div>
      <div class="panel"><div class="ph"><div><div class="t">Weekday rhythm</div><div class="s">Average tracked time per weekday</div></div></div>${rhythmHtml(d)}</div></div>`;
  sec.onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.days){ insDays = +b.dataset.days; renderInsights(); }
    else if(b.dataset.tbl){ insTable[b.dataset.tbl] = !insTable[b.dataset.tbl]; renderInsights(); }
  };
  bindTimeTips(sec, d); bindDoneTips(sec, d);
  sec.querySelectorAll("#donutBox circle").forEach(c => {
    const cat = d.cats[+c.dataset.i];
    tipOn(c, () => [cat.label, [[cat.color, fmtDur(cat.min), Math.round(cat.min / d.tracked * 100) + "%"]]]);
  });
  sec.querySelectorAll("#chDow .chSlot").forEach(el => {
    const i = +el.dataset.i;
    tipOn(el, () => [["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"][i], [[themeColor("--accent"), "Average", fmtDur(d.dowAvg[i])]]]);
  });
  thinXLabels(sec);
}

/* ================= settings tab =================
   Every control applies as you change it (the debounced save in markDirty() persists it), so there is no Save button. */
const SET_SECTIONS = [
  ["account", "Account", "user", "c1"], ["appearance", "Appearance", "palette", "c3"], ["hours", "Hours &amp; day", "clock", "c4"],
  ["reminders", "Reminders", "alarm", "c2"], ["ntfy", "Push notifications", "bell", "c7"], ["board", "Board &amp; categories", "board", "c5"],
  ["calendar", "Calendar", "calendar", "c6"], ["data", "Data &amp; backup", "db", "c8"],
];
const sIco = (name, cls) => `<span class="ico ${cls}">${svgIcon(name)}</span>`;
const sTx = (title, desc, msgId) => `<div class="tx"><b>${title}</b>${desc ? `<span>${desc}</span>` : ""}${msgId ? `<span class="setMsg" id="${msgId}"></span>` : ""}</div>`;
const sRow = (ico, cls, title, desc, ctl, msgId) => `<div class="setRow">${sIco(ico, cls)}${sTx(title, desc, msgId)}<div class="ctl">${ctl}</div></div>`;
const sRowCol = (ico, cls, title, desc, body) => `<div class="setRow stk"><div style="display:flex;gap:12px;align-items:center">${sIco(ico, cls)}${sTx(title, desc)}</div><div class="ctl">${body}</div></div>`;
const sSwitch = (id, on, label) => `<label class="toggleSwitch"><input type="checkbox" id="${id}"${on ? " checked" : ""} aria-label="${label}"><span class="toggleSlider"></span></label>`;
const sCard = (id, title, sub, body) => `<section class="panel setCard" id="set-${id}"><div class="ph"><div><div class="t">${title}</div><div class="s">${sub}</div></div></div>${body}</section>`;
const timePair = (a, b, va, vb) => `<input id="${a}" type="time" value="${esc(String(va || ""))}" aria-label="From"><span class="muted small">to</span><input id="${b}" type="time" value="${esc(String(vb || ""))}" aria-label="To">`;
const clampInt = (v, lo, hi, d) => { const n = Math.round(+v); return n >= lo && n <= hi ? n : d; };

// Apply a change to the settings. Other panes (in split view) pick it up straight away.
function setS(patch, opts){
  Object.assign(S.settings, patch);
  if(opts && opts.cal) calCache = {};
  markDirty(); applySettings(); redraw("dash", "board", "today", "insights");
}

function renderSettings(){
  tip.hide();
  const s = S.settings, sec = $("#view-settings");
  const initial = (whoName || "?").charAt(0).toUpperCase();
  const quick = (s.quickTags && s.quickTags.length ? s.quickTags : DEFAULT_QUICK_TAGS).map(t => NTFY_TAG_EMOJI[t] || "").join("");

  const themeTiles = THEMES.map(([k, l]) => `<div class="themeTile${s.theme === k ? " on" : ""}" data-pick="${k}" role="radio" tabindex="0" aria-checked="${s.theme === k}" aria-label="${l} theme">
      <span class="pvbox" data-theme="${k}"><span class="pv"><i class="r"></i><i class="c1"></i><i class="c2"></i><i class="dot"></i></span><span class="nm">${l}</span></span></div>`).join("");
  const fontSeg = `<div class="seg" id="sFontSeg" role="group" aria-label="Font">${FONTS.map(([k, l]) => `<button data-font="${k}" class="${s.font === k ? "on" : ""}" aria-pressed="${s.font === k}">${l}</button>`).join("")}</div>`;

  sec.innerHTML = `<div class="pageHead"><div class="grow"><h2>Settings</h2><div class="sub">Your account, the look of TimePilot, and when it nudges you. Changes save as you make them.</div></div></div>
