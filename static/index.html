<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimePilot</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
/* =====================================================================
   TimePilot Glass - frosted-glass skin. Pure presentation: every id, class
   and data attribute the script relies on is unchanged.
   ===================================================================== */
:root{ --r:18px; --gap:16px; --rail:78px; --pad:18px; }

/* ---- themes: glass tint, card tint, hairline, ambient light orbs ---- */
[data-theme="dark"]{
  /* "Ink": true-black, monochrome, no ambient colour - deliberately unlike the tinted themes */
  color-scheme:dark;
  --bg:#000; --surface:rgba(12,12,13,.80); --surface-strong:rgba(8,8,9,.96);
  --surface2:rgba(255,255,255,.045); --line:rgba(255,255,255,.08); --hi:rgba(255,255,255,.06);
  --text:#ececee; --muted:#85858c; --accent:#e4e4e8; --accent-text:#0a0a0b;
  --cat-general:#7aa2d6; --cat-secops:#e0644f; --cat-change:#a58fd6;
  --cal:#2b3038; --danger:#e0644f; --ok:#4ade80; --lcd-bg:rgba(255,255,255,.04);
  --orb1:rgba(255,255,255,.035); --orb2:rgba(255,255,255,.02); --orb3:rgba(255,255,255,.025);
  --shadow:0 24px 60px -24px rgba(0,0,0,.95);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#ece7e0; --surface:rgba(255,255,255,.56); --surface-strong:rgba(255,255,255,.90);
  --surface2:rgba(255,255,255,.72); --line:rgba(40,25,10,.10); --hi:rgba(255,255,255,.85);
  --text:#2a2420; --muted:#7b7269; --accent:#e8621a; --accent-text:#fff;
  --cat-general:#2f6ea5; --cat-secops:#c0392b; --cat-change:#7d4fc2;
  --cal:#6f88a3; --danger:#c0392b; --ok:#1f9d55; --lcd-bg:rgba(20,28,38,.88);
  --orb1:rgba(255,150,80,.45); --orb2:rgba(140,120,255,.28); --orb3:rgba(255,200,140,.40);
  --shadow:0 24px 50px -26px rgba(60,35,10,.35);
}
[data-theme="htb"]{
  color-scheme:dark;
  --bg:#0a121d; --surface:rgba(24,34,50,.58); --surface-strong:rgba(18,27,41,.88);
  --surface2:rgba(159,239,0,.05); --line:rgba(160,190,240,.12); --hi:rgba(200,225,255,.10);
  --text:#c5d1e6; --muted:#7d8bab; --accent:#9fef00; --accent-text:#0c1420;
  --cat-general:#04d9ff; --cat-secops:#ff3e3e; --cat-change:#cf8dfb;
  --cal:#2f4664; --danger:#ff3e3e; --ok:#9fef00; --lcd-bg:rgba(0,0,0,.42);
  --orb1:rgba(159,239,0,.16); --orb2:rgba(4,217,255,.18); --orb3:rgba(207,141,251,.12);
  --shadow:0 24px 60px -24px rgba(0,0,0,.8);
}
[data-theme="dracula"]{
  color-scheme:dark;
  --bg:#181a24; --surface:rgba(40,42,58,.58); --surface-strong:rgba(33,34,48,.88);
  --surface2:rgba(189,147,249,.07); --line:rgba(255,255,255,.10); --hi:rgba(255,255,255,.10);
  --text:#f8f8f2; --muted:#8a94c2; --accent:#bd93f9; --accent-text:#1d1830;
  --cat-general:#8be9fd; --cat-secops:#ff5555; --cat-change:#bd93f9;
  --cal:#3a3f5c; --danger:#ff5555; --ok:#50fa7b; --lcd-bg:rgba(0,0,0,.42);
  --orb1:rgba(189,147,249,.30); --orb2:rgba(255,121,198,.18); --orb3:rgba(139,233,253,.13);
  --shadow:0 24px 60px -24px rgba(0,0,0,.8);
}
[data-theme="aurora"]{
  color-scheme:dark;
  --bg:#050c11; --surface:rgba(15,32,40,.58); --surface-strong:rgba(10,24,31,.90);
  --surface2:rgba(190,240,255,.06); --line:rgba(160,230,255,.12); --hi:rgba(190,240,255,.13);
  --text:#e8f4f6; --muted:#7fa2ad; --accent:#2dd4bf; --accent-text:#04211d;
  --cat-general:#58a6ff; --cat-secops:#ff6b81; --cat-change:#b794f6;
  --cal:#2e5f78; --danger:#ff6b81; --ok:#34d399; --lcd-bg:rgba(0,0,0,.42);
  --orb1:rgba(45,212,191,.36); --orb2:rgba(139,92,246,.36); --orb3:rgba(56,189,248,.22);
  --shadow:0 24px 60px -24px rgba(0,0,0,.8);
}
[data-font="sans"]{ --ff:"Inter","SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; }
[data-font="mono"]{ --ff:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace; }
[data-font="serif"]{ --ff:Georgia,"Times New Roman",serif; }

/* shared glass recipe */
nav,#strip,#modalBox{
  -webkit-backdrop-filter:blur(26px) saturate(150%); backdrop-filter:blur(26px) saturate(150%);
}
nav,#strip,.col,.panel,#timeline,#modalBox{
  border:1px solid var(--line);
  box-shadow:var(--shadow), inset 0 1px 0 var(--hi);
}

*{box-sizing:border-box;margin:0}
html{background:#0e0c0b}
body{color:var(--text);font-family:var(--ff);font-size:15px;line-height:1.45;letter-spacing:-.005em;
  min-height:100vh;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:var(--pad);padding:var(--pad);
  -webkit-font-smoothing:antialiased}
/* ambient light + grain, fixed behind everything */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    url("/static/grain.svg"),
    radial-gradient(60vmax 46vmax at 6% -6%, var(--orb1), transparent 62%),
    radial-gradient(52vmax 44vmax at 104% 16%, var(--orb2), transparent 62%),
    radial-gradient(70vmax 46vmax at 42% 112%, var(--orb3), transparent 62%),
    var(--bg)}
::selection{background:color-mix(in srgb,var(--accent) 45%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ---- controls ---- */
button{font-family:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface2);
  color:var(--text);border-radius:11px;padding:6px 12px;cursor:pointer;
  transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
button:hover{border-color:color-mix(in srgb,var(--accent) 65%,transparent);background:color-mix(in srgb,var(--accent) 10%,var(--surface2))}
button:active{transform:translateY(1px) scale(.98)}
button.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));
  color:var(--accent-text);border-color:transparent;font-weight:650;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
button.primary:hover{filter:brightness(1.07)}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.danger:hover{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.errText{color:var(--danger)!important;font-weight:600}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--surface2);color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:8px 11px;transition:border-color .15s,box-shadow .15s,background .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--muted) 55%,transparent)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 26%,transparent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox],input[type=range],input[type=radio]{accent-color:var(--accent)}
input[type=color]{padding:2px;cursor:pointer}
option{background:#1d1a18;color:#f5f0ea}
[data-theme="light"] option{background:#fff;color:#2a2420}
h1{font-size:17px;letter-spacing:.02em}
.muted{color:var(--muted)} .small{font-size:12px}

/* ---- left icon rail ---- */
nav{grid-column:1;position:sticky;top:var(--pad);align-self:start;height:calc(100vh - 2*var(--pad));z-index:50;
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0;border-radius:32px;background:var(--surface)}
nav h1.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:14px;font-size:0}
nav h1.brand img{width:40px;height:40px;}
nav .brandName{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
nav .tab{position:relative;width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid transparent;border-radius:16px;color:var(--muted);
  transition:background .18s,color .18s,transform .18s,box-shadow .18s}
nav .tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .tab:hover{background:var(--surface2);color:var(--text);border-color:var(--line);transform:translateY(-1px)}
nav .tab.on{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));
  color:var(--accent-text);border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
nav .tab.pinned::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 9px var(--accent)}
nav .tab .lbl{position:absolute;left:calc(100% + 16px);top:50%;transform:translate(-6px,-50%);opacity:0;pointer-events:none;
  white-space:nowrap;font-size:12px;font-weight:600;letter-spacing:.01em;color:var(--text);
  background:var(--surface-strong);border:1px solid var(--line);border-radius:10px;padding:5px 10px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.6);transition:opacity .15s,transform .15s}
nav .tab:hover .lbl,nav .tab:focus-visible .lbl{opacity:1;transform:translate(0,-50%)}
nav .spacer{margin-top:auto}
#saveDot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:block;margin:0 0 4px;
  box-shadow:0 0 10px var(--ok);transition:background .3s,box-shadow .3s}
#saveDot.dirty{background:var(--accent);box-shadow:0 0 10px var(--accent)}

/* ---- stage: header bar + content ---- */
.stage{grid-column:2;min-width:0}
#topbar{position:sticky;top:var(--pad);z-index:40;margin-bottom:var(--pad)}
#strip{background:var(--surface);border-radius:26px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  transition:box-shadow .4s,border-color .4s}
#strip.running{border-color:color-mix(in srgb,var(--ok) 38%,var(--line));
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
#strip .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
#strip.running .dot{background:var(--ok);animation:pulse 1.6s infinite}
/* On wide screens keep the bar on one row: the gap (auto margin on the chips) closes first, then the task label
   shrinks with an ellipsis. Below this width the bar wraps as before. */
@media(min-width:1100px){#strip{flex-wrap:nowrap}#strip>:not(.chips):not(#timerInfo){flex-shrink:0}#timerInfo{min-width:120px}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#strip.running .dot{animation:none}*{transition:none!important}section[id^="view-"],#modal.open #modalBox{animation:none!important}}
@font-face{font-family:'TP Digital';src:url('/static/digital.woff') format('woff');font-display:swap}
#elapsed.lcd{font-family:'TP Digital','Courier New',ui-monospace,monospace;font-variant-numeric:tabular-nums;
  font-size:30px;font-weight:400;letter-spacing:3px;min-width:136px;text-align:center;
  color:var(--ok);background:var(--lcd-bg);border:1px solid var(--line);border-radius:14px;padding:5px 16px 3px;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.03);
  text-shadow:0 0 8px color-mix(in srgb,var(--ok) 75%,transparent),0 0 22px color-mix(in srgb,var(--ok) 35%,transparent)}
#timerInfo{display:flex;flex-direction:column;line-height:1.2;cursor:pointer;border-radius:12px;padding:4px 10px;transition:background .15s;min-width:0}
#timerInfo:hover{background:var(--surface2)}
#timerInfo.idle{cursor:default}
#timerInfo.idle:hover{background:none}
#timerLabel{font-weight:650;font-size:15px;max-width:34ch;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timerTimes{white-space:nowrap;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
#stopBtn{background:color-mix(in srgb,var(--danger) 16%,transparent);border-color:color-mix(in srgb,var(--danger) 55%,transparent);color:var(--text)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.chip{border-radius:999px;padding:6px 14px;font-size:12px;font-weight:550}
.chip.active{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));
  color:var(--accent-text);border-color:transparent}
.stripActs{display:flex;gap:8px;align-items:center;padding-left:14px;border-left:1px solid var(--line)}
.stripActs .iconBtn{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:14px}
.stripActs .iconBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#splitBtn{height:40px;border-radius:14px;padding:0 14px}
#splitBtn.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

main{padding:0;max-width:none;margin:0}
main.split{display:flex;gap:var(--gap);align-items:flex-start}
main.split > section{flex:1 1 0;min-width:0}
@media(max-width:900px){
  main.split{display:block}
  main.split > section.paneL{display:none!important}
}
section[id^="view-"]{animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- board ---- */
#board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--gap);align-items:start}
.col{background:var(--surface);border-radius:var(--r);padding:14px;min-height:130px;transition:border-color .15s,box-shadow .2s}
.col.dragover{border-color:var(--accent);box-shadow:var(--shadow),0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.col h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center}
.col h2 > span{display:flex;align-items:center}
.card{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:14px;padding:11px 13px;margin-bottom:10px;cursor:grab;
  transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));
  box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}
.card .title{font-weight:620;font-size:14px;letter-spacing:-.01em}
.card .meta{display:flex;gap:6px;align-items:center;margin-top:7px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.card .meta button{padding:2px 7px;font-size:11px;flex:none;border-radius:9px}
.card .meta .metaSpacer{flex:1 1 auto;min-width:0}
.card .meta .hasDet{cursor:pointer;font-size:12px;line-height:1}
.badge{padding:2px 9px;border-radius:999px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.addRow select{font-size:12px;padding:5px;max-width:82px}
.addRow{display:flex;gap:6px;margin-top:6px}
.addRow input{flex:1;min-width:0}

/* ---- today timeline ---- */
#todayWrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:var(--gap)}
@media(max-width:820px){#todayWrap{grid-template-columns:1fr}}
#timeline{position:relative;background:var(--surface);border-radius:var(--r)}
.hourRow{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:3px 12px}
.block{position:absolute;left:66px;right:12px;border-radius:12px;padding:5px 10px;font-size:12px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 20px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14)}
.block .t{font-weight:650}
.block.cal{background:linear-gradient(160deg,color-mix(in srgb,var(--cal) 92%,#fff),var(--cal));color:#fff;border-left:3px solid rgba(255,255,255,.55)}
.block.lunch{background:repeating-linear-gradient(135deg,transparent,transparent 8px,var(--line) 8px,var(--line) 16px);
  color:var(--muted);border:1px dashed var(--line);box-shadow:none;pointer-events:none;font-style:italic}
.block.task{background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 70%)!important;font-weight:650;cursor:grab;user-select:none;touch-action:none;transition:transform .15s,box-shadow .15s}
.block.task:hover{box-shadow:0 12px 26px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.2)}
.block.task:active{cursor:grabbing}
.block.now{left:0;right:0;height:0;border:none;border-top:2px solid var(--accent);border-radius:0;z-index:5;padding:0;overflow:visible}
.block.now::before{content:"";position:absolute;left:-1px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}

/* markdown rendering (Clipboard) */
.mdBody{font-family:var(--ff);font-size:13px;cursor:pointer}
.mdBody h2{font-size:15px;margin:6px 0 3px} .mdBody h3{font-size:14px;margin:5px 0 2px} .mdBody h4{font-size:13px;margin:4px 0 2px}
.mdBody ul,.mdBody ol{margin:4px 0 4px 20px}
.mdBody code{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-family:ui-monospace,monospace;font-size:12px}
.mdBody pre.mdCode{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:5px 0;font-size:12px;overflow-x:auto;font-family:ui-monospace,monospace}
.mdBody a{color:var(--accent)}

.panel{background:var(--surface);border-radius:var(--r);padding:16px}
.panel h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:12px}
.slotItem{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.slotItem:last-child{border-bottom:none}
.slotItem .nm{flex:1;min-width:120px;font-size:13px}
.slotItem input[type=time]{width:100px}

/* ---- notes ---- */
#notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(280px,(100% - 3*var(--gap))/4),1fr));gap:var(--gap)}
#notes .panel{display:flex;flex-direction:column;min-width:0}
#notes .items{flex:1 1 auto}
#notes .addRow{margin-top:10px}
.noteItem{display:flex;gap:6px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.noteItem:last-child{border-bottom:none}
.noteItem .tx{flex:1;min-width:0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer;border-radius:8px;padding:3px 5px;transition:background .15s}
.noteItem .tx:hover{background:var(--surface2)}
.noteItem .tx.flash{outline:2px solid var(--ok)}
.noteItem button{flex:none}
#notes h3 .secBtns{display:flex;gap:4px;margin-left:auto}
#notes h3 .secBtns button{padding:3px 8px;font-size:11px}

/* ---- notifications ---- */
#view-notif{--accent:#ff9a3d}
[data-theme="light"] #view-notif{--accent:#d9701a}
#notifWrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:var(--gap);align-items:start}
@media(max-width:820px){#notifWrap{grid-template-columns:1fr}}
.remItem{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.remItem:last-child{border-bottom:none}
.remItem .rMain{flex:1;min-width:0}
.remItem .rMsg{font-size:13px;overflow-wrap:anywhere;margin-bottom:3px}
.remItem .rMeta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.remItem.editing{outline:1px solid var(--accent);border-radius:12px;padding:11px 8px;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.remItem .rActs{display:flex;gap:4px;flex:none}
.remItem .rActs button{padding:3px 8px;font-size:11px}
.rDue{color:var(--danger);font-weight:600}
.warnBox{background:color-mix(in srgb,var(--danger) 12%,transparent);border:1px solid var(--danger);border-radius:12px;padding:9px 12px;color:var(--text)}

.tagInputRow{display:flex;gap:8px;align-items:center}
.tagPreview{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:19px;
  background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.tagInputRow input{flex:1}
.quickTagRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quickTagRow button{flex:none;width:36px;height:36px;padding:0;font-size:17px;line-height:1;border:1px solid var(--line);
  background:var(--surface2);border-radius:11px;cursor:pointer}
.quickTagRow button:hover{transform:translateY(-2px)}
.quickTagRow button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.quickTagRow .qtEmpty{font-size:12px;color:var(--muted);align-self:center}

.toggleRow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface2);border:1px solid var(--line);
  border-radius:14px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
.toggleRow:hover,.toggleRow.on{border-color:var(--accent)}
.toggleRow.on{background:color-mix(in srgb,var(--accent) 10%,var(--surface2))}
.toggleSwitch{position:relative;width:40px;height:22px;flex:none}
.toggleSwitch input{opacity:0;width:0;height:0;position:absolute}
.toggleSlider{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:.2s;pointer-events:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.toggleSlider::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;
  transition:.2s cubic-bezier(.3,.7,.3,1);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.toggleSwitch input:checked + .toggleSlider{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));
  box-shadow:0 0 14px -2px color-mix(in srgb,var(--accent) 70%,transparent)}
.toggleSwitch input:checked + .toggleSlider::before{transform:translateX(18px)}
.recurOpts{display:none;margin-top:8px;padding:12px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:14px}
.recurOpts.on{display:block}
.recurInputs{display:grid;grid-template-columns:76px 1fr;gap:10px;margin-top:8px}

/* ---- settings accordion ---- */
#modalBox.settings{width:min(580px,100%);display:flex;flex-direction:column;max-height:90vh;padding:0}
#modalBox.settings > h3{padding:20px 22px 12px;margin:0;flex:none}
#setBody{overflow:auto;padding:0 22px;flex:1 1 auto}
#modalBox.settings .mActions{flex:none;padding:14px 22px;border-top:1px solid var(--line);background:transparent;border-radius:0 0 26px 26px;margin:0}
.setSec{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:var(--surface2)}
.setSec > summary{padding:11px 14px;cursor:pointer;font-size:13px;font-weight:650;list-style:none;display:flex;align-items:center;gap:8px;transition:background .15s}
.setSec > summary:hover{background:var(--surface2)}
.setSec > summary::-webkit-details-marker{display:none}
.setSec > summary::before{content:"▸";color:var(--accent);font-size:11px;transition:transform .2s}
.setSec[open] > summary::before{content:"▸";transform:rotate(90deg)}
.setSec .setSecBody{padding:12px 14px 4px;border-top:1px solid var(--line)}
.setSec .fRow:last-child{margin-bottom:8px}

/* ---- export ---- */
#exportWrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap)}
@media(max-width:1100px){#exportWrap{grid-template-columns:1fr}}
#exportWrap .panel{min-width:0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
#exportTable{table-layout:fixed;width:100%;min-width:520px}
#exportTable th:nth-child(1),#exportTable td:nth-child(1){width:auto}
#exportTable th:nth-child(2),#exportTable td:nth-child(2){width:88px}
#exportTable th:nth-child(3),#exportTable td:nth-child(3),
#exportTable th:nth-child(4),#exportTable td:nth-child(4){width:82px}
#exportTable th:nth-child(5),#exportTable td:nth-child(5){width:70px}
#exportTable th:nth-child(6),#exportTable td:nth-child(6){width:70px}
td,th{padding:6px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
td input{width:100%;padding:4px 7px;font-size:13px;border-radius:9px}
#entryRows td:nth-child(2){max-width:0}
#entryRows select{width:100%;min-width:70px;font-size:12px}
td input[type=time]{width:78px;padding:4px 3px;font-size:12px}
td input[type=number]{width:58px}
.labCell{display:flex;align-items:center;gap:5px;white-space:nowrap}
.labCell input{flex:1;min-width:50px;width:auto}
.rowActs{white-space:nowrap}
.rowActs .actWrap{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.rowActs button{padding:3px 8px;line-height:1.4}
#entryRows tr.overlap td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
#entryRows tr.overlap td:nth-child(3) input,#entryRows tr.overlap td:nth-child(4) input{border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
#entryRows tr.gapAfter td{border-bottom:2px solid color-mix(in srgb,var(--ok) 70%,transparent)}
tr.rowDirty td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
pre#exportText{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;
  white-space:pre-wrap;font-size:13px;font-family:ui-monospace,monospace;min-height:140px}

/* ---- snippets / clipboard libraries ---- */
#view-snips{--accent:#c3a0ff}
[data-theme="light"] #view-snips{--accent:#8b5fd0}
.libGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(280px,(100% - 3*var(--gap))/4),1fr));gap:var(--gap);align-items:start}
.libCard .hd{margin-bottom:2px}
.libCard .hd strong{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libCard .hd2{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;margin-bottom:4px;min-height:26px}
.libCard .hd2 button{padding:3px 9px;font-size:11px;flex:none}
.libCard .desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.3em}
.tagB{border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:999px;padding:1px 9px;font-size:10px;font-weight:600;letter-spacing:.05em;flex:none}
.libBody{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;
  font-size:12px;line-height:1.5;height:calc(4 * 1.5em + 20px);overflow:auto;white-space:pre-wrap;word-break:break-word;
  cursor:pointer;font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;transition:border-color .15s}
[data-theme="light"] .libBody{background:rgba(255,255,255,.55)}
.libBody:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.libBody.flash{outline:2px solid var(--ok)}
.libBody.mdBody{white-space:normal;font-family:var(--ff);font-size:13px}
.libBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.libChips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.libBar > [data-search]{flex:0 1 220px;min-width:120px;margin-left:auto;border-radius:999px;padding-left:14px}
.libBar .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- scratchpad ---- */
.scrPanel{display:flex;flex-direction:column;gap:10px}
.scrTools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.scrTools button{padding:4px 10px;font-size:12px}
.scrTools button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.scrTools input{flex:0 1 180px;min-width:110px;font-size:13px;padding:5px 9px}
.scrTools label{display:flex;align-items:center;gap:4px;cursor:pointer}
.scrTools label input{flex:none;min-width:0}
#scrTabs{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.scrTab{display:flex;align-items:center;gap:7px;padding:5px 11px;font-size:12px;color:var(--muted);border-radius:999px}
.scrTab.on{color:var(--text);border-color:var(--accent);font-weight:650;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.scrTab .x{font-size:10px;padding:0 2px;border-radius:4px;opacity:.6}
.scrTab .x:hover{opacity:1;color:var(--danger)}
input.scrRename{font-size:12px;padding:1px 5px;width:120px;min-width:0}
#scrEditor{display:flex;background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  height:calc(100vh - 400px);min-height:240px;box-shadow:inset 0 2px 10px rgba(0,0,0,.25)}
[data-theme="light"] #scrEditor{background:rgba(255,255,255,.6);box-shadow:inset 0 1px 4px rgba(0,0,0,.08)}
#scratchGutter,#scratchTA{font-family:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
#scratchGutter{flex:none;overflow:hidden;text-align:right;padding:10px 8px;background:rgba(255,255,255,.03);
  color:var(--muted);border-right:1px solid var(--line);user-select:none;white-space:pre}
#scratchTA{flex:1;min-width:0;resize:none;border:none;border-radius:0;background:transparent;padding:10px 12px;
  white-space:pre-wrap;overflow-wrap:break-word;tab-size:4;box-shadow:none}
#scratchTA:focus{outline:none;box-shadow:none}
#scratchMirror{position:absolute;visibility:hidden;top:-9999px;left:0;padding:0;border:0;white-space:pre-wrap;overflow-wrap:break-word}

/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(6,4,3,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
#modal.open{display:flex}
#modal.open #modalBox{animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
#modalBox{background:var(--surface-strong);border-radius:26px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.8),inset 0 1px 0 var(--hi)}
#modalBox h3{margin-bottom:14px;font-size:18px;letter-spacing:-.01em}
.fRow{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fRow label{font-size:12px;font-weight:550;color:var(--muted)}
.mActions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.notice{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:12px}

[data-theme="aurora"] option{background:#0f2028;color:#e8f4f6}

/* ---- small screens: rail becomes a bottom dock ---- */
@media(max-width:900px){
  :root{--pad:12px}
  body{grid-template-columns:minmax(0,1fr);padding-bottom:96px}
  .stage{grid-column:1}
  nav{position:fixed;left:12px;right:12px;bottom:12px;top:auto;height:auto;flex-direction:row;justify-content:flex-start;
    overflow-x:auto;padding:8px 10px;border-radius:26px;gap:6px}
  nav h1.brand,nav .spacer,#saveDot,nav .tab .lbl{display:none}
  nav .tab{flex:none;width:46px;height:46px}
  #topbar{position:static}
  .stripActs{border-left:none;padding-left:0;margin-left:auto}
  #splitBtn{display:none}
  .chips{margin-left:0;flex:1 1 100%}
  #scrEditor{height:calc(100vh - 460px)}
}
@media(max-height:640px) and (min-width:901px){
  nav{gap:4px;padding:12px 0}
  nav .tab{width:42px;height:42px}
  nav h1.brand{margin-bottom:6px}
}
@media print{body::before{display:none}nav,#topbar{display:none}}

    </div>
    <div class="panel" style="margin-top:12px">
      <h3>Bulk export (date range)</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        <input type="date" id="bulkFrom"> <span class="muted">→</span> <input type="date" id="bulkTo">
        <button id="bulkGen" class="primary">Generate</button>
        <button id="bulkCopy">Copy</button>
        <button id="bulkCsv">Download CSV</button>
      </div>
      <pre id="bulkText" class="small" style="background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre;overflow-x:auto;font-family:ui-monospace,monospace;min-height:40px"></pre>
    </div>
  </section>
</main>
</div>

<div id="modal"><div id="modalBox"></div></div>

<script>
"use strict";
/* ================= state ================= */
let S = null;               // server state
let dirty = false, saveT = null;
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const THEMES = [["dark","Dark"],["light","Light"],["htb","HackTheBox"],["dracula","Dracula"],["aurora","Aurora"]];
const FONTS = [["sans","Sans"],["mono","Mono"],["serif","Serif"]];
const todayISO = () => new Date().toISOString().slice(0, 10);
const COL_DEFAULTS = [
  {k:"today", label:"Today"},
  {k:"high",  label:"High Priority"},
  {k:"med",   label:"Medium Priority"},
  {k:"low",   label:"Low Priority"},
  {k:"done",  label:"Done", done:true},
];
const COL_MAX = 6;
// The original hardcoded columns, in order. Used once, to map tasks onto the
// defaults above for accounts that predate configurable columns.
const COL_LEGACY = ["today","week","nextweek","nextmonth","done"];

function getCols(){
  const raw = S.settings.columns;
  if(!Array.isArray(raw) || !raw.length) return COL_DEFAULTS.map(c=>({...c}));
  const out = raw.filter(c => c && typeof c === "object" && c.k).slice(0, COL_MAX).map(c => ({
    k: String(c.k),
    label: (typeof c.label === "string" && c.label.trim()) ? c.label.trim() : String(c.k),
    done: !!c.done,
  }));
  if(!out.length) return COL_DEFAULTS.map(c=>({...c}));
  let seen = false;                      // at most one done column
  out.forEach(c => { if(!c.done) return; if(seen) c.done = false; else seen = true; });
  return out;
}
// Whatever sits first is the column the Today tab works from.
const firstColK = () => getCols()[0].k;
const doneColK = () => (getCols().find(c=>c.done) || {}).k || null;
const colLabel = k => (getCols().find(c=>c.k===k) || {}).label || k;

// Accounts created before columns were configurable have no settings.columns
// and tasks sitting in the old keys, so map them onto the new defaults by
// position - This Week becomes High Priority, Next Week becomes Medium, and
// so on. Nothing is orphaned and nothing is piled into Today.
function migrateColumns(){
  if(Array.isArray(S.settings.columns) && S.settings.columns.length) return;
  S.settings.columns = COL_DEFAULTS.map(c=>({...c}));
  const map = {};
  COL_LEGACY.forEach((old, i) => { if(COL_DEFAULTS[i]) map[old] = COL_DEFAULTS[i].k; });
  S.tasks.forEach(t => { if(map[t.column] && map[t.column] !== t.column) t.column = map[t.column]; });
  markDirty();
}
// Safety net for tasks pointing at a column that no longer exists.
function reconcileColumns(){
  const valid = new Set(getCols().map(c=>c.k)), first = firstColK(), done = doneColK();
  let changed = false;
  S.tasks.forEach(t => {
    if(!valid.has(t.column)){ t.column = first; changed = true; }
    if(t.column !== first && t.slot){ t.slot = null; changed = true; }
    if(t.column !== done && t.doneAt){ t.doneAt = null; changed = true; }
  });
  if(changed) markDirty();
}
const DEF_CATS = [{k:"general",label:"General",color:"#5b9bd5"},{k:"meetings",label:"Meetings",color:"#57b76a"},{k:"admin",label:"Admin",color:"#a17ae0"}];
const getCats = () => (S.settings.categories && S.settings.categories.length) ? S.settings.categories : DEF_CATS;
const allCats = () => [...getCats(), {k:"meeting",label:"Meeting",color:null}];
const catOf = k => allCats().find(c=>c.k===k);
const catName = k => (catOf(k)||{label:"?"}).label;
const defCat = () => getCats()[0].k;
const catColorRaw = k => k==="meeting"
  ? (getComputedStyle(document.body).getPropertyValue("--cal").trim() || "#3d566e")
  : ((catOf(k)||{}).color || "#888888");
const catColor = k => safeColor(catColorRaw(k));
const txtOn = hex => { const n = parseInt(hex.replace("#",""),16);
  return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255)) > 150 ? "#141414" : "#ffffff"; };
const badgeHtml = k => { const c = catColor(k);
  return `<span class="badge" style="background:${c};color:${txtOn(c)}">${esc(catName(k))}</span>`; };
const entCat = e => e.category || (e.source==="cal" ? "meeting"
  : ((S.tasks.find(x=>x.id===e.taskId)||{}).category || defCat()));
let view = "board", calCache = {};

async function loadState(){
  const r = await fetch("/api/state");
  if(r.status === 401 || r.redirected){ location.href = "/login"; return; }
  S = await r.json(); migrateColumns(); reconcileColumns(); dailyCleanup(); applySettings(); renderAll();
  // Warm today's calendar in the background rather than waiting for
  // whichever tab happens to trigger the first fetch of the day (often
  // Export). The server caches raw ICS bytes for 5 minutes (CACHE_TTL in
  // app.py) but still re-parses/re-expands recurring events on every call,
  // so a cold cache means a real network round-trip to the ICS URL - that
  // wait just gets moved here, off the critical path, instead of landing
  // on whichever click triggers it. importCalToLog also materializes
  // today's meetings into S.timelog, so a later renderExport()'s own
  // (idempotent, dedup'd via S.calSeen) call finds nothing new to import.
  // Deliberately not awaited - initial render above shouldn't wait on it,
  // and a failure here (no calendar configured, fetch error) is silently
  // fine since every real call site already handles that itself.
  importCalToLog(todayISO()).catch(()=>{});
}
function markDirty(){
  dirty = true; $("#saveDot").classList.add("dirty");
  clearTimeout(saveT); saveT = setTimeout(persist, 600);
}
let _persistPromise = null;
async function persist(){
  while(_persistPromise) await _persistPromise;   // don't overlap writes - wait for one already in flight first
  const snapshot = JSON.stringify(S);
  _persistPromise = (async () => {
    try {
      const r = await fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:snapshot});
      if(!r.ok) throw new Error("save failed "+r.status);
      // only clear the flag if nothing changed while this write was in flight
      if(JSON.stringify(S) === snapshot){ dirty = false; $("#saveDot").classList.remove("dirty"); }
    } catch(e){
      // leave dirty set so a later markDirty/persist retries; surface nothing intrusive
    } finally {
      _persistPromise = null;
    }
  })();
  return _persistPromise;
}
function persistBeacon(){
  try { navigator.sendBeacon("/api/state", new Blob([JSON.stringify(S)], {type:"application/json"})); }
  catch(e){}
}

/* ================= helpers ================= */
const pad = n => String(n).padStart(2,"0");
const hmNow = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
// Local-date YYYY-MM-DD. Deliberately not todayISO()'s toISOString(), which
// is UTC - that shifts the date near midnight and would put a reminder's
// date picker on the wrong day.
const isoOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hmToMin = hm => { const [h,m]=hm.split(":").map(Number); return h*60+m; };
const minToHM = m => pad(Math.floor(m/60))+":"+pad(m%60);
const fmtDur = m => { m=Math.max(0,Math.round(m)); const h=Math.floor(m/60); return (h? h+"h ":"")+(m%60)+"m"; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ascii = s => String(s).replace(/[\u2010-\u2015\u2212]/g,"-").replace(/\u2026/g,"...");
// only allow #hex / rgb() / named colours into style attributes (defence-in-depth vs hand-edited category JSON)
const safeColor = c => (typeof c === "string" && /^(#[0-9a-fA-F]{3,8}|rgb\([\d,\s.]+\)|rgba\([\d,\s.%]+\)|[a-zA-Z]+)$/.test(c.trim())) ? c.trim() : "#888888";

/* ================= settings/theme ================= */
function applySettings(){
  const validThemes = THEMES.map(t=>t[0]), validFonts = FONTS.map(f=>f[0]);
  if(!validThemes.includes(S.settings.theme)) S.settings.theme = "aurora";
  if(!validFonts.includes(S.settings.font)) S.settings.font = "sans";
  document.body.dataset.theme = S.settings.theme;
  document.body.dataset.font = S.settings.font;
}

/* ================= timer ================= */
function startTimer(label, taskId, category){
  stopTimer();
  S.activeTimer = { label, taskId: taskId || null, category: category || null, start: new Date().toISOString() };
  markDirty(); renderStrip();
}
function stopTimer(){
  if(!S.activeTimer) return;
  const t = S.activeTimer, start = new Date(t.start), end = new Date();
  const mins = Math.max(1, Math.round((end - start)/60000));
  const cat = t.category || ((S.tasks.find(x=>x.id===t.taskId)||{}).category) || defCat();
  S.timelog.push({ id:uid(), date: start.toISOString().slice(0,10), label:t.label, taskId:t.taskId, category:cat,
    start: pad(start.getHours())+":"+pad(start.getMinutes()), end: hmNow(), minutes: mins });
  S.activeTimer = null;
  markDirty(); renderStrip(); if(view==="export") renderExport();
}
function renderStrip(){
  const strip = $("#strip"), t = S.activeTimer;
  strip.classList.toggle("running", !!t);
  $("#stopBtn").style.display = t ? "" : "none";
  $("#timerLabel").textContent = t ? t.label : "No timer running";
  $("#timerLabel").classList.toggle("muted", !t);
  $("#timerInfo").classList.toggle("idle", !t);
  const chips = $("#interruptChips"); chips.innerHTML = "";
  (S.settings.interrupts||[]).forEach(name=>{
    const b = document.createElement("button");
    b.className = "chip" + (t && t.label.startsWith(name) ? " active":"");
    b.textContent = name;
    b.onclick = () => interruptModal(name);
    chips.appendChild(b);
  });
  tick();
}
// Today's timelog entry with the latest end time - i.e. whatever was logged
// immediately before "now". That's the entry a backdated timer start should
// extend to meet, since it's the thing that left the gap in the first place.
function lastTimelogEntryToday(){
  const day = todayISO();
  // Calendar meetings get auto-imported into the timelog with their real
  // scheduled end time (see importCalToLog), which can be later today - a
  // meeting at 15:00 has a numerically bigger end than a task that just
  // finished at 11:00, but it hasn't happened yet. Only entries that have
  // actually ended by now are eligible to be "the last thing," or a future
  // meeting would win purely on clock arithmetic.
  const nowMin = hmToMin(hmNow());
  let best = null, bestMin = -1;
  S.timelog.forEach(e => {
    if(e.date !== day) return;
    const m = hmToMin(e.end);
    if(m > nowMin) return;
    if(m > bestMin){ best = e; bestMin = m; }
  });
  return best;
}
async function editTimerModal(){
  const t = S.activeTimer; if(!t) return;
  const st = new Date(t.start);
  const curCat = t.category || ((S.tasks.find(x=>x.id===t.taskId)||{}).category) || defCat();
  openModal(`<h3>Edit current task</h3>
    <div class="fRow"><label>Task name</label><input id="etName" value="${esc(t.label)}"></div>
    <div class="fRow"><label>Category</label><select id="etCat">${allCats().map(c=>`<option value="${esc(String(c.k))}"${curCat===c.k?" selected":""}>${esc(c.label)}</option>`).join("")}</select></div>
    <div class="fRow"><label>Start time (now: running ${fmtDur((Date.now()-st)/60000)})</label><input id="etStart" type="time" value="${pad(st.getHours())}:${pad(st.getMinutes())}">
      <div id="etSyncNote" class="small muted" style="margin-top:4px">Checking today's log…</div>
      <label id="etSyncRow" class="small" style="display:none;margin-top:6px">
        <input type="checkbox" id="etSyncConfirm" checked> <span id="etSyncLabel">Also adjust that entry as shown above</span></label></div>
    <div class="mActions"><button class="danger" id="etDiscard">Discard timer</button><button id="mCancel">Cancel</button><button class="primary" id="etSave">Save</button></div>`);
  const oldStartHM = pad(st.getHours())+":"+pad(st.getMinutes());
  setTimeout(()=>$("#etName").focus(), 50);
  $("#etDiscard").onclick = () => {
    if(!confirm("Discard the running timer without logging it?")) return;
    S.activeTimer = null; markDirty(); closeModal(); renderStrip();
  };
  $("#mCancel").onclick = closeModal;

  // Meetings only land in S.timelog when the Export tab has imported them
  // (importCalToLog) - if today's calendar hasn't been opened yet, a
  // meeting sitting between the stopped task and now simply isn't in
  // S.timelog, so the sync used to reach straight past it to whatever
  // OLDER task happened to be there. Importing here first (same path, same
  // ignore-list, same dedup against deleted entries via S.calSeen the
  // Export tab uses) means the check always sees the real last thing that
  // happened, not just whatever the app happened to already know about.
  // Deliberately not skipped if the modal gets closed before this
  // resolves - it's a harmless, idempotent sync either way.
  try { await importCalToLog(todayISO()); } catch(e){ /* no calendar configured, or fetch failed - fine, just means nothing to add */ }
  if(!$("#etSyncNote")) return;   // modal was closed/replaced while we were awaiting

  // Live preview of the previous-entry sync, recomputed on every keystroke -
  // and, now, backed by a checkbox defaulted ON rather than applying
  // silently. You see exactly what's about to change and can uncheck it for
  // this one correction if it picked the wrong thing (e.g. you were in an
  // unlogged meeting the app doesn't know the boundaries of).
  const updateSyncNote = () => {
    const note = $("#etSyncNote"), row = $("#etSyncRow"), val = $("#etStart").value;
    row.style.display = "none";
    if(!val || val === oldStartHM){ note.textContent = ""; return; }
    if(S.settings.syncLastTaskEnd === false){
      note.textContent = "Previous-entry syncing is off (Settings → Categories & timers).";
      note.className = "small muted"; return;
    }
    const last = lastTimelogEntryToday();
    if(!last){ note.textContent = "No earlier entry logged today to adjust."; note.className = "small muted"; return; }
    if(last.end === val){ note.textContent = `Already matches "${last.label}" - nothing to adjust.`; note.className = "small muted"; return; }
    const mins = hmToMin(val) - hmToMin(last.start);
    if(mins < 1){
      note.textContent = `Won't adjust "${last.label}" - that start is before it began (${last.start}).`;
      note.className = "small errText";
    } else {
      note.textContent = `Last logged: "${last.label}" (${last.source==="cal"?"meeting":"task"}, ${last.start}–${last.end}).`;
      note.className = "small muted";
      row.style.display = "";
      $("#etSyncLabel").textContent = `Also move its end to ${val} to match`;
    }
  };
  $("#etStart").addEventListener("input", updateSyncNote);
  updateSyncNote();

  $("#etSave").onclick = () => {
    const name = $("#etName").value.trim(); if(!name){ alert("Task name required."); return; }
    t.label = name; t.category = $("#etCat").value;
    const [h,m] = $("#etStart").value.split(":").map(Number);
    const ns = new Date(st); ns.setHours(h, m, 0, 0);
    if(ns > new Date()){ alert("Start time can't be in the future."); return; }
    const newStartHM = pad(h)+":"+pad(m);
    if(S.settings.syncLastTaskEnd !== false && newStartHM !== oldStartHM
       && $("#etSyncRow").style.display !== "none" && $("#etSyncConfirm").checked){
      const last = lastTimelogEntryToday();
      if(last && last.end !== newStartHM){
        const mins = hmToMin(newStartHM) - hmToMin(last.start);
        // Only pull the boundary - never push it past the previous entry's
        // OWN start (that would invert or zero out its duration). If the new
        // start lands earlier than that, leave the previous entry alone
        // rather than silently corrupting its logged time. (The note above
        // and the now-hidden checkbox already reflect this.)
        if(mins >= 1){ last.end = newStartHM; last.minutes = mins; }
      }
    }
    t.start = ns.toISOString();
    markDirty(); closeModal(); renderStrip(); if(view==="export") renderExport();
  };
}
$("#timerInfo").onclick = () => { if(S.activeTimer) editTimerModal(); };
function interruptModal(name){
  openModal(`<h3>${esc(name)}</h3>
    <div class="fRow"><label>Detail (optional - ticket #, who, what...)</label><input id="mDetail" maxlength="80"></div>
    <div class="mActions"><button id="mCancel">Cancel</button><button class="primary" id="mGo">▶ Start</button></div>`);
  const go = () => { const d = $("#mDetail").value.trim();
    startTimer(d ? `${name} - ${d}` : name); closeModal(); };
  $("#mGo").onclick = go;
  $("#mCancel").onclick = closeModal;
  $("#mDetail").onkeydown = e => { if(e.key==="Enter") go(); if(e.key==="Escape") closeModal(); };
  setTimeout(()=>$("#mDetail").focus(), 50);
}
let _tickDay = todayISO();
function tick(){
  const d = todayISO();
  if(S && d !== _tickDay){ _tickDay = d; dailyCleanup();
    const shown = [view, pinnedView()];
    if(shown.includes("board")) renderBoard();
    if(shown.includes("today")) renderToday(); }
  const t = S && S.activeTimer;
  if(!t){ $("#elapsed").textContent = "00:00"; $("#timerTimes").textContent = ""; return; }
  const st = new Date(t.start);
  $("#timerTimes").textContent = pad(st.getHours())+":"+pad(st.getMinutes())+" - "+hmNow();
  const s = Math.floor((Date.now() - st)/1000);
  $("#elapsed").textContent = s>=3600
    ? pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)
    : pad(Math.floor(s/60))+":"+pad(s%60);
}
setInterval(tick, 1000);
$("#stopBtn").onclick = stopTimer;

/* ================= board ================= */
function renderBoard(){
  const board = $("#board"); board.innerHTML = "";
  const first = firstColK(), doneK = doneColK();
  getCols().forEach(({k:key,label})=>{
    const col = document.createElement("div"); col.className = "col"; col.dataset.col = key;
    const tasks = S.tasks.filter(t=>t.column===key);
    col.innerHTML = `<h2>${esc(label)}<span><button class="ghost small" title="Add task with full details" style="padding:1px 8px;margin-right:6px">＋</button><span class="muted">${tasks.length}</span></span></h2>`;
    col.querySelector("h2 button").onclick = () => taskModal(null, key);
    tasks.forEach(t => col.appendChild(cardEl(t)));
    col.ondragover = e => { e.preventDefault(); col.classList.add("dragover"); };
    col.ondragleave = () => col.classList.remove("dragover");
    col.ondrop = e => { e.preventDefault(); col.classList.remove("dragover");
      const t = S.tasks.find(x=>x.id===e.dataTransfer.getData("id"));
      if(t){ t.column = key; if(key!==first) t.slot=null;
        t.doneAt = key===doneK ? todayISO() : null;
        markDirty(); renderBoard(); } };
    board.appendChild(col);
  });
}
// Slots are for one day only. slotDay records when a task was slotted, so a
// task left unfinished doesn't reappear at the same time tomorrow. Tasks
// slotted before slotDay existed are stamped today rather than wiped, so
// their slots clear from tomorrow like any other.
function setSlot(t, hm){ t.slot = hm; t.slotDay = todayISO(); }
function dailyCleanup(){
  const today = todayISO(), doneK = doneColK();
  S.tasks.forEach(t=>{
    if(!t.slot){ if(t.slotDay){ delete t.slotDay; markDirty(); } return; }
    if(!t.slotDay){ t.slotDay = today; markDirty(); }
    else if(t.slotDay < today){ t.slot = null; t.reminded = null; delete t.slotDay; markDirty(); }
  });
  if(!doneK) return;                 // no column marked done - nothing auto-clears
  S.tasks.forEach(t=>{ if(t.column===doneK && !t.doneAt) t.doneAt = today; });
  const n = S.tasks.length;
  S.tasks = S.tasks.filter(t => !(t.column===doneK && t.doneAt < today));
  if(S.tasks.length !== n) markDirty();
}
function cardEl(t){
  const el = document.createElement("div");
  el.className = "card"; el.draggable = true;
  el.style.borderLeftColor = catColor(t.category);
  el.innerHTML = `<div class="title">${esc(t.title)}</div>
    <div class="meta">${badgeHtml(t.category)}
    <span>${esc(String(t.est||30))}m</span>${t.slot?`<span>@${esc(String(t.slot))}</span>`:""}
    ${t.details?`<span class="hasDet" title="Has details - click to view">📝</span>`:""}
    <span class="metaSpacer"></span>
    <button title="Start timer">▶</button><button title="Edit">✎</button></div>`;
  el.ondragstart = e => e.dataTransfer.setData("id", t.id);
  const [play, edit] = el.querySelectorAll("button");
  play.onclick = () => startTimer(t.title, t.id);
  edit.onclick = () => taskModal(t);
  const det = el.querySelector(".hasDet");
  if(det) det.onclick = () => taskModal(t);
  return el;
}
function taskModal(t, col){
  const isNew = !t;
  if(isNew) t = { title:"", category:defCat(), column:col||firstColK(), est:30, slot:null };
  openModal(`<h3>${isNew?"New task":"Edit task"}</h3>
    <div class="fRow"><label>Title</label><input id="mTitle" value="${esc(t.title)}"></div>
    <div class="fRow"><label>Category</label><select id="mCat">${getCats().map(c=>`<option value="${esc(String(c.k))}"${t.category===c.k?" selected":""}>${esc(c.label)}</option>`).join("")}</select></div>
    <div class="fRow"><label>Column</label><select id="mCol">${getCols().map(c=>`<option value="${esc(c.k)}"${t.column===c.k?" selected":""}>${esc(c.label)}</option>`).join("")}</select></div>
    <div class="fRow"><label>Estimate (minutes)</label><input id="mEst" type="number" min="5" step="5" value="${esc(String(t.est||30))}"></div>
    <div class="fRow"><label>Details (optional - notes, next steps, log...)</label><textarea id="mDetails" rows="8"
      style="resize:vertical" placeholder="Anything that doesn't fit in the title. Not shown on the board.">${esc(t.details||"")}</textarea></div>
    <div class="mActions">${isNew?"":'<button class="danger" id="mDel">Delete</button>'}<button id="mCancel">Cancel</button><button class="primary" id="mSave">${isNew?"Add":"Save"}</button></div>`);
  $("#modalBox").classList.add("sticky");
  const save = () => {
    const title = $("#mTitle").value.trim();
    if(!title){ alert("Title is required."); return; }
    t.title = title; t.category = $("#mCat").value;
    t.column = $("#mCol").value; t.est = +$("#mEst").value || 30;
    // Stored only when non-blank, so tasks without details stay as they were
    // and the board's 📝 indicator is a plain truthiness check.
    const details = $("#mDetails").value.replace(/\s+$/,"");
    if(details.trim()) t.details = details; else delete t.details;
    if(t.column !== firstColK()) t.slot = null;
    t.doneAt = t.column===doneColK() ? (t.doneAt || todayISO()) : null;
    if(isNew) S.tasks.push({id:uid(), ...t});
    markDirty(); closeModal(); renderBoard(); if(view==="today") renderToday();
  };
  $("#mSave").onclick = save;
  $("#mTitle").onkeydown = e => { if(e.key==="Enter") save(); };

/* ================= today ================= */
async function fetchCal(d, force){
  if(!force && calCache[d]) return calCache[d];
  const r = await fetch(`/api/calendar?date=${d}${force?"&refresh=1":""}`);
  const j = await r.json();
  if(j.error) return calCache[d] = {events:[], error:j.error};
  return calCache[d] = j;
}
async function renderToday(force){
  const cal = await fetchCal(todayISO(), force);
  const note = cal.error ? "Calendar: "+cal.error : (cal.warn ? "Calendar: "+cal.warn : "");
  $("#calNotice").style.display = note ? "" : "none";
  if(note) $("#calNotice").textContent = note;
  // Work hours bound auto-slotting; the display range is what the timeline actually
  // shows/allows dragging into - separate on purpose, so occasional out-of-hours work
  // can be seen and manually placed without "Auto" starting to treat odd hours as normal.
  const workStartM = hmToMin(S.settings.dayStart||"08:00"), workEndM = hmToMin(S.settings.dayEnd||"18:00");
  const viewStartM = hmToMin(S.settings.viewStart || S.settings.dayStart || "08:00");
  const viewEndM = hmToMin(S.settings.viewEnd || S.settings.dayEnd || "18:00");
  const tl = $("#timeline");
  // scale the day to fill the window below the timeline's top edge (min 0.7 px/min, then it scrolls)
  const avail = window.innerHeight - tl.getBoundingClientRect().top - 18;
  const pxPerMin = Math.max(0.7, avail / (viewEndM - viewStartM));
  tl.style.height = (viewEndM-viewStartM)*pxPerMin + "px"; tl.innerHTML = "";
  for(let h=Math.ceil(viewStartM/60); h*60<viewEndM; h++){
    const row = document.createElement("div"); row.className="hourRow";
    row.style.top = (h*60-viewStartM)*pxPerMin+"px"; row.textContent = pad(h)+":00";
    tl.appendChild(row);
  }
  const GUTTER = 56, MARGIN = 8;
  const put = (topM, durM, cls, html, onclick, bg, colInfo) => {
    const b = document.createElement("div"); b.className = "block "+cls;
    b.style.top = (topM-viewStartM)*pxPerMin+"px";
    b.style.height = Math.max(16, durM*pxPerMin-2)+"px";
    if(colInfo && colInfo.totalCols > 1){
      // side-by-side layout for overlapping items, like Outlook/Google Calendar -
      // split the available width evenly across however many columns this cluster needs
      const availW = tl.clientWidth - GUTTER - MARGIN;
      const colW = availW / colInfo.totalCols;
      b.style.left = (GUTTER + colInfo.col*colW) + "px";
      b.style.width = Math.max(24, colW - 3) + "px";
      b.style.right = "auto";
    }
    if(bg){ b.style.background = bg; b.style.color = txtOn(bg); }
    b.innerHTML = html; if(onclick) b.onclick = onclick;
    tl.appendChild(b); return b;
  };
  // Clusters transitively-overlapping items and greedily assigns each a column
  // (first column whose previous occupant has already ended), then records how
  // many columns its whole cluster needed - the same layout every day-view
  // calendar uses so overlapping items sit side by side instead of hiding
  // each other. Only meetings + slotted tasks participate; lunch and the
  // "now" line are background/foreground indicators, not competing content.
  function layoutOverlaps(items){
    items.sort((a,b)=>a.startM-b.startM);
    let cluster = [], clusterEnd = -Infinity;
    const clusters = [];
    for(const it of items){
      if(cluster.length && it.startM >= clusterEnd){ clusters.push(cluster); cluster = []; clusterEnd = -Infinity; }
      cluster.push(it); clusterEnd = Math.max(clusterEnd, it.endM);
    }
    if(cluster.length) clusters.push(cluster);
    for(const cl of clusters){
      const colEnds = [];   // colEnds[i] = end time of the last item placed in column i
      for(const it of cl){
        let placed = false;
        for(let i=0;i<colEnds.length;i++){
          if(colEnds[i] <= it.startM){ it.col = i; colEnds[i] = it.endM; placed = true; break; }
        }
        if(!placed){ it.col = colEnds.length; colEnds.push(it.endM); }
      }
      for(const it of cl) it.totalCols = colEnds.length;
    }
    return items;
  }
  // lunch block - shown if it overlaps the visible range at all, excluded from auto-slot below
  const lunchStartM = S.settings.lunchStart ? hmToMin(S.settings.lunchStart) : null;
  const lunchEndM = S.settings.lunchEnd ? hmToMin(S.settings.lunchEnd) : null;
  const hasLunch = lunchStartM!=null && lunchEndM!=null && lunchEndM > lunchStartM;
  if(hasLunch && lunchEndM > viewStartM && lunchStartM < viewEndM){
    put(Math.max(lunchStartM,viewStartM), Math.min(lunchEndM,viewEndM)-Math.max(lunchStartM,viewStartM),
      "lunch", `<span class="t">Lunch</span>`);
  }
  const ignoreEv = (S.settings.ignoreEvents || ["Private Appointment"]).map(x=>x.toLowerCase().trim()).filter(Boolean);
  const timedEvents = cal.events.filter(e=>!e.allDay && !ignoreEv.includes((e.title||"").toLowerCase().trim()));
  const todayTasks = S.tasks.filter(t=>t.column===firstColK());
  const slottedTasks = todayTasks.filter(t=>t.slot);

  // one shared layout pass across meetings + tasks, so an overlap between the
  // two (not just within one type) still splits side by side correctly
  const layoutItems = [
    ...timedEvents.map(e=>{ const s=new Date(e.start), en=new Date(e.end);
      return { kind:"cal", startM:s.getHours()*60+s.getMinutes(), endM:en.getHours()*60+en.getMinutes(), data:e }; }),
    ...slottedTasks.map(t=>({ kind:"task", startM:hmToMin(t.slot), endM:hmToMin(t.slot)+(t.est||30), data:t })),
  ];
  layoutOverlaps(layoutItems);
  const colOf = it => ({ col: it.col, totalCols: it.totalCols });

  layoutItems.filter(it=>it.kind==="cal").forEach(it=>{
    const e = it.data;
    put(it.startM, it.endM-it.startM, "cal",
      `<span class="t">${esc(e.title)}</span>${e.location?` <span class="small">· ${esc(e.location)}</span>`:""}`,
      null, null, colOf(it));
  });
  layoutItems.filter(it=>it.kind==="task").forEach(it=>{
    const t = it.data;
    const c = catColor(t.category);
    const b = put(it.startM, t.est||30, "task", `<span class="t">${esc(t.title)}</span>`, null, c, colOf(it));
    b.title = "Drag to move, click to edit";
    b.addEventListener("pointerdown", e => {
      if(e.button !== 0) return;
      e.preventDefault(); b.setPointerCapture(e.pointerId);
      const sy = e.clientY, origTop = parseFloat(b.style.top), blkH = b.offsetHeight;
      let moved = false;
      const mv = ev => {
        const dy = ev.clientY - sy;
        if(Math.abs(dy) > 3) moved = true;
        if(moved){
          b.style.top = Math.min((viewEndM-viewStartM)*pxPerMin - blkH, Math.max(0, origTop + dy)) + "px";
          b.style.zIndex = 10;
        }
      };
      const up = () => {
        b.removeEventListener("pointermove", mv);
        b.removeEventListener("pointerup", up); b.removeEventListener("pointercancel", up);
        if(!moved){ taskModal(t); return; }
        let m = viewStartM + parseFloat(b.style.top) / pxPerMin;
        m = Math.round(m / 5) * 5;                                       // snap to 5 min
        m = Math.min(viewEndM - (t.est||30), Math.max(viewStartM, m));   // stay inside the visible range
        setSlot(t, minToHM(m)); markDirty(); renderToday();
      };
      b.addEventListener("pointermove", mv);
      b.addEventListener("pointerup", up);
      b.addEventListener("pointercancel", up);
    });
  });
  const nowM = hmToMin(hmNow());
  if(nowM>=viewStartM && nowM<=viewEndM) put(nowM, 0, "now", "");

  // free-gap finder for auto-slot - respects WORK HOURS (not the wider display range) and skips lunch
  const busy = timedEvents.map(e=>{const s=new Date(e.start),en=new Date(e.end);
    return [s.getHours()*60+s.getMinutes(), en.getHours()*60+en.getMinutes()];})
    .concat(todayTasks.filter(t=>t.slot).map(t=>[hmToMin(t.slot), hmToMin(t.slot)+(t.est||30)]))
    .concat(hasLunch ? [[lunchStartM, lunchEndM]] : [])
    .sort((a,b)=>a[0]-b[0]);
  const firstGap = need => {
    let cur = Math.max(workStartM, nowM);
    for(const [s,e] of busy){ if(s - cur >= need) break; cur = Math.max(cur, e); }
    return cur + need <= workEndM ? cur : null;
  };

  const un = $("#unslotted"), sl = $("#slotted"); un.innerHTML=""; sl.innerHTML="";
  todayTasks.forEach(t=>{
    const row = document.createElement("div"); row.className="slotItem";
    if(!t.slot){
      row.innerHTML = `<span class="badge" style="background:${catColor(t.category)}">&nbsp;</span><span class="nm">${esc(t.title)} <span class="muted small">(${esc(String(t.est||30))}m)</span></span>
        <input type="time"><button>Slot</button><button class="ghost">Auto</button>`;
      const [inp] = row.querySelectorAll("input"), [btn, auto] = row.querySelectorAll("button");
      btn.onclick = () => { if(inp.value){ setSlot(t, inp.value); markDirty(); renderToday(); } };
      auto.onclick = () => { const g = firstGap(t.est||30);
        if(g==null){ alert("No free gap fits within work hours today."); return; }
        setSlot(t, minToHM(g)); markDirty(); renderToday(); };
      un.appendChild(row);
    } else {
      row.innerHTML = `<span class="badge" style="background:${catColor(t.category)}">&nbsp;</span><span class="nm">${esc(t.title)}</span>
        <span class="small muted">@${esc(String(t.slot))}</span><button title="Start timer">▶</button><button class="ghost">Unslot</button>`;
      const [play, unbtn] = row.querySelectorAll("button");
      play.onclick = () => startTimer(t.title, t.id);
      unbtn.onclick = () => { t.slot=null; markDirty(); renderToday(); };
      sl.appendChild(row);
    }
  });
  if(!todayTasks.length) un.innerHTML = `<span class="muted small">No tasks in the ${esc(colLabel(firstColK()))} column.</span>`;
}

/* ================= snippet / clipboard libraries ================= */
const LIBS = { snips:{key:"snippets", label:"snippet", ph:"# code..."},
               paste:{key:"pastes", label:"paste block", ph:"Markdown supported: **bold**, `code`, ``` blocks, - lists, [links](https://...)", md:true} };
const libFilter = {snips:"", paste:""}, libSearch = {snips:"", paste:""};

function moveLibItem(kind, id, dir){
  const arr = S[LIBS[kind].key];
  const i = arr.findIndex(x=>x.id===id), j = i + dir;
  if(i<0 || j<0 || j>=arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  markDirty(); renderLibGrid(kind);
}

function mdRender(src){
  const fences = [];
  let s = src.replace(/```(?:\w*\n)?([\s\S]*?)```/g, (m,c)=>{
    fences.push(c.replace(/\n$/,"")); return "\u0000"+(fences.length-1)+"\u0000"; });
  s = esc(s);
  s = s.replace(/^### (.*)$/gm,"<h4>$1</h4>")
       .replace(/^## (.*)$/gm,"<h3>$1</h3>")
       .replace(/^# (.*)$/gm,"<h2>$1</h2>");
  s = s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
       .replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(?:^|\n)((?:[-*] .*(?:\n|$))+)/g, m =>
    "\n<ul>"+m.trim().split(/\n/).map(l=>"<li>"+l.replace(/^[-*] /,"")+"</li>").join("")+"</ul>");
  s = s.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g, m =>
    "\n<ol>"+m.trim().split(/\n/).map(l=>"<li>"+l.replace(/^\d+\. /,"")+"</li>").join("")+"</ol>");
  s = s.replace(/\n{2,}/g,"<br><br>").replace(/\n/g,"<br>");
  s = s.replace(/<br>(?=<(?:h\d|ul|ol))/g,"").replace(/(<\/(?:h\d|ul|ol)>)<br>/g,"$1");
  s = s.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<pre class="mdCode">${esc(fences[+i])}</pre>`);
  return s;
}

      ${cfg.md ? `<div class="libBody mdBody" title="Click to copy formatted text">${mdRender(it.body)}</div>`
               : `<pre class="libBody" title="Click to copy">${esc(it.body)}</pre>`}`;
    card.querySelector("[data-up]").onclick = () => moveLibItem(kind, it.id, -1);

          })]);
        } else {
          await navigator.clipboard.writeText(it.body);

      const btn = card.querySelector("[data-copy]"), pre = card.querySelector(".libBody");
