const SCR_DEF = {size:13, wrap:true, nums:true};
const SCR_MAX = 8;
const SCR_TF = {
  blanks: t => t.split("\n").filter(l => l.trim() !== "").join("\n"),
  trail:  t => t.split("\n").map(l => l.replace(/[ \t]+$/,"")).join("\n"),
  dedupe: t => { const seen = new Set();
    return t.split("\n").filter(l => seen.has(l) ? false : (seen.add(l), true)).join("\n"); },
  sortA:  t => t.split("\n").sort((a,b) => a.localeCompare(b)).join("\n"),
  sortZ:  t => t.split("\n").sort((a,b) => b.localeCompare(a)).join("\n"),
  rev:    t => t.split("\n").reverse().join("\n"),
  upper:  t => t.toUpperCase(),
  lower:  t => t.toLowerCase(),
};
let scrWired = false, scrGutT = null;

function scrCfg(){
  const c = (S.scratch && typeof S.scratch === "object") ? S.scratch : (S.scratch = {});
  for(const k in SCR_DEF) if(c[k] === undefined) c[k] = SCR_DEF[k];
  if(!Array.isArray(c.pads) || !c.pads.length){
    // seeds the first pad, and carries over the single-pad shape this used
    // to have ({text:...}) for anyone upgrading
    c.pads = [{id:uid(), name:"Note 1", text: typeof c.text === "string" ? c.text : ""}];
  }
  delete c.text;
  c.pads = c.pads.filter(p => p && typeof p === "object").slice(0, SCR_MAX);
  c.pads.forEach(p => {
    if(!p.id) p.id = uid();
    if(typeof p.name !== "string" || !p.name.trim()) p.name = "Note";
    if(typeof p.text !== "string") p.text = "";
  });
  if(!c.pads.some(p => p.id === c.active)) c.active = c.pads[0].id;
  return c;
}
const scrPad = () => { const c = scrCfg(); return c.pads.find(p => p.id === c.active); };

function renderScratch(){
  const ta = $("#scratchTA");
  if(!scrWired){ wireScratch(); scrWired = true; }
  renderScrTabs();
  // The editor markup is static (not rebuilt per render) so the textarea
  // keeps its cursor position across app tab switches. Switching scratch
  // pads does reset the browser's undo stack for it - one textarea, one
  // history - so undo doesn't reach back past a pad switch.
  const pad = scrPad();
  if(ta.value !== pad.text) ta.value = pad.text;
  applyScratchStyle();
}
function renderScrTabs(){
  const c = scrCfg(), strip = $("#scrTabs");
  strip.innerHTML = "";
  c.pads.forEach(p => {
    const b = document.createElement("button");
    b.className = "scrTab" + (p.id === c.active ? " on" : "");
    b.title = "Double-click to rename";
    b.innerHTML = `<span class="nm">${esc(p.name)}</span>` +
      (c.pads.length > 1 ? `<span class="x" title="Close">&#10005;</span>` : "");
    b.onclick = e => {
      if(e.target.classList.contains("x")){ scrClosePad(p.id); return; }
      if(p.id !== c.active){ c.active = p.id; markDirty(); renderScratch(); $("#scratchTA").focus(); }
    };
    b.ondblclick = e => { if(!e.target.classList.contains("x")) scrRenamePad(b, p); };
    strip.appendChild(b);
  });
  if(c.pads.length < SCR_MAX){
    const add = document.createElement("button");
    add.className = "scrTab"; add.textContent = "+"; add.title = "New note";
    add.onclick = () => {
      const p = {id:uid(), name:"Note " + (c.pads.length + 1), text:""};
      c.pads.push(p); c.active = p.id; markDirty(); renderScratch(); $("#scratchTA").focus();
    };
    strip.appendChild(add);
  }
}
function scrRenamePad(btn, p){
  const inp = document.createElement("input");
  inp.className = "scrRename"; inp.value = p.name; inp.maxLength = 30;
  btn.innerHTML = ""; btn.appendChild(inp); inp.focus(); inp.select();
  const done = commit => {
    inp.onblur = null;
    const v = inp.value.trim();
    if(commit && v){ p.name = v; markDirty(); }
    renderScrTabs();
  };
  inp.onblur = () => done(true);
  inp.onkeydown = e => {
    e.stopPropagation();
    if(e.key === "Enter"){ e.preventDefault(); done(true); }
    if(e.key === "Escape"){ e.preventDefault(); done(false); }
  };
}
function scrClosePad(id){
  const c = scrCfg(), p = c.pads.find(x => x.id === id);
  if(!p || c.pads.length < 2) return;               // always keep one pad
  if(p.text.trim() && !confirm(`Close "${p.name}"? Everything in it is deleted.`)) return;
  c.pads = c.pads.filter(x => x.id !== id);
  if(c.active === id) c.active = c.pads[0].id;
  markDirty(); renderScratch();
}
function applyScratchStyle(){
  const c = scrCfg(), ta = $("#scratchTA"), g = $("#scratchGutter");
  ta.style.fontSize = g.style.fontSize = c.size + "px";
  ta.style.whiteSpace = c.wrap ? "pre-wrap" : "pre";
  ta.style.overflowX = c.wrap ? "hidden" : "auto";
  g.style.display = c.nums ? "" : "none";
  $("#scrSize").textContent = c.size + "px";
  $("#scrWrap").classList.toggle("on", c.wrap);
  $("#scrNums").classList.toggle("on", c.nums);
  buildGutter(); scrStatus(); scrCount();
}
function buildGutter(){
  const c = scrCfg(); if(!c.nums) return;
  const ta = $("#scratchTA"), g = $("#scratchGutter"), m = $("#scratchMirror");
  const cs = getComputedStyle(ta), lines = ta.value.split("\n");
  g.style.paddingTop = cs.paddingTop;
  g.style.lineHeight = cs.lineHeight;
  if(!c.wrap || lines.length > 2000){
    // no wrapping (or too many lines to be worth measuring): every logical
    // line is exactly one row, so uniform line-height already lines up
    g.innerHTML = lines.map((_, i) => `<div>${i+1}</div>`).join("");
  } else {
    m.style.font = cs.font;
    m.style.lineHeight = cs.lineHeight;
    m.style.width = (ta.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) + "px";
    m.innerHTML = lines.map(l => `<div>${esc(l) || "&nbsp;"}</div>`).join("");
    g.innerHTML = [...m.children]
      .map((d, i) => `<div style="height:${d.offsetHeight}px">${i+1}</div>`).join("");
  }
  g.scrollTop = ta.scrollTop;
}
function scrStatus(){
  const ta = $("#scratchTA"), v = ta.value, pos = ta.selectionStart;
  const before = v.slice(0, pos), sel = ta.selectionEnd - ta.selectionStart;
  const parts = [
    `Ln ${before.split("\n").length}, Col ${pos - before.lastIndexOf("\n")}`,
    `Lines ${v ? v.split("\n").length : 0}`,
    `Words ${(v.match(/\S+/g) || []).length}`,
    `Chars ${v.length}`,
  ];
  if(sel) parts.push(`Sel ${sel}`);
  $("#scrStatus").textContent = parts.join("  -  ");
}
function scrChanged(){
  scrPad().text = $("#scratchTA").value; markDirty();
  clearTimeout(scrGutT); scrGutT = setTimeout(buildGutter, 60);
  scrStatus(); scrCount();
}
// Writes through execCommand where possible so each edit lands on the
// textarea's own undo stack - Ctrl+Z still walks back through transforms
// and replacements, not just typing.
function scrInsert(text){
  const ta = $("#scratchTA"); ta.focus();
  let ok = false;
  if(text !== ""){ try { ok = document.execCommand("insertText", false, text); } catch(e){} }
  if(!ok) ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
  scrChanged();
}
function scrSetAll(text){
  const ta = $("#scratchTA");
  ta.focus(); ta.setSelectionRange(0, ta.value.length);
  scrInsert(text);
}
function scrRe(){
  const q = $("#scrFind").value; if(!q) return null;
  const src = $("#scrRegex").checked ? q : q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try { return new RegExp(src, "gm" + ($("#scrCase").checked ? "" : "i")); }
  catch(e){ return "err"; }
}
function scrCount(){
  const el = $("#scrCount"), re = scrRe();
  el.classList.toggle("errText", re === "err");
  if(re === "err"){ el.textContent = "bad regex"; return; }
  if(!re){ el.textContent = ""; return; }
  const n = ($("#scratchTA").value.match(re) || []).length;
  el.textContent = n === 1 ? "1 match" : n + " matches";
}
function scrFindNext(){
  const re = scrRe(); if(!re || re === "err") return null;
  const ta = $("#scratchTA");
  re.lastIndex = ta.selectionEnd;
  let m = re.exec(ta.value);
  if(!m){ re.lastIndex = 0; m = re.exec(ta.value); }   // wrap around
  if(!m || m[0] === "") return null;                   // ignore zero-length matches
  ta.focus(); ta.setSelectionRange(m.index, m.index + m[0].length);
  scrStatus(); return m;
}
function scrReplace(){
  const ta = $("#scratchTA"), re = scrRe(); if(!re || re === "err") return;
  const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
  const one = new RegExp(re.source, re.flags.replace("g", ""));
  // only replace when the current selection IS the match - otherwise this
  // press just finds the first hit
  if(sel){
    const m = one.exec(sel);
    if(m && m[0] === sel) scrInsert(sel.replace(one, $("#scrRepl").value));
  }
  scrFindNext();
}
function scrReplaceAll(){
  const ta = $("#scratchTA"), re = scrRe(); if(!re || re === "err") return;
  const n = (ta.value.match(re) || []).length;
  if(!n) return;
  scrSetAll(ta.value.replace(re, $("#scrRepl").value));
  $("#scrCount").textContent = n === 1 ? "1 replaced" : n + " replaced";
}
function scrTransform(key){
  const fn = SCR_TF[key], ta = $("#scratchTA");
  const a = ta.selectionStart, b = ta.selectionEnd;
  if(b > a){ ta.focus(); ta.setSelectionRange(a, b); scrInsert(fn(ta.value.slice(a, b))); }
  else scrSetAll(fn(ta.value));
}
function wireScratch(){
  const ta = $("#scratchTA"), g = $("#scratchGutter");
  ta.oninput = scrChanged;
  ta.onscroll = () => { g.scrollTop = ta.scrollTop; };
  ta.onclick = ta.onkeyup = scrStatus;
  ta.onkeydown = e => {
    if(e.key === "Tab" && !e.shiftKey){ e.preventDefault(); scrInsert("\t"); }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f"){ e.preventDefault(); $("#scrFind").select(); }
  };
  const bump = d => () => {
    const c = scrCfg();
    c.size = Math.min(28, Math.max(10, c.size + d));
    markDirty(); applyScratchStyle();
  };
  $("#scrMinus").onclick = bump(-1);
  $("#scrPlus").onclick = bump(1);
  $("#scrWrap").onclick = () => { const c = scrCfg(); c.wrap = !c.wrap; markDirty(); applyScratchStyle(); };
  $("#scrNums").onclick = () => { const c = scrCfg(); c.nums = !c.nums; markDirty(); applyScratchStyle(); };
  $("#scrCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(ta.value); $("#scrCopy").textContent = "Copied";
      setTimeout(() => { $("#scrCopy").textContent = "Copy all"; }, 1200); } catch(e){}
  };
  $("#scrDl").onclick = () => {
    const url = URL.createObjectURL(new Blob([ta.value], {type:"text/plain"}));
    const a = document.createElement("a");
    const name = (scrPad().name || "scratch").replace(/[^\w.-]+/g, "_");
    a.href = url; a.download = name + "-" + todayISO() + ".txt"; a.click();
    URL.revokeObjectURL(url);
  };
  $("#scrClear").onclick = () => {
    if(ta.value && !confirm(`Clear "${scrPad().name}"?`)) return;
    scrSetAll("");
  };
  $("#scrFind").oninput = scrCount;
  $("#scrFind").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); scrFindNext(); } };
  $("#scrRepl").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); scrReplace(); } };
  $("#scrCase").onchange = $("#scrRegex").onchange = scrCount;
  $("#scrNext").onclick = scrFindNext;
  $("#scrRep").onclick = scrReplace;
  $("#scrRepAll").onclick = scrReplaceAll;
  document.querySelectorAll("#view-scratch [data-tf]").forEach(b => {
    b.onclick = () => scrTransform(b.dataset.tf);
  });
}

/* ================= export ================= */
async function importCalToLog(d){
  S.calSeen = S.calSeen || {};
  const seen = S.calSeen[d] = S.calSeen[d] || [];
  const cal = await fetchCal(d);
  if(cal.error){ $("#expNotice").style.display=""; $("#expNotice").textContent="Calendar: "+cal.error; return; }
  $("#expNotice").style.display = cal.warn ? "" : "none";
  if(cal.warn) $("#expNotice").textContent = "Calendar: "+cal.warn;
  let changed = false;
  const ignore = (S.settings.ignoreEvents || ["Private Appointment"]).map(x=>x.toLowerCase().trim()).filter(Boolean);
  (cal.events||[]).filter(e=>!e.allDay).forEach(ev=>{
    if(ignore.includes((ev.title||"").toLowerCase().trim())) return;   // skip ignored event titles
    const key = ev.start + "|" + ev.title;
    if(seen.includes(key)) return;                 // already imported (or deleted) - don't resurrect
    seen.push(key);
    const s = new Date(ev.start), en = new Date(ev.end);
    S.timelog.push({ id:uid(), date:d, label:ev.title, taskId:null, source:"cal", category:"meeting",
      start: pad(s.getHours())+":"+pad(s.getMinutes()), end: pad(en.getHours())+":"+pad(en.getMinutes()),
      minutes: Math.max(1, Math.round((en - s)/60000)) });
    changed = true;
  });
  if(changed) markDirty();
}
async function renderExport(){
  const d = $("#expDate").value || todayISO(); $("#expDate").value = d;
  try { await importCalToLog(d); } catch(e){ /* calendar issues shouldn't blank the table */ }
  const entries = S.timelog.filter(e=>e.date===d).sort((a,b)=>a.start.localeCompare(b.start));
  const tb = $("#entryRows"); tb.innerHTML = "";
  let reach = -1;   // latest end seen so far; a later start beyond it means a gap
  entries.forEach((e,i)=>{
    const c = entCat(e);
    const tr = document.createElement("tr");
    // flag rows whose time range overlaps another entry (touching end-to-start doesn't count)
    const [s0, e0] = [hmToMin(e.start), hmToMin(e.end)];
    const clash = entries.filter(o => o !== e && hmToMin(o.start) < e0 && s0 < hmToMin(o.end));
    if(clash.length){ tr.classList.add("overlap"); tr.title = "Overlaps: " + clash.map(o=>o.label).join(", "); }
    reach = Math.max(reach, e0);
    const nxt = entries[i+1];
    if(nxt && hmToMin(nxt.start) > reach){
      tr.classList.add("gapAfter");
      tr.title = (tr.title ? tr.title + " - " : "") + "Gap of " + fmtDur(hmToMin(nxt.start) - reach) + " before the next entry";
    }
    tr.innerHTML = `<td><div class="labCell"><span title="${e.source==="cal"?"from calendar":"task/timer entry"}">${e.source==="cal"?"📅":"📋"}</span><input value="${esc(e.label)}"></div></td>
      <td><select>${allCats().map(cc=>`<option value="${esc(String(cc.k))}"${c===cc.k?" selected":""}>${esc(cc.label)}</option>`).join("")}</select></td>
      <td><input type="time" value="${esc(String(e.start))}"></td><td><input type="time" value="${esc(String(e.end))}"></td>
      <td><input type="number" min="1" value="${esc(String(e.minutes))}"></td>
      <td class="rowActs"><span class="actWrap"><button class="ghost small" data-save title="Save changes" disabled>💾</button><button class="ghost small danger" data-del title="Delete">✕</button></span></td>`;
    const [lab, st, en, mi] = tr.querySelectorAll("input"), catSel = tr.querySelector("select");
    const saveBtn = tr.querySelector("[data-save]");
    const dirtyRow = () => { saveBtn.disabled = false; tr.classList.add("rowDirty"); };
    // auto-fill minutes from start/end while typing, but DON'T re-render (no jump)
    const syncMins = () => { const diff = hmToMin(en.value) - hmToMin(st.value); if(diff > 0) mi.value = diff; };
    lab.oninput = dirtyRow; catSel.onchange = dirtyRow; mi.oninput = dirtyRow;
    st.oninput = () => { syncMins(); dirtyRow(); };
    en.oninput = () => { syncMins(); dirtyRow(); };
    const commit = () => {
      e.label = lab.value; e.category = catSel.value;
      e.start = st.value; e.end = en.value; e.minutes = +mi.value || 1;
      markDirty(); renderExport();          // re-sort + refresh totals only on Save
    };
    saveBtn.onclick = commit;
    // Enter in any field of the row saves it
    tr.querySelectorAll("input").forEach(inp => inp.addEventListener("keydown", ev => { if(ev.key==="Enter") commit(); }));
    tr.querySelector("[data-del]").onclick = () => { S.timelog = S.timelog.filter(x=>x.id!==e.id); markDirty(); renderExport(); };
    tb.appendChild(tr);
  });
  const round = +S.settings.rounding || 1;
  const rnd = m => Math.max(round, Math.round(m/round)*round);
  let out;
  const dateHdr = new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
  if($("#expRaw").checked){
    const agg = {};
    entries.forEach(e=>{ agg[e.label] = (agg[e.label]||0) + e.minutes; });
    out = dateHdr+"\n"+Object.entries(agg).map(([label,m])=>`- ${ascii(label)} - ${fmtDur(rnd(m))}`).join("\n");
  } else {
    out = dateHdr+"\n"+entries.map(e=>`${e.start}-${e.end}  ${ascii(e.label)} - ${fmtDur(rnd(e.minutes))}`).join("\n");
  }
  if(entries.length){
    const first = Math.min(...entries.map(e=>hmToMin(e.start)));
    const last = Math.max(...entries.map(e=>hmToMin(e.end)));
    const elapsed = Math.max(0, last - first);
    const total = entries.reduce((a,e)=>a+e.minutes, 0);
    // gaps = elapsed time not covered by any entry (overlapping entries are merged first); overlap = summed entry time minus that merged time
    let covered = 0, edge = first, summed = 0;
    entries.map(e=>[hmToMin(e.start), hmToMin(e.end)]).sort((a,b)=>a[0]-b[0]).forEach(([s,e])=>{
      summed += Math.max(0, e - s);
      if(e > edge){ covered += e - Math.max(s, edge); edge = e; }
    });
    const gaps = Math.max(0, elapsed - covered);
    const overlap = Math.max(0, summed - covered);   // time counted by more than one entry
    out += `\nElapsed Time: ${fmtDur(elapsed)} (${minToHM(first)}-${minToHM(last)})`;
    out += `\nTotal Time: ${fmtDur(total)}`;
    out += `\nGaps: ${fmtDur(gaps)} (${(gaps/60).toFixed(2)})`;
    out += `\nOverlap: ${fmtDur(overlap)} (${(overlap/60).toFixed(2)})`;
  } else out += "No entries.";
  $("#exportText").textContent = out;
}
$("#expDate").onchange = renderExport;
$("#expRaw").onchange = renderExport;
$("#expCalRefresh").onclick = async () => { await fetchCal($("#expDate").value||todayISO(), true); renderExport(); };
$("#copyExport").onclick = async () => {
  await navigator.clipboard.writeText($("#exportText").textContent);
  $("#copyExport").textContent = "Copied ✓"; setTimeout(()=>$("#copyExport").textContent="Copy to clipboard",1500);
};
$("#addEntry").onclick = () => {
  S.timelog.push({id:uid(), date: $("#expDate").value||todayISO(), label:"Manual entry",
    taskId:null, category:defCat(), start:hmNow(), end:hmNow(), minutes:15});
  markDirty(); renderExport();
};

/* ---- bulk export ---- */
let bulkRows = [];
async function bulkGenerate(){
  const f = $("#bulkFrom").value, t = $("#bulkTo").value;
  if(!f || !t || f > t){ alert("Pick a valid from/to range."); return; }
  // Deliberately does NOT re-fetch/re-import the calendar for each day here -
  // whatever's already in a day's Entries screen is treated as final (you may
  // have corrected a meeting that ran over/under, or removed one entirely,
  // and a bulk report is not the place to second-guess that). Visiting the
  // Export tab for a given day is what syncs its calendar entries in the
  // first place; a day never visited simply won't have any calendar-derived
  // rows here yet.
  const round = +S.settings.rounding || 1;
  const rnd = m => Math.max(round, Math.round(m/round)*round);
  // one row per entry with its own times, sorted by date then start
  bulkRows = S.timelog
    .filter(e => e.date >= f && e.date <= t)
    .sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start))
    .map(e => [e.date, e.start, e.end, ascii(e.label), catName(entCat(e)), fmtDur(rnd(e.minutes))]);
  const header = ["Date","Start","End","Task","Category","Time"];
  $("#bulkText").textContent = bulkRows.length
    ? header.join("\t") + "\n" + bulkRows.map(r=>r.join("\t")).join("\n")
    : "No entries in range.";
}
$("#bulkGen").onclick = bulkGenerate;
$("#bulkCopy").onclick = async () => {
  await navigator.clipboard.writeText($("#bulkText").textContent);
  $("#bulkCopy").textContent = "Copied ✓"; setTimeout(()=>$("#bulkCopy").textContent="Copy",1500);
};
$("#bulkCsv").onclick = () => {
  if(!bulkRows.length){ alert("Generate first."); return; }
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const csv = "Date,Start,End,Task,Category,Time\n" + bulkRows.map(r=>r.map(q).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"}));
  a.download = `timesheet_${$("#bulkFrom").value}_${$("#bulkTo").value}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
};

const EMOJI_TO_TAG = Object.fromEntries(EMOJI_TAG_PAIRS.map(([e,t])=>[e,t]));
const NTFY_TAG_EMOJI = Object.fromEntries(EMOJI_TAG_PAIRS.map(([e,t])=>[t,e]));
const DEFAULT_QUICK_TAGS = ["alarm_clock","mailbox_with_mail","warning","rotating_light",
  "calendar","computer","bulb","white_check_mark","closed_lock_with_key","wastebasket"];

// Splits on grapheme clusters (not UTF-16 code units), so a ZWJ sequence or
// skin-tone-modified emoji is treated as the single glyph it visually is.
// Falls back to Array.from (code-point-aware, but not ZWJ-aware) on browsers
// without Intl.Segmenter - a minor degradation, not a crash.
function graphemesOf(str){
  if(window.Intl && Intl.Segmenter){
    return [...new Intl.Segmenter(undefined, {granularity:"grapheme"}).segment(str)].map(s=>s.segment);
  }
  return Array.from(str);
}
const EMOJI_RE = /\p{Extended_Pictographic}/u;
// U+FE0F (variation selector-16) is optional on many emoji - strip it before
// lookup so "🗑️" (with VS16) and "🗑" (without) both resolve.
const emojiToTag = g => EMOJI_TO_TAG[g] || EMOJI_TO_TAG[g.replace(/\uFE0F/g,"")] || null;
// Up to 10 shortcodes, deduped, in the order they were parsed.
function parseQuickTagsInput(str){
  const out = [];
  for(const g of graphemesOf(str||"")){
    if(!EMOJI_RE.test(g)) continue;
    const tag = emojiToTag(g);
    if(tag && !out.includes(tag)) out.push(tag);
    if(out.length >= 10) break;
  }
  return out;
}

function fmtWhen(ts){
  const d = new Date(ts*1000), now = new Date();
  const time = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(isoOf(d) === isoOf(now)) return "Today "+time;
  if(isoOf(d) === isoOf(new Date(now.getTime()+86400000))) return "Tomorrow "+time;
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+time;
}
function fmtInterval(type, val){
  const map = {hours:"hr", days:"day", weeks:"wk", months:"mo"};
  return `every ${val} ${(map[type]||type)+(val>1?"s":"")}`;
}

// Paste/type a single emoji -> auto-converts to its ntfy shortcode. If more
// than one emoji is pasted, only the first is kept (graphemesOf().find below).
// An emoji outside EMOJI_TO_TAG is rejected with a hint rather than silently
// sent - a raw glyph in the Tags header would just vanish (ntfy tags are
// ASCII shortcodes, not literal emoji).
$("#remTag").addEventListener("input", e => {
  const raw = e.target.value;
  if(!raw){ $("#remTagWarn").style.display = "none"; setTagPreview(""); return; }
  if(EMOJI_RE.test(raw)){
    const g = graphemesOf(raw).find(x => EMOJI_RE.test(x));
    const tag = g && emojiToTag(g);
    if(tag){
      e.target.value = tag; $("#remTagWarn").style.display = "none"; setTagPreview(tag);
    } else {
      e.target.value = "";
      $("#remTagWarn").textContent = "Emoji not recognized - try typing a shortcode (e.g. alarm_clock), or pick one below.";
      $("#remTagWarn").style.display = "";
      setTagPreview("");
    }
    return;
  }
  $("#remTagWarn").style.display = "none";
  setTagPreview(raw.trim());
});
function renderQuickTagRow(){
  const tags = (S.settings.quickTags && S.settings.quickTags.length) ? S.settings.quickTags : DEFAULT_QUICK_TAGS;
  const box = $("#quickTagRow"); box.innerHTML = "";
  if(!tags.length){ box.innerHTML = `<span class="qtEmpty">No quick tags set - add some in Settings.</span>`; return; }
  tags.forEach(t=>{

    b.title = t; b.textContent = NTFY_TAG_EMOJI[t] || "🔔";

    box.appendChild(b);
  });
}

$("#remSave").onclick = async () => {
  const msg = $("#remMsg").value.trim();
  if(!msg){ remStatus("Message is required", true); return; }
  if(!$("#remDate").value || !$("#remTime").value){ remStatus("Pick a date and time", true); return; }
  const when = new Date(`${$("#remDate").value}T${$("#remTime").value}`);
  if(isNaN(when)){ remStatus("Invalid date/time", true); return; }
  const recurring = $("#remRecur").checked;
  // A past time on a recurring reminder is fine (the dispatcher rolls it
  // forward to the next occurrence); on a one-off it would just fire instantly.
  if(!recurring && when.getTime() < Date.now()-60000){ remStatus("That time is in the past", true); return; }
  const payload = { message: msg, priority: +$("#remPrio").value,
    tag: $("#remTag").value.trim() || "alarm_clock",
    next_fire: Math.floor(when.getTime()/1000), recurring,
    interval_type: recurring ? $("#remIntType").value : null,
    interval_value: recurring ? +$("#remIntVal").value : null };
  const url = remEditing ? "/api/reminders/"+remEditing : "/api/reminders";
  const r = await fetch(url, {method: remEditing?"PUT":"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ remStatus(j.error || "Save failed", true); return; }
  remStatus(remEditing ? "Saved ✓" : "Scheduled ✓");
  remFormReset(); await loadReminders(); renderNotif();
};

/* Mirrors a pop-up reminder to ntfy. Fire-and-forget: a failed push must
   never block or break the pop-up itself, which is the primary reminder. */
async function pushNtfy(message, title, tag, priority){
  if(!S.settings.ntfyTasks || !ntfyConfigured()) return;
  try {
    await fetch("/api/ntfy/send", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message, title, tag, priority: priority||3})});
  } catch(e){ /* offline or server down - the pop-up already showed */ }
}

    const status = $("#sImportStatus");
    const fail = msg => { status.textContent = msg; status.classList.add("errText"); e.target.value = ""; };
    status.classList.remove("errText");
    let parsed;
    try { parsed = JSON.parse(await file.text()); }
    catch(err){
      const head = new Uint8Array(await file.slice(0,2).arrayBuffer());
      if(head[0]===0x50 && head[1]===0x4B){ fail("That's a .zip file - this expects the JSON file downloaded by \"Export data\"."); return; }
      fail("Not a valid JSON file."); return;
    }
    if(parsed.app !== "timepilot"){ fail("Not a TimePilot export file."); return; }
    const counts = Object.entries(parsed.state||{})
      .filter(([k,v])=>Array.isArray(v)).map(([k,v])=>`${v.length} ${k}`).join(", ");
    if(!confirm(`Import this file? This REPLACES everything currently in your account (${counts}) and cannot be undone.`)){
      e.target.value = ""; return;
    }
    status.textContent = "Importing...";
    const r = await fetch("/api/import", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(parsed)});
    const j = await r.json();
    if(!r.ok){ fail(j.error || "Import failed."); return; }
    status.textContent = "Restored ✓ reloading...";
    setTimeout(() => location.reload(), 700);   // simplest correct way to resync every view with the replaced data
  };
  // --- browser notifications: reflect + request permission on toggle ---
  const notifSupported = "Notification" in window;
  const notifBox = $("#sBrowserNotif"), notifNote = $("#notifPermNote");
  const renderNotifNote = () => {
    if(!notifSupported){ notifNote.textContent = "not supported in this browser"; notifBox.disabled = true; notifBox.checked = false; return; }
    if(Notification.permission === "denied") notifNote.textContent = "blocked - allow notifications for this site in your browser settings";
    else if(Notification.permission === "granted") notifNote.textContent = "permission granted";
    else notifNote.textContent = "will ask for permission when enabled";
  };
  renderNotifNote();
  notifBox.onchange = async () => {
    if(!notifBox.checked) return;               // turning off never needs permission
    if(!notifSupported){ notifBox.checked = false; return; }
    if(Notification.permission === "granted"){ renderNotifNote(); return; }
    const perm = await Notification.requestPermission();
    if(perm !== "granted") notifBox.checked = false;
    renderNotifNote();
  };
  // --- board column manager (works on a copy; applied on Save) ---
  const colsWork = getCols().map(c=>({...c}));
  function drawCols(){
    const box = $("#sCols"); box.innerHTML = "";
    colsWork.forEach((c,i)=>{
      const n = S.tasks.filter(t=>t.column===c.k).length;
      const row = document.createElement("div");
      row.style.cssText = "display:flex;gap:6px;align-items:center;margin-bottom:5px";
      row.innerHTML = `<input maxlength="24" value="${esc(c.label)}" style="flex:1;min-width:0">
        <label class="small muted" style="flex:none;display:flex;gap:4px;align-items:center"
          title="Cards in this column are deleted the next day"><input type="checkbox"${c.done?" checked":""}> clears daily</label>
        <span class="small muted" style="flex:none;min-width:62px;text-align:right">${i===0?"Today source":(n?n+(n===1?" task":" tasks"):"")}</span>
        <button type="button" class="ghost small danger"${colsWork.length<2?" disabled":""}>&#10005;</button>`;
      const [lab, dn] = row.querySelectorAll("input");
      lab.onchange = () => { c.label = lab.value.trim().slice(0,24) || c.label; lab.value = c.label; };
      dn.onchange = () => { colsWork.forEach(x=>x.done=false); c.done = dn.checked; drawCols(); };
      row.querySelector("button").onclick = () => {
        const dest = (i === 0 ? colsWork[1] : colsWork[0]).label;
        if(n && !confirm(`Delete "${c.label}"? Its ${n} task${n===1?"":"s"} move to "${dest}".`)) return;
        colsWork.splice(i,1); drawCols();
      };
      box.appendChild(row);
    });
    $("#sColAdd").disabled = colsWork.length >= COL_MAX;
  }
  drawCols();
  $("#sColAdd").onclick = () => { colsWork.push({k:"col_"+uid(), label:"New column", done:false}); drawCols(); };
  // --- category manager (works on a copy; applied on Save) ---
  const catsWork = getCats().map(c=>({...c}));
  function drawCats(){
    const box = $("#sCats"); box.innerHTML = "";
    catsWork.forEach((c,i)=>{
      const row = document.createElement("div");
      row.style.cssText = "display:flex;gap:6px;align-items:center;margin-bottom:5px";
      row.innerHTML = `<input maxlength="20" value="${esc(c.label)}" style="flex:1;min-width:0">
        <input type="color" value="${safeColor(c.color)}" style="width:40px;height:30px;padding:2px">
        <button type="button" class="ghost small danger"${catsWork.length<2?" disabled":""}>✕</button>`;
      const [lab, col] = row.querySelectorAll("input");
      lab.onchange = () => c.label = lab.value.trim().slice(0,20) || c.label;
      col.oninput = () => c.color = col.value;
      row.querySelector("button").onclick = () => { catsWork.splice(i,1); drawCats(); };
      box.appendChild(row);
    });
  }
  drawCats();
  $("#sCatAdd").onclick = () => { catsWork.push({k:"c_"+uid(), label:"New category", color:"#57b76a"}); drawCats(); };
  $("#sIcsFile").onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    const { token } = await (await fetch("/api/csrf-token")).json();
    const r = await fetch("/api/calendar/upload", {method:"POST", headers:{"X-CSRFToken":token}, body: await file.text()});
    const j = await r.json();
    $("#sIcsStatus").textContent = j.ok ? `Uploaded ✓ (${Math.round(j.size/1024)} KB)` : (j.error || "Upload failed");
    calCache = {};
  };
  $("#mSave").onclick = async () => {
    const lunchStart = $("#sLunchStart").value, lunchEnd = $("#sLunchEnd").value;
    if(lunchStart && lunchEnd && hmToMin(lunchEnd) <= hmToMin(lunchStart)){
      alert("Lunch end time must be after lunch start time."); return;
    }
    Object.assign(s, { icsUrl:$("#sIcs").value.trim(), theme:$("#sTheme").value, font:$("#sFont").value,
      dayStart:$("#sStart").value, dayEnd:$("#sEnd").value, rounding:+$("#sRound").value||5,
      viewStart:$("#sViewStart").value, viewEnd:$("#sViewEnd").value,
      lunchStart, lunchEnd,
      remind:$("#sRemind").checked, remindLead:+$("#sLead").value||0,
      syncLastTaskEnd:$("#sSyncLastEnd").checked,
      remindMeetings:$("#sRemindMeetings").checked,
      browserNotifications:$("#sBrowserNotif").checked,
      ntfyUrl:$("#sNtfyUrl").value.trim(), ntfyTopic:$("#sNtfyTopic").value.trim(),
      ntfyIcon:$("#sNtfyIcon").value.trim(), ntfyTasks:$("#sNtfyTasks").checked,
      quickTags: parseQuickTagsInput($("#sQuickTags").value),
      interrupts:$("#sInt").value.split("\n").map(x=>x.trim()).filter(Boolean),
      ignoreEvents:$("#sIgnore").value.split("\n").map(x=>x.trim()).filter(Boolean),
      categories: catsWork, columns: colsWork });
    const valid = new Set(catsWork.map(c=>c.k));
    S.tasks.forEach(t=>{ if(!valid.has(t.category)) t.category = defCat(); });
    reconcileColumns();   // rehome tasks whose column was renamed away or deleted
    S.timelog.forEach(e=>{ if(e.category && e.category!=="meeting" && !valid.has(e.category)) e.category = defCat(); });
    calCache = {}; markDirty();
    await persist();   // wait for the actual write to land - Settings Save is a deliberate action, not
                        // something that should still be sitting in the 600ms auto-save debounce when
                        // the modal closes and the user immediately checks Today/Export against the server
    applySettings(); closeModal(); renderAll();
  };
  $("#mCancel").onclick = () => { applySettings(); closeModal(); };
};
function openModal(html){ $("#modalBox").innerHTML = html; $("#modalBox").classList.remove("sticky"); $("#modal").classList.add("open"); }
function closeModal(){ $("#modal").classList.remove("open"); $("#modalBox").classList.remove("settings","sticky"); }
// A "sticky" modal (see taskModal) ignores backdrop clicks, so a stray click
// can't throw away typed text - only Cancel/Save/Delete close it.
$("#modal").onclick = e => { if(e.target.id==="modal" && !$("#modalBox").classList.contains("sticky")) closeModal(); };

/* ================= nav ================= */
document.querySelectorAll("nav .tab").forEach(b=>{
  b.onclick = () => setView(b.dataset.view);
});
const VIEWS = ["board","today","notes","snips","paste","scratch","notif","export"];
let prevView = "today";
// The pinned (left-hand) view, or null when not split.
function pinnedView(){
  const p = S.settings.pinView;
  return (p && VIEWS.includes(p) && p !== view) ? p : null;
}
function setView(v){
  if(!VIEWS.includes(v)) return;
  // Clicking the pinned tab swaps the two panes rather than doing nothing.
  if(v === pinnedView()){ S.settings.pinView = view; markDirty(); }
  if(v !== view) prevView = view;
  view = v;
  const pin = pinnedView();
  document.querySelector("main").classList.toggle("split", !!pin);
  document.querySelectorAll("nav .tab").forEach(b=>{
    b.classList.toggle("on", b.dataset.view===v);
    b.classList.toggle("pinned", b.dataset.view===pin);
  });
  VIEWS.forEach(x=>{
    const el = $("#view-"+x), shown = x===v || x===pin;
    el.style.display = shown ? "" : "none";
    el.style.order = x===pin ? 0 : 1;      // pinned view sits on the left
    el.classList.toggle("paneL", x===pin);
  });
  renderView(v);
  if(pin) renderView(pin);
  updateSplitBtn();
}
function renderView(v){
  if(v==="board") renderBoard();
  if(v==="today") renderToday();
  if(v==="notes") renderNotes();
  if(v==="snips"||v==="paste") renderLib(v);
  if(v==="scratch") renderScratch();
  if(v==="notif"){ remFormReset(); loadReminders().then(renderNotif); }
  if(v==="export") renderExport();
}
function tabLabel(v){
  const b = document.querySelector(`nav .tab[data-view="${v}"]`);
  return b ? b.textContent : v;
}
function updateSplitBtn(){
  const pin = pinnedView(), b = $("#splitBtn");
  b.classList.toggle("on", !!pin);
  b.innerHTML = pin ? `&#9707; ${esc(tabLabel(pin))} &#10005;` : "&#9707; Split";
  b.title = pin ? "Unpin - back to one tab at a time"
                : "Pin this tab to the left half of the screen";
}
$("#splitBtn").onclick = () => {
  if(pinnedView()){ S.settings.pinView = ""; markDirty(); setView(view); return; }
  // Pin what's on screen now, and put the tab you were on last (or the first
  // other one) in the right-hand pane.
  S.settings.pinView = view;
  markDirty();
  setView(prevView !== view ? prevView : VIEWS.find(x=>x!==view));
};
function renderAll(){ renderStrip(); setView(view); }

/* ================= slotted-task reminders ================= */
function checkReminders(){
  if(!S || $("#modal").classList.contains("open")) return;   // don't interrupt an open dialog; retries next tick
  if(S.settings.remind !== false) checkTaskReminders();
  if(S.settings.remindMeetings) checkMeetingReminders();
}
function checkTaskReminders(){
  const lead = +S.settings.remindLead || 0;
  const now = hmToMin(hmNow());
  const today = todayISO();
  // Fire only inside a window: from (slot - lead) up to (slot + GRACE) minutes.
  // Past that grace period the reminder is considered missed and won't pop -
  // so opening the app late doesn't dump every earlier task on you.
  const GRACE = 10;
  const due = S.tasks.find(t => {
    if(t.column !== firstColK() || !t.slot) return false;
    if(t.reminded === today+" "+t.slot) return false;          // already shown for this slot today
    if(S.activeTimer && S.activeTimer.taskId === t.id) return false;
    const at = hmToMin(t.slot);
    return now >= at - lead && now <= at + GRACE;              // only within the window
  });
  if(!due) return;
  due.reminded = today+" "+due.slot; markDirty();
  const taskBody = `Slotted for ${due.slot} · ${catName(due.category)} · ${due.est||30}m`;
  fireBrowserNotification("⏰ Task due: "+due.title, taskBody, "task-"+due.id);
  pushNtfy(taskBody, "⏰ Task due: "+due.title, "alarm_clock", 4);
  reminderModal(due);
}

// Meetings live in the calendar, not S.tasks, so "already reminded" can't be
// stored on the task. It's kept in memory only: a page reload inside the same
// short window may re-pop a meeting, which is a fair trade against writing
// per-meeting flags into saved state on every tick.
const metReminded = new Set();
let metCalAt = 0;
async function checkMeetingReminders(){
  const today = todayISO();
  // Can't rely on renderToday having run - you might sit on the Board tab all
  // day. Fetch it here, refreshing every 10 min so meetings added after the
  // first load still get a reminder. The server caches ICS for 5 min anyway,
  // so this is cheap.
  if(!calCache[today] || Date.now() - metCalAt > 600000){
    metCalAt = Date.now();
    try { await fetchCal(today, !!calCache[today]); } catch(e){ return; }
  }
  const cal = calCache[today];
  if(!cal || !cal.events) return;
  const lead = +S.settings.remindLead || 0;
  const now = hmToMin(hmNow());
  const GRACE = 10;
  const ignore = (S.settings.ignoreEvents || ["Private Appointment"]).map(x=>x.toLowerCase().trim()).filter(Boolean);
  const due = cal.events.find(ev => {
    if(ev.allDay) return false;
    const title = (ev.title||"").toLowerCase();
    if(ignore.some(x => title.includes(x))) return false;
    const at = new Date(ev.start);
    if(isoOf(at) !== today) return false;
    const atM = at.getHours()*60 + at.getMinutes();
    if(metReminded.has(today+"|"+ev.title+"|"+ev.start)) return false;
    return now >= atM - lead && now <= atM + GRACE;
  });
  if(!due) return;
  if($("#modal").classList.contains("open")) return;   // re-check: we awaited above
  metReminded.add(today+"|"+due.title+"|"+due.start);
  const at = new Date(due.start);
  const hm = pad(at.getHours())+":"+pad(at.getMinutes());
  const body = `Starts at ${hm}${due.location?" · "+due.location:""}`;
  fireBrowserNotification("📅 Meeting: "+due.title, body, "cal-"+due.start);
  pushNtfy(body, "📅 Meeting: "+due.title, "calendar", 4);
  meetingModal(due, hm);
}
function meetingModal(ev, hm){
  openModal(`<h3>📅 Meeting: ${esc(ev.title)}</h3>
    <p class="muted small" style="margin-bottom:14px">Starts at ${esc(hm)}${ev.location?" · "+esc(ev.location):""}</p>
    <div class="mActions" style="justify-content:flex-start;flex-wrap:wrap">
      <button class="primary" id="rStart">▶ Start timer</button>
      <button class="ghost" id="rDismiss">Dismiss</button></div>`);
  $("#rStart").onclick = () => { startTimer(ev.title, null, "meeting"); closeModal(); };
  $("#rDismiss").onclick = closeModal;
}
function fireBrowserNotification(title, body, key){
  if(!S.settings.browserNotifications) return;
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  try{
    const n = new Notification(title, {
      body,
      icon: "/static/favicon.png",
      tag: "timepilot-reminder-"+key,   // replaces any earlier notification for the same item rather than stacking
    });
    n.onclick = () => { window.focus(); n.close(); };
  } catch(e){ /* some browsers reject construction outside a user gesture in edge cases - the modal still shows either way */ }
}
function reminderModal(t){
  openModal(`<h3>⏰ Task due: ${esc(t.title)}</h3>
    <p class="muted small" style="margin-bottom:14px">Slotted for ${esc(String(t.slot))} · ${esc(catName(t.category))} · ${esc(String(t.est||30))}m estimate</p>
    <div class="mActions" style="justify-content:flex-start;flex-wrap:wrap">
      <button class="primary" id="rStart">▶ Start now</button>
      <button id="r15">+15m</button><button id="r30">+30m</button><button id="r60">+1h</button>
      <button class="ghost" id="rDismiss">Dismiss</button></div>`);
  $("#rStart").onclick = () => { startTimer(t.title, t.id); closeModal(); };
  const push = mins => () => {
    const endM = hmToMin(S.settings.dayEnd||"18:00");
    // push from whichever is later - the slot or now - so a late push always
    // lands in the future, which means (now < newSlot - lead) and the window
    // check won't re-fire until that new time actually arrives.
    let m = Math.max(hmToMin(t.slot), hmToMin(hmNow())) + mins;
    m = Math.min(endM - (t.est||30), m);
    setSlot(t, minToHM(m));
    t.reminded = null;    // re-arm: it will fire again when the new slot time arrives
    markDirty(); closeModal(); if(view==="today") renderToday();
  };
  $("#r15").onclick = push(15); $("#r30").onclick = push(30); $("#r60").onclick = push(60);
  $("#rDismiss").onclick = closeModal;
}
setInterval(checkReminders, 20000);

let _rzT, _rzW = window.innerWidth;
window.addEventListener("resize", () => {
  clearTimeout(_rzT);
  _rzT = setTimeout(()=>{
    // A resize can fire just from a mobile on-screen keyboard opening (typing
    // into a time/text field changes the visual viewport height) - re-rendering
    // in that moment would wipe out whatever the user is mid-typing, since
    // unslotted-task inputs aren't tied to app state until "Slot" is clicked.
    const ae = document.activeElement;
    if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
    // Mobile browsers also fire "resize" purely from their own address bar
    // collapsing/expanding as you scroll - innerHeight shifts, innerWidth
    // doesn't. Since the timeline's row height is derived from innerHeight
    // (see renderToday), reacting to that made every scroll subtly rescale
    // the whole timeline mid-motion. A real resize - including rotating the
    // device - always changes width too, so that's the signal to act on.
    const w = window.innerWidth, changed = w !== _rzW; _rzW = w;
    if(changed && view==="today") renderToday();
  }, 150);
});

window.addEventListener("beforeunload", () => { if(dirty) persistBeacon(); });
$("#logoutBtn").onclick = async () => {
  if(dirty) await persist();  // don't lose in-flight edits
  const { token } = await (await fetch("/api/csrf-token")).json();
  await fetch("/logout", { method: "POST", headers: { "X-CSRFToken": token } });
  location.href = "/login";
};
loadState();
